<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 热爱生活7885 图标（中性默认皮肤）：蓝色圆角底 + 白色“爱心定位针”。
       满版版本：maskable 和 apple-touch-icon 用（系统自己裁圆角），图形都在中心 40% 半径的安全区内。
       改图后运行 npm run images 重新生成 PNG。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B8EFF"/>
      <stop offset="1" stop-color="#0057C2"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F0FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="420" rx="74" ry="15" fill="#001F4D" opacity="0.22"/>
  <path d="M256 410C214 362 138 294 138 214a118 118 0 0 1 236 0c0 80-76 148-118 196z" fill="url(#pin)"/>
  <path d="M256 268s-54-34-54-68c0-19 15-32 31-32 11 0 18 6 23 13 5-7 12-13 23-13 16 0 31 13 31 32 0 34-54 68-54 68z" fill="#0A6AE0"/>
</svg>
