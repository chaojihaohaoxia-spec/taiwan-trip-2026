<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台北路线入口</title>
  <style>
    :root {
      --ink: #13213a;
      --muted: #5f708d;
      --line: #d8e2f1;
      --blue: #1f6feb;
      --green: #11845b;
      --bg: #f5f8fc;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 920px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 6vw, 44px);
    }
    p {
      margin: 0;
      line-height: 1.7;
    }
    .lead {
      color: #42526b;
      font-size: 16px;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .card {
      display: grid;
      gap: 12px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 10px 24px rgba(30, 48, 80, .06);
    }
    .tag {
      display: inline-flex;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      color: #0c6848;
      background: #dff4ea;
    }
    .tag.blue {
      color: #204f91;
      background: #e8f1ff;
    }
    h2 {
      margin: 0;
      font-size: 22px;
    }
    .desc {
      color: var(--muted);
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      background: var(--blue);
    }
    .button.green {
      background: var(--green);
    }
    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>台北路线入口</h1>
    <p class="lead">这里把你现在会用到的两张页面放在一起：一张是台北两日大路线，一张是台大校园散步互动地图。手机上点开就能直接用。</p>

    <div class="grid">
      <section class="card">
        <span class="tag blue">台北行程</span>
        <h2>台北 5/16 + 5/17 路线图</h2>
        <p class="desc">包含 101、永康街、台大 / 公馆、女书店、女巫店，以及 5/17 的淡水白天版和台北大巨蛋演唱会动线。</p>
        <div class="actions">
          <a class="button" href="./taipei-2026-05-16-19-route.html">打开路线图</a>
        </div>
      </section>

      <section class="card">
        <span class="tag">台大散步</span>
        <h2>台大校园互动散步地图</h2>
        <p class="desc">从综合体育馆出发，带你走醉月湖、总图、椰林大道、傅钟、文学院、校史馆外观和校门，还能显示你当前定位。</p>
        <div class="actions">
          <a class="button green" href="./ntu-campus-walk-live.html">打开互动地图</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
