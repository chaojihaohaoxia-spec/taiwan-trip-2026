      const main = renderMainContent();
      return `
        <div class="travel-app ${currentThemeClass()} view-${appState.currentView}">
          ${renderTopbar()}
          <div class="app-shell">
            ${renderSidebar()}
            <main class="main-stage">${renderInlineRail()}${main}</main>
            ${renderRightRail()}
          </div>
          ${renderMobileNav()}
          ${renderDrawer()}
        </div>
      `;
    }

    function renderTopbar() {
      return `
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark">${icon("map", "icon-sm")}</div>
            <div class="brand-title">
              <div class="trip-title-row">
                <strong>${esc(currentTripTitle())}</strong>
                ${appState.userTrips?.length > 1 ? `<button class="btn btn-small btn-ghost trip-switch-btn" onclick="goTripList()">${icon("shuffle", "icon-sm")} 切换</button>` : ""}
              </div>
              <span>${esc(currentTripDateRange())}</span>
            </div>
          </div>
          <div class="top-actions">
            ${renderUserSessionControls()}
            ${isTaiwanTripSelected() ? `
              <button class="btn btn-ghost home-mobile" onclick="goJourneySelect()">${icon("chevron-left", "icon-sm")} <span>回到出发页</span></button>
              <button class="btn btn-ghost keep-mobile" onclick="openDrawer('confirm')">${icon("circle-help", "icon-sm")} 待确认中心</button>
              <button class="btn btn-primary keep-mobile" onclick="goSpotReviews()">${icon("star", "icon-sm")} 评级中心</button>
              <button class="btn btn-ghost keep-mobile" onclick="openDrawer('settings')">${icon("settings", "icon-sm")} 设置</button>
            ` : ""}
          </div>
        </header>
      `;
    }

    function renderSidebar() {
      const currentCity = selectedCity();
      return `
        <aside class="side-nav card">
          <div class="side-title">总览</div>
          <button class="nav-btn ${appState.currentView === "trip-dashboard" ? "active" : ""}" onclick="goDashboard()">
            ${icon("layout-dashboard", "icon-sm")} 台湾总览
          </button>
          <button class="nav-btn ${appState.currentView === "spot-reviews" ? "active" : ""}" onclick="goSpotReviews()">
            ${icon("star", "icon-sm")} 行程评级
            <small>${spotRatingStats().total} 点</small>
          </button>
          <div class="side-divider"></div>
          <div class="side-title">城市</div>
          ${Object.values(tripData.cities).map(city => `
            <button class="nav-btn ${appState.selectedCity === city.id ? "active" : ""}" onclick="selectCity('${city.id}')">
              ${icon(city.id === "kenting" ? "waves" : city.id === "taipei" ? "building-2" : "ship", "icon-sm")}
              ${esc(city.name)}
              <small>${esc(city.range)}</small>
            </button>
          `).join("")}
          ${currentCity ? `
            <div class="side-divider"></div>
            <div class="side-title">日期 · ${esc(currentCity.name)}</div>
            ${daysForCity(currentCity.id).map(day => {
              const context = dayContext(day, currentCity.id);
              return `
                <button class="nav-btn ${appState.selectedDay === day.id ? "active" : ""}" onclick="selectDay('${day.id}', '${currentCity.id}')">
                  ${icon(day.planned ? "calendar-check" : "calendar-clock", "icon-sm")}
                  ${esc(context.label)}
                  <small>${esc(context.title)}</small>
                </button>
              `;
            }).join("")}
          ` : ""}
        </aside>
      `;
    }

    function railContext() {
      const day = selectedDay();
      const city = selectedCity();
      const reminders = day?.reminders?.slice(0, 2) || tripData.globalConfirmations.slice(0, 3);
      return { day, city, reminders };
    }

    function renderRailCards(cardClass = "rail-card card") {
      const { day, city, reminders } = railContext();
      return `
        <section class="${cardClass}">
          <h3>${day ? "今天怎么走" : city ? "城市节奏" : "手边提醒"}</h3>
          <div class="rail-muted">${esc(day?.focus || city?.intro || tripData.route.join(" → "))}</div>
        </section>
        <section class="${cardClass}">
          <h3>待确认</h3>
          <div class="info-list">
            ${reminders.map(item => `<div>${icon("circle-help", "icon-sm")} ${esc(item)}</div>`).join("")}
          </div>
          <button class="btn btn-small btn-ghost rail-action" onclick="openDrawer('confirm')">打开待确认中心</button>
        </section>
        <section class="${cardClass}">
          <h3>旅行小账本</h3>
          <div class="rail-muted">已添加 ${userExpenseTotalCount()} 个自定义费用。已知费用按日期保留原币种，现场再补更稳。</div>
          <button class="btn btn-small btn-ghost rail-action" onclick="goExpenses()">${icon("receipt-text", "icon-sm")} 打开账本</button>
        </section>
      `;
    }

    function renderInlineRail() {
      return `
        <section class="inline-rail" aria-label="旅行状态摘要">
          ${renderRailCards("inline-rail-card card")}
        </section>
      `;
    }

    function renderRightRail() {
      return `
        <aside class="right-rail">
          ${renderRailCards("rail-card card")}
        </aside>
      `;
    }

    function renderMainContent() {
      if (appState.currentView === "city") return renderCityPage();
      if (appState.currentView === "day") return renderDayPage();
      if (appState.currentView === "trip-album") return renderTripAlbumPage();
      if (appState.currentView === "spot-reviews") return renderSpotReviewsPage();
      if (appState.currentView === "expenses") return renderExpensesPage();
      return renderDashboard();
    }

    function renderDashboard() {
      const albumPreview = allCheckinsSorted().slice(0, 3);
      return `
        <section class="dashboard-hero prep-hero">
          <div class="hero-content">
            <div class="hero-row prep-row">
              <div>
                <span class="chip hero-chip">${icon("map-pinned", "icon-sm")} 旅行准备桌面</span>
                <h1 class="hero-title serif">台湾旅行<br />2026</h1>
                <div class="hero-meta">
                  ${esc(tripData.range)} · ${esc(tripData.days)}<br />
                  香港 → 高雄 → 墾丁 → 台北 → 香港
                </div>
                <p class="prep-copy">先把跨城路线、住宿和待确认事项放在同一张桌面上。高雄和墾丁已经能按天走，台北先留一点空白，等前半段路线稳定后再补。</p>
              </div>
              <div class="prep-ticket ticket-card">
                <div class="ticket-row">
                  <span>Flight U0136</span>
                  <strong>HKG → KHH</strong>
                </div>
                <div class="ticket-route">12:45 起飞 · 14:15 到小港 T1</div>
                <div class="ticket-dash"></div>
                <div class="ticket-row">
                  <span>路线节奏</span>
                  <strong>港湾 → 海边 → 城市</strong>
                </div>
              </div>
            </div>
            <div class="route-visual" aria-label="trip route">
              ${["香港", "高雄", "墾丁", "台北", "香港"].map((name, index, arr) => `
                <button class="route-node ${index > 0 && index < 4 ? "clickable" : ""}" ${index > 0 && index < 4 ? `onclick="selectCity('${["kaohsiung","kenting","taipei"][index - 1]}')"` : "disabled"}>
                  ${index === 0 ? icon("plane-takeoff", "icon-sm") : index === 4 ? icon("plane-landing", "icon-sm") : index === 2 ? icon("waves", "icon-sm") : index === 3 ? icon("building-2", "icon-sm") : icon("ship", "icon-sm")}
                  ${esc(name)}
                </button>
                ${index < arr.length - 1 ? `<span class="route-arrow">${index === 0 || index === 3 ? "✈" : "→"}</span>` : ""}
              `).join("")}
            </div>
            <div class="prep-actions">
              ${(() => {
                const phase = getTripPhase();
                const cityIconMap = { kaohsiung: "ship", kenting: "waves", taipei: "building-2" };
                if (phase.phase === "during") {
                  const city = tripData.cities[phase.cityId];
                  const act  = getCurrentActivity();
                  const nextHint = act?.next
                    ? `<div class="trip-now-bar">${icon("clock", "icon-sm")} 下一项 · ${esc(act.next.time)} ${esc(act.next.title)}</div>`
                    : act?.current
                    ? `<div class="trip-now-bar">${icon("navigation", "icon-sm")} 现在 · ${esc(act.current.title)}</div>`
                    : "";
                  return `
                    <button class="btn btn-primary" onclick="selectDay('${phase.dayId}','${phase.cityId}')">
                      ${icon(cityIconMap[phase.cityId] || "map-pin", "icon-sm")}
                      第 ${phase.dayNum} 天 · 今日行程
                    </button>
                    <button class="btn btn-ghost" onclick="selectCity('${phase.cityId}')">
                      ${icon("building-2", "icon-sm")} ${esc(city?.name || phase.cityId)}
                    </button>
                    ${nextHint}
                  `;
                }
                if (phase.phase === "after") {
                  return `<button class="btn btn-primary" onclick="selectCity('kaohsiung')">${icon("film", "icon-sm")} 回顾行程</button>`;
                }
                return `<button class="btn btn-primary" onclick="selectCity('kaohsiung')">${icon("ship", "icon-sm")} 从高雄开始</button>`;
              })()}
              <button class="btn btn-ghost" onclick="enterTripMap()">${icon("map", "icon-sm")} 看总路线地图</button>
              <button class="btn btn-ghost" onclick="openDrawer('confirm')">${icon("circle-help", "icon-sm")} 查看待确认</button>
            </div>
          </div>
        </section>
        ${renderOverviewMap()}
        <section class="prep-grid">
          <article class="note-card prep-card">
            <h3>${icon("clipboard-check", "icon-sm")} 城市进度</h3>
            <p>高雄和墾丁已经按日期拆好；台北先不急着塞满，等交通和返港信息确认后再补。</p>
            <div class="stamp-row"><span class="stamp">高雄已规划</span><span class="stamp">墾丁已规划</span><span class="stamp stamp-pending">台北待补齐</span></div>
          </article>
          <article class="ticket-card prep-card">
            <h3>${icon("bed-double", "icon-sm")} 住宿票据</h3>
            <p>高雄住福容徕旅，墾丁住日和湾居；台北住宿还没锁，先别让前半段的节奏被它打乱。</p>
          </article>
          <article class="receipt-card prep-card">
            <h3>${icon("wallet", "icon-sm")} 预算小票</h3>
            <p>高雄酒店约 HK$574/晚；墾丁快线、机车、夜市和打车先按估算记，现场再微调。</p>
            <small>已记录 ${userExpenseTotalCount()} 项自定义费用</small>
          </article>
          <button class="note-card prep-card album-entry" onclick="openTripAlbum()">
            <h3>${icon("images", "icon-sm")} 旅行相册</h3>
            <p>${isCheckinFeatureAvailable() ? "所有打卡照片会按时间倒序汇总在这里，旅行中可以快速回看当天记忆。" : "配置 Supabase 后，这里会汇总所有打卡照片。"}</p>
            <small>${checkins.length ? `已收录 ${checkins.length} 张照片` : "等待第一张打卡照片"}</small>
            <div class="album-entry-preview" aria-hidden="true">
              ${albumPreview.length ? albumPreview.map(item => `<img src="${esc(item.photo_url)}" alt="" />`).join("") : "<span></span><span></span><span></span>"}
            </div>
          </button>
          <article class="map-card-lite prep-card">
            <h3>${icon("circle-help", "icon-sm")} 待确认</h3>
            <p>台客潜水集合点、9189 上车点、机车证件、台北段和返港航班都放在待确认中心。</p>
            <button class="btn btn-small btn-ghost" onclick="openDrawer('confirm')">打开待确认事项</button>
          </article>
        </section>
        <section class="section-head">
          <div>
            <h2>选择城市</h2>
            <p>从高雄的港湾和夜市，接到墾丁的海风和机车，再把台北留给临场发挥。</p>
          </div>
          <button class="btn btn-ghost" onclick="copyTripSummary()">${icon("copy", "icon-sm")} 复制总览</button>
        </section>
        <section class="city-grid">
          ${Object.values(tripData.cities).map(city => renderCityCard(city)).join("")}
        </section>
      `;
    }

    function renderTripAlbumPage() {
      const photos = allCheckinsSorted();
      return `
        <section class="page-hero">
          <div class="crumb-row">
            <button class="btn btn-small btn-ghost" onclick="goDashboard()">${icon("chevron-left", "icon-sm")} 返回台湾总览</button>
            ${isCheckinFeatureAvailable() ? `<button class="btn btn-small" onclick="loadCheckins()">${icon("refresh-cw", "icon-sm")} 刷新相册</button>` : ""}
          </div>
          <div class="page-title-row">
            <div>
              <span class="tag sage">${icon("images", "icon-sm")} Photo Journal</span>
              <h1 class="page-title serif">旅行相册</h1>
              <p class="page-intro">把所有日期的打卡照片集中在这里，按最新打卡时间倒序排列。</p>
            </div>
            <div class="density-pill">${icon("camera", "icon-sm")} ${photos.length} 张照片</div>
          </div>
        </section>
        <section class="card panel">
          ${renderAlbumGrid(photos, "还没有旅行照片", "在每日时间轴里点相机按钮，上传照片后会自动汇总到这里。")}
        </section>
      `;
    }

    function renderSpotReviewsPage() {
      const stats = spotRatingStats();
      const ratedCount = stats.total - stats.unrated;
      return `
        <section class="page-hero rating-center-hero">
          <div class="crumb-row">
            <button class="btn btn-small btn-ghost" onclick="goDashboard()">${icon("chevron-left", "icon-sm")} 返回台湾总览</button>
            <button class="btn btn-small btn-ghost" onclick="copyTripSummary()">${icon("copy", "icon-sm")} 复制总览</button>
          </div>
          <div class="page-title-row">
            <div>
              <span class="tag orange">${icon("star", "icon-sm")} Spot Reviews</span>
              <h1 class="page-title serif">行程评级</h1>
              <p class="page-intro">把每个地点从“去过没”升级成“值不值得”，顺手记下吃了什么、买了什么和现场照片。</p>
            </div>
            <div class="density-pill">${icon("badge-check", "icon-sm")} 已评 ${ratedCount}/${stats.total}</div>
          </div>
          <div class="rating-overview" aria-label="评级总览">
            ${RATING_OPTIONS.map(option => `<span class="rating-stat rating-badge ${option.cls}">${esc(option.label)} × ${stats.counts[option.rating] || 0}</span>`).join("")}
            <span class="rating-stat rating-badge rating-unrated">未评 × ${stats.unrated}</span>
          </div>
        </section>
        <section class="spot-review-groups">
          ${Object.entries(tripData.checklist).map(([cityName, names]) => renderSpotCityGroup(cityName, names)).join("")}
        </section>
        ${renderSpotTopBoard()}
      `;
    }

    function renderSpotCityGroup(cityName, names) {
      const rated = names.filter(name => spotReview(spotIdFor(cityName, name)).rating).length;
      return `
        <section class="spot-city-group">
          <div class="spot-city-head">
            <div>
              <span class="tag">${esc(tripData.cities[SPOT_CITY_IDS[cityName]]?.range || "待规划")}</span>
              <h2 class="serif">${esc(cityName)}</h2>
            </div>
            <span class="rail-muted">${rated}/${names.length} 已评级</span>
          </div>
          <div class="spot-list">
            ${names.map(name => renderSpotReviewCard(spotEntryById(spotIdFor(cityName, name)))).join("")}
          </div>
        </section>
      `;
    }

    function renderSpotReviewCard(spot) {
      if (!spot) return "";
      const review = spotReview(spot.id);
      const expanded = !!appState.expandedSpotReviews?.[spot.id] || appState.selectedSpotId === spot.id;
      const selected = appState.selectedSpotId === spot.id;
      const rating = review.rating;
      const canEdit = canEditTrip();
      const style = `--spot-rating-color:${ratingColor(rating)};`;
      return `
        <article id="${esc(spotDomId(spot.id))}" class="spot-card ${rating ? "rated" : ""} ${selected ? "selected" : ""}" style="${style}">
          <div class="spot-card-header">
            <button class="spot-rating-slot ${rating ? "" : "empty"}" onclick="openRatingModal('${escAttr(spot.id)}')" aria-label="${rating ? "更换评级" : "选择评级"}">
              ${rating ? renderRatingBadge(rating) : icon("star", "icon-sm")}
            </button>
            <div class="spot-title-block">
              <strong>${esc(spot.name)}</strong>
              <span>${esc(spot.cityName)} · ${esc(spot.schedule)}</span>
            </div>
            <button class="spot-expand-btn" onclick="toggleSpotExpanded('${escAttr(spot.id)}')">
              ${icon(expanded ? "chevron-up" : "chevron-down", "icon-sm")} ${expanded ? "收起" : "展开"}
            </button>
          </div>
          ${expanded ? renderSpotReviewBody(spot, review, canEdit) : ""}
        </article>
      `;
    }

    function renderSpotReviewBody(spot, review, canEdit) {
      const logSections = spotLogSectionsForSpot(spot, review);
      return `
        <div class="spot-card-body">
          ${logSections.map(section => renderSpotLogSection(spot, review, section.logType, section.iconName, section.title)).join("")}
          <section class="spot-section">
            <div class="spot-section-head">
              <h3>${icon("notebook-pen", "icon-sm")} 体验备注</h3>
            </div>
            ${canEdit
              ? `<textarea class="spot-note-box" placeholder="综合备注、排队、体感、是否值得再来..." oninput="saveSpotNotes('${escAttr(spot.id)}', this.value)">${esc(review.notes)}</textarea>`
              : `<div class="spot-note-box readonly-value">${esc(review.notes || "还没有备注。")}</div>`}
          </section>
          <section class="spot-section">
            <div class="spot-section-head">
              <h3>${icon("images", "icon-sm")} 照片</h3>
              ${canEdit ? `
                <button class="btn btn-small btn-ghost" onclick="document.getElementById('${escAttr(spotPhotoInputId(spot.id))}')?.click()" ${spotReviewUploading ? "disabled" : ""}>${icon(spotReviewUploading ? "loader-circle" : "upload", "icon-sm")} 上传</button>
                <input id="${esc(spotPhotoInputId(spot.id))}" class="hidden" type="file" accept="image/*" onchange="uploadSpotPhoto('${escAttr(spot.id)}', event)" />
              ` : ""}
            </div>
            ${renderSpotPhotoGrid(spot, review.photos, canEdit)}
          </section>
          <div class="spot-actions">
            ${canEdit ? `<button class="btn btn-small btn-primary" onclick="openRatingModal('${escAttr(spot.id)}')">${icon("star", "icon-sm")} ${review.rating ? "更换评级" : "选择评级"}</button>` : ""}
            <button class="btn btn-small google-map-btn" onclick="openGoogleMapsForSpot('${escAttr(spot.id)}')">${icon("map-pin", "icon-sm")} 在 Google Maps 查看</button>
          </div>
          ${!canEdit ? `<div class="readonly-note">viewer 只读：评级、日志和照片只能查看，不能修改。</div>` : ""}
        </div>
      `;
    }

    function renderSpotLogSection(spot, review, logType, iconName, title) {
      const entries = review[logType] || [];
      return `
        <section class="spot-section">
          <div class="spot-section-head">
            <h3>${icon(iconName, "icon-sm")} ${esc(title)}</h3>
            ${canEditTrip() ? `<button class="btn btn-small btn-ghost" onclick="openSpotLogModal('${escAttr(spot.id)}', '${escAttr(logType)}')">${icon("plus", "icon-sm")} 添加</button>` : ""}
          </div>
          <div class="spot-log-list">
            ${entries.length ? entries.map((entry, index) => renderSpotLogItem(spot, logType, entry, index)).join("") : `<p class="rail-muted" style="margin:0;">还没有记录。</p>`}
          </div>
        </section>
      `;
    }

    function renderSpotLogItem(spot, logType, entry, index) {
      const photos = Array.isArray(entry.photos) ? entry.photos : [];
      return `
        <article class="spot-log-item">
          <div>
            <p>${esc(entry.text || "图片记录")}</p>
            ${photos.length ? `<div class="spot-log-photos">${photos.map((url, photoIndex) => `
              <button class="spot-thumb" onclick="openSpotPhotoViewer('${escAttr(url)}', '${escAttr(spot.name)}')">
                <img src="${esc(url)}" alt="${esc(spot.name)}记录 ${photoIndex + 1}" loading="lazy" />
              </button>
            `).join("")}</div>` : ""}
          </div>
          ${canEditTrip() ? `<button class="action-btn" onclick="deleteSpotLog('${escAttr(spot.id)}', '${escAttr(logType)}', ${index})">${icon("trash-2", "icon-sm")} 删除</button>` : ""}
        </article>
      `;
    }

    function renderSpotPhotoGrid(spot, photos, canEdit) {
      if (!photos.length) return `<p class="rail-muted" style="margin:0;">还没有上传照片。</p>`;
      return `
        <div class="spot-photo-grid">
          ${photos.map((url, index) => `
            <div class="spot-photo-wrap">
              <button class="spot-photo-tile" onclick="openSpotPhotoViewer('${escAttr(url)}', '${escAttr(spot.name)}')">
                <img src="${esc(url)}" alt="${esc(spot.name)}照片 ${index + 1}" loading="lazy" />
              </button>
              ${canEdit ? `<button class="spot-photo-delete" onclick="deleteSpotPhoto('${escAttr(spot.id)}', ${index})" aria-label="删除照片">${icon("x", "icon-sm")}</button>` : ""}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderSpotTopBoard() {
      const ranked = rankedSpotEntries();
      return `
        <section class="card panel">
          <div class="panel-head">
            <div>
              <h2>本次旅行 TOP 榜</h2>
              <p class="rail-muted">按评级排序，同级别按最近评级时间排序。</p>
            </div>
          </div>
          ${ranked.length ? `
            <div class="spot-top-list">
              ${ranked.map(spot => `
                <button class="spot-top-row" onclick="goSpotReviews('${escAttr(spot.id)}')">
                  ${renderRatingBadge(spot.review.rating)}
                  <strong>${esc(spot.name)}</strong>
                  <span class="rail-muted">${esc(spot.cityName)} · ${esc(spot.dateText)}</span>
                </button>
              `).join("")}
            </div>
          ` : `<div class="empty-state"><h2 class="serif">还没有排行</h2><p>给第一个地点打分后，TOP 榜会自动出现。</p></div>`}
        </section>
      `;
    }

    function renderExpensesPage() {
      const filterDayId = appState.expenseDayFilter || "all";
      const visibleExpenses = filterDayId === "all" ? allExpensesSorted() : expensesForDay(filterDayId);
      const stats = expenseStats(visibleExpenses);
      const filterDay = tripData.daysById[filterDayId];
      return `
        <section class="page-hero expenses-hero">
          <div class="crumb-row">
            <button class="btn btn-small btn-ghost" onclick="goDashboard()">${icon("chevron-left", "icon-sm")} 返回台湾总览</button>
            <button class="btn btn-small" onclick="loadExpenses()">${icon("refresh-cw", "icon-sm")} 刷新账本</button>
          </div>
          <div class="page-title-row expenses-title-row">
            <div>
              <span class="tag sage">${icon("receipt-text", "icon-sm")} Smart Ledger</span>
              <h1 class="page-title serif">💰 旅行账本</h1>
              <p class="page-intro">${filterDay ? `当前筛选：${esc(filterDay.dayNo)} · ${esc(filterDay.date)}。` : "按小票、付款人和日期记录现场消费，金额会按估算汇率折算成 HKD。"}</p>
            </div>
            <div class="expense-hero-actions">
              ${filterDay ? `<button class="btn btn-ghost" onclick="goExpenses('all')">${icon("list-filter", "icon-sm")} 查看全部</button>` : ""}
              <button class="btn btn-primary" onclick="openExpenseModal(${filterDay ? `{ day_id: '${escAttr(filterDayId)}' }` : ""})">${icon("plus", "icon-sm")} 添加费用</button>
              <button class="btn google-map-btn" onclick="startReceiptScan()">${icon("camera", "icon-sm")} 拍照记账</button>
              <input id="receipt-scan-input" class="hidden" type="file" accept="image/*" onchange="handleReceiptScanSelect(event)" />
            </div>
          </div>
        </section>
        ${renderExpenseSummaryCard(stats)}
        ${renderExpenseDayGroups(visibleExpenses)}
      `;
    }

    function renderExpenseSummaryCard(stats = expenseStats()) {
      const payerRows = Object.entries(stats.payerTotals).sort((a, b) => b[1] - a[1]);
      return `
        <section class="expense-summary-card card">
          <div class="expense-total-block">
            <span>总计</span>
            <strong>${formatHkd(stats.totalHkd)}</strong>
            <small>汇率为估算值：1 NTD = 0.24 HKD，1 RMB = 1.07 HKD</small>
          </div>
          <div class="expense-total-block muted-block">
            <span>我付了多少</span>
            <strong>${formatHkd(stats.currentPaidHkd)}</strong>
            <small>${esc(currentUserHandle())}</small>
          </div>
          <div class="category-bars" aria-label="各类别占比">
            ${stats.categoryTotals.length ? stats.categoryTotals.map(item => `
              <div class="category-bar-row">
                <div class="category-bar-label"><span>${esc(item.icon)} ${esc(item.id)}</span><b>${item.percent}%</b></div>
                <div class="category-bar-track"><div class="category-bar-fill" style="width:${Math.max(item.percent, 3)}%;"></div></div>
              </div>
            `).join("") : `<p class="rail-muted">还没有费用，添加第一张小票后这里会显示类别占比。</p>`}
          </div>
          <div class="payer-summary">
            <h3>${icon("users-round", "icon-sm")} 付款人汇总</h3>
            ${payerRows.length ? payerRows.map(([payer, amount]) => `
              <div class="payer-row"><span>${esc(payer)}</span><strong>${formatHkd(amount)}</strong></div>
            `).join("") : `<p class="rail-muted">暂无付款记录。</p>`}
          </div>
        </section>
      `;
    }

    function renderExpenseDayGroups(expenses = allExpensesSorted()) {
      if (!expenses.length) {
        return `
          <section class="empty-state expenses-empty">
            ${icon("receipt-text", "icon")}
            <h2 class="serif">账本还空着</h2>
            <p>旅行开始后可以手动添加费用，也可以上传小票让 AI 先填金额、日期和类别。</p>
            <button class="btn btn-primary" onclick="openExpenseModal()">${icon("plus", "icon-sm")} 添加第一笔费用</button>
          </section>
        `;
      }
      return `
        <section class="expense-day-list">
          ${groupedExpensesByDay(expenses).map(group => {
            const day = tripData.daysById[group.dayId];
            const total = group.expenses.reduce((sum, item) => sum + (Number(item.amount_hkd) || 0), 0);
            return `
              <article class="expense-day-group">
                <div class="expense-day-head">
                  <div>
                    <span>${esc(day?.shortLabel || group.expenses[0]?.date || "未归入日期")}</span>
                    <h2>${esc(day ? `${day.dayNo} · ${day.title}` : "自由记录")}</h2>
                  </div>
                  <strong>${formatHkd(total)}</strong>
                </div>
                <div class="expense-list-card">
                  ${group.expenses.map(renderExpenseItem).join("")}
                </div>
              </article>
            `;
          }).join("")}
        </section>
      `;
    }

    function renderExpenseItem(expense) {
      const meta = expenseCategoryMeta(expense.category);
      return `
        <div class="expense-item">
          <div class="expense-category-badge" title="${escAttr(meta.id)}">${esc(meta.icon)}</div>
          <div class="expense-main">
            <strong>${esc(expense.description || "未命名费用")}</strong>
            <span>${esc(meta.id)} · ${esc(expense.date)} · 付款人 ${esc(expense.paid_by || "未知")}</span>
            ${expense.split_with?.length ? `<small>分摊：${expense.split_with.map(esc).join("、")}</small>` : ""}
          </div>
          ${expense.receipt_url ? `<button class="receipt-thumb" onclick="openMapsUrl('${escAttr(expense.receipt_url)}')" aria-label="查看小票"><img src="${esc(expense.receipt_url)}" alt="小票缩略图" /></button>` : ""}
          <div class="expense-amount-cell">
            <strong>${formatMoney(expense.amount, expense.currency)}</strong>
            <span>≈ ${formatHkd(expense.amount_hkd)}</span>
          </div>
          ${canEditTrip() ? `<button class="action-btn" onclick="deleteExpense('${escAttr(expense.day_id)}','${escAttr(expense.id)}')">${icon("trash-2", "icon-sm")}</button>` : ""}
        </div>
      `;
    }

    function renderCityCard(city) {
      return `
        <button class="city-card card city-card-${city.id}" onclick="selectCity('${city.id}')">
          <div>
            <span class="tag ${city.status === "待规划" ? "orange" : "sage"}">${esc(city.status)}</span>
            <h3 class="serif">${esc(city.name)}</h3>
            <div class="city-date">${esc(city.range)} · ${esc(city.nights)}</div>
            <div class="city-tags">${city.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          </div>
          <div class="status-line">
            <span>${city.id === "taipei" ? "保留弹性规划" : "日期与住宿已整理"}</span>
            ${icon("arrow-right", "icon-sm")}
          </div>
        </button>
      `;
    }

    function renderCityPage() {
      const city = selectedCity();
      if (!city) return renderDashboard();
      return `
        <section class="page-hero">
          <div class="crumb-row">
            <button class="btn btn-small btn-ghost" onclick="goDashboard()">${icon("chevron-left", "icon-sm")} 返回台湾总览</button>
            <button class="btn btn-small" onclick="goSpotReviews()">${icon("star", "icon-sm")} 评级中心</button>
          </div>
          <div class="page-title-row">
            <div>
              <span class="tag ${city.status === "待规划" ? "orange" : "sage"}">${esc(city.status)}</span>
              <h1 class="page-title serif">${esc(city.name)}</h1>
              <p class="page-intro">${esc(city.intro)}</p>
              <div class="city-tags">${city.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
            </div>
            <div class="soft-card info-card" style="min-width:min(320px,100%);">
              <h3>${esc(city.range)} · ${esc(city.nights)}</h3>
              <div class="rail-muted">按停留节奏进入当天安排。</div>
            </div>
          </div>
        </section>
        <section class="card panel">
          <div class="panel-head">
            <div>
              <h2>选择日期</h2>
              <p class="rail-muted">每一天保留独立节奏，方便临场调整。</p>
            </div>
          </div>
          <div class="date-strip">
            ${daysForCity(city.id).map(day => renderDateChip(day, city.id)).join("")}
          </div>
        </section>
        ${renderCityMiniMap(city)}
        ${renderCityInfo(city)}
      `;
    }

    function renderCityInfo(city) {
      if (city.id === "taipei") {
        return renderTaipeiEmptyState("city");
      }
      const hotel = city.hotel;
      return `
        <section class="hotel-grid">
          <article class="card info-card">
            <h3>${icon("bed-double", "icon-sm")} 酒店</h3>
            <div class="info-list">
              <div><strong>${esc(hotel.name)}</strong> · ${esc(hotel.status)}</div>
              ${hotel.price ? `<div>${esc(hotel.price)}</div>` : ""}
              ${hotel.feature ? `<div>${esc(hotel.feature)}</div>` : ""}
              <div>入住：${esc(hotel.checkin)}</div>
              <div>退房：${esc(hotel.checkout)}</div>
            </div>
            <div class="timeline-actions">
              <button class="btn btn-small google-map-btn" onclick="openGoogleMapsForPlace('${escAttr(hotel.name)}', '${escAttr(city.id)}')">${icon("map-pin", "icon-sm")} 地图</button>
            </div>
          </article>
          <article class="card info-card">
            <h3>${icon("compass", "icon-sm")} 城市节奏</h3>
            <div class="info-list">
              <div>抵达日轻量打开城市。</div>
              <div>完整日集中安排艺术、海边与夜景。</div>
              <div>跨城日上午退房转场，下午进入下一段旅程。</div>
            </div>
          </article>
        </section>
      `;
    }

    function renderDateChip(day, cityId = appState.selectedCity) {
      const context = dayContext(day, cityId);
      const cityArg = cityId ? `, '${cityId}'` : "";
      return `
        <button class="date-chip ${appState.selectedDay === day.id ? "active" : ""}" onclick="selectDay('${day.id}'${cityArg})">
          <strong>${icon(dayIcon(day), "icon-sm")} ${esc(context.label)}</strong>
          <span>${esc(context.title)}</span>
        </button>
      `;
    }

    function renderDayPage() {
      const day = selectedDay();
      const city = selectedCity() || tripData.cities[day?.cityId];
      if (!day) return renderCityPage();
      return `
        <section class="day-header">
          <div class="crumb-row">
            <button class="btn btn-small btn-ghost" onclick="backToCity()">${icon("chevron-left", "icon-sm")} 返回城市</button>
            <button class="btn btn-small btn-ghost" onclick="goDashboard()">${icon("layout-dashboard", "icon-sm")} 返回台湾总览</button>
            <button class="btn btn-small" onclick="copyDayPlan()">${icon("copy", "icon-sm")} 复制当天行程</button>
          </div>
          <div class="day-title-grid">
            <div>
              <span class="tag ${day.planned ? "sage" : "orange"}">${esc(day.cityName)} · ${esc(day.date)}</span>
              <h1 class="serif">${esc(day.title)}</h1>
              <p class="page-intro">${esc(day.focus)}</p>
            </div>
            <div class="density-pill">${icon(day.planned ? "gauge" : "sparkles", "icon-sm")} 行程密度：${esc(day.density)}</div>
          </div>
        </section>
        <section class="card panel">
          <div class="panel-head">
            <div>
              <h2>${city ? esc(city.name) : "日期"}日期</h2>
              <p class="rail-muted">同一城市内快速切换当天节奏。</p>
            </div>
          </div>
          <div class="date-strip">
            ${(city ? daysForCity(city.id) : days).map(item => renderDateChip(item, city?.id)).join("")}
          </div>
        </section>
        <section class="tab-bar" aria-label="day tabs">
          ${renderTabButton("timeline", "时间轴", "list-checks")}
          ${renderTabButton("route", "地图", "map")}
          ${renderTabButton("notes", "备注", "notebook-pen")}
          ${renderTabButton("album", "相册", "images")}
        </section>
        <section class="card panel">${renderSelectedTab(day)}</section>
      `;
    }

    function renderTabButton(id, label, iconName) {
      return `<button class="tab-btn ${appState.selectedTab === id ? "active" : ""}" onclick="setTab('${id}')">${icon(iconName, "icon-sm")} ${esc(label)}</button>`;
    }

    function renderSelectedTab(day) {
      if (!day.planned && appState.selectedTab !== "timeline" && appState.selectedTab !== "notes" && appState.selectedTab !== "route" && appState.selectedTab !== "album") {
        return renderTaipeiEmptyState("day");
      }
      if (appState.selectedTab === "route") return renderRouteTab(day);
      if (appState.selectedTab === "notes") return renderNotesTab(day);
      if (appState.selectedTab === "album") return renderAlbumTab(day);
      return renderTimelineTab(day);
    }

    function renderTimelineTab(day) {
      const dayItems = timelineItemsForDay(day);
      const types = ["all", ...new Set(dayItems.map(item => item.type))];
      const query = (appState.searchQuery || "").trim().toLowerCase();
      const filtered = dayItems.filter(item => {
        const matchesType = appState.typeFilter === "all" || item.type === appState.typeFilter;
        const text = `${item.title} ${itemLocationName(item)} ${item.detail} ${item.duration || ""}`.toLowerCase();
        return matchesType && (!query || text.includes(query));
      });
      return `
        <div class="panel-head">
          <div>
            <h2>当天时间轴</h2>
            <p class="rail-muted">聚焦当天节点、地点和移动方式。</p>
          </div>
          <div class="filter-row">
            <button class="btn btn-small google-map-btn" onclick="goExpenses('${escAttr(day.id)}')">${icon("receipt-text", "icon-sm")} 当日账单</button>
            <button class="btn btn-small btn-ghost" onclick="clearFilters()">${icon("x", "icon-sm")} 清除筛选</button>
          </div>
        </div>
        ${renderTimelineReminders(day)}
        <div class="filter-row" style="margin-bottom:16px;">
          <input class="search-input" placeholder="搜索当天内容..." value="${esc(appState.searchQuery)}" oninput="updateSearch(this.value)" />
          ${types.map(type => `
            <button class="chip ${appState.typeFilter === type ? "active" : ""}" onclick="setTypeFilter('${type}')">
              ${type === "all" ? "全部" : esc(typeMeta[type]?.label || type)}
            </button>
          `).join("")}
        </div>
        <div class="timeline-list">
          ${filtered.length ? filtered.map(item => renderTimelineItem(item, day)).join("") : `<div class="empty-state"><h2 class="serif">No matches</h2><p>当前筛选没有结果，可以清除筛选或切换类型。</p></div>`}
          ${canEditTrip() ? `<div class="add-itinerary-row"><button class="btn btn-primary" onclick="openAddItemModal('${escAttr(day.id)}')">${icon("plus", "icon-sm")} 添加行程</button></div>` : ""}
        </div>
      `;
    }

    function renderTimelineReminders(day) {
      const list = day.reminders || [];
      if (!list.length) return "";
      return `
        <details class="day-inline-panel">
          <summary>${icon("bell", "icon-sm")} 当日提醒</summary>
          <div class="info-list">
            ${list.map((text, index) => {
              const id = `rem-${day.id}-${index}`;
              const done = !!appState.confirmStatus[id];
              return `
                <label class="check-item ${canEditTrip() ? "" : "disabled"}">
                  ${canEditTrip() ? `<input type="checkbox" ${done ? "checked" : ""} onchange="toggleConfirm('${escAttr(id)}')" />` : icon(done ? "check-circle-2" : "circle", "icon-sm")}
                  <span>${esc(text)}</span>
                </label>
              `;
            }).join("")}
          </div>
        </details>
      `;
    }

    function renderTimelineFoodFold(item, day) {
      if (!["food", "night-market"].includes(item.type)) return "";
      const foods = day?.food || [];
      return `
        <details class="timeline-fold">
          <summary>${icon("utensils", "icon-sm")} 美食备注</summary>
          <div>${esc(item.detail || "这一餐保留弹性，按现场排队和体力调整。")}</div>
          ${foods.length ? `<div style="margin-top:8px;">当天备选：${foods.map(esc).join(" / ")}</div>` : ""}
        </details>
      `;
    }

    function renderTimelineItem(item, day = tripData.daysById[item.dayId] || selectedDay()) {
      const meta = typeMeta[item.type] || typeMeta.sight;
      const done = !!appState.completedItems[item.id];
      const fav = !!appState.favoriteItems[item.id];
      const note = appState.itemNotes[item.id];
      const checkedIn = hasItemCheckin(item.id);
      const editable = canEditTrip();
      const spot = spotEntryForTimelineItem(item);
      const timelineRating = spot ? spotReview(spot.id).rating : null;
      return `
        <article class="timeline-item ${done ? "done" : ""} ${appState.selectedMapPoint === item.id ? "map-selected" : ""}" onclick="selectMapPoint('${item.id}')" onmouseenter="softHighlightMapPoint('${item.id}', true)" onmouseleave="softHighlightMapPoint('${item.id}', false)">
          ${timelineRating ? `<button class="timeline-rating-jump" onclick="event.stopPropagation(); goSpotReviews('${escAttr(spot.id)}')" aria-label="查看 ${esc(timelineRating)} 评级">${renderRatingBadge(timelineRating)}</button>` : ""}
          <div class="timeline-time">${esc(item.time)}</div>
          <div class="timeline-body">
            <h3 class="${timelineRating ? "timeline-rating-spacer" : ""}">${icon(meta.icon, "icon-sm")} ${esc(item.title)} <span class="tag ${meta.tone}">${esc(meta.label)}</span></h3>
            <p>${esc(item.detail)}</p>
            ${item.duration ? `<p class="rail-muted">${icon("clock-3", "icon-sm")} ${esc(item.duration)}</p>` : ""}
            ${renderTimelineFoodFold(item, day)}
            <div class="timeline-actions">
              ${editable ? `
                <button class="action-btn ${done ? "done" : ""}" onclick="toggleComplete('${item.id}')">${icon(done ? "check-circle-2" : "circle", "icon-sm")} ${done ? "已完成" : "标记完成"}</button>
                <button class="action-btn ${fav ? "active" : ""}" onclick="toggleFavorite('${item.id}')">${icon("heart", "icon-sm")} ${fav ? "已收藏" : "收藏"}</button>
                <button class="action-btn" onclick="openItemNote('${item.id}')">${icon("notebook-pen", "icon-sm")} 添加备注</button>
              ` : ""}
              <button class="action-btn" onclick="showItemOnMap('${item.id}')">${icon("route", "icon-sm")} 定位路线</button>
              <button class="btn btn-small btn-ghost" onclick="event.stopPropagation(); copyCoordsForTimelineItem('${escAttr(item.id)}')">${icon("copy", "icon-sm")} 坐标</button>
            </div>
            ${note ? `<div class="item-note">${esc(note)}</div>` : ""}
            <div class="timeline-quick-actions" onclick="event.stopPropagation()">
              ${editable ? `<button class="action-btn checkin-btn ${checkedIn ? "done" : ""}" onclick="openCheckinModal('${item.id}', event)">${icon("camera", "icon-sm")} ${checkedIn ? "已打卡" : "打卡"}</button>` : ""}
              ${editable ? `<button class="action-btn" onclick="openAddExpenseWithContext('${escAttr(item.id)}', event)">${icon("receipt-text", "icon-sm")} 记账</button>` : ""}
              <button class="action-btn" onclick="openGoogleMapsForTimelineItem('${escAttr(item.id)}')">${icon("map", "icon-sm")} 地图</button>
              ${editable ? `<button class="action-btn" onclick="openEditItemModal('${escAttr(item.id)}')">${icon("pencil", "icon-sm")} 编辑</button>` : ""}
            </div>
            ${!editable ? `<div class="readonly-note">viewer 只读：编辑按钮已隐藏。</div>` : ""}
          </div>
        </article>
      `;
    }

    function escAttr(value) {
      return String(value ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, " ");
    }

    function renderRouteTab(day) {
      return renderRouteMapCard(day);
    }

    function renderOverviewMap() {
      const progress = tripCompletion();
      return `
        <section class="map-card overview-map">
          <div class="map-card-head">
            <div>
              <div class="map-title-kicker">${icon("map", "icon-sm")} 路线总图</div>
              <h2 class="serif">总路线地图</h2>
              <p>先看大方向：香港飞高雄，往南进墾丁，再一路北上台北，最后返港。</p>
            </div>
            <div class="map-toolbar">
              <button class="btn btn-small btn-ghost" onclick="resetMapView('map-trip')">${icon("crosshair", "icon-sm")} 重置视角</button>
              <button class="btn btn-small" onclick="copyTripSummary()">${icon("copy", "icon-sm")} 复制路线</button>
            </div>
          </div>
          <div class="map-shell"><div id="map-trip" class="leaflet-map" data-map-kind="trip" aria-label="台湾总路线地图"></div></div>
          <div class="google-route-row">
            <span class="rail-muted">用 Google Maps 查看完整路线</span>
            <button class="btn btn-small google-map-btn" onclick="openFullGoogleRoute()">${icon("external-link", "icon-sm")} 打开</button>
          </div>
          <div class="map-route-summary">
            <div class="map-stat"><strong>5</strong><span>路线节点</span></div>
            <div class="map-stat"><strong>${progress.completed}/${progress.total}</strong><span>已打卡节点</span></div>
            <div class="map-stat"><strong>飞机 / 快线 / 高铁</strong><span>主要交通</span></div>
            <div class="map-stat"><strong>9 天 8 夜</strong><span>旅行长度</span></div>
          </div>
        </section>
      `;
    }

    function renderCityMiniMap(city) {
      const points = mapPointsForCity(city.id);
      return `
        <section class="map-card city-mini-map">
          <div class="map-card-head">
            <div>
              <div class="map-title-kicker">${icon(city.id === "kenting" ? "waves" : city.id === "taipei" ? "building-2" : "ship", "icon-sm")} 城市地点图</div>
              <h2 class="serif">${esc(city.name)}地点速览</h2>
              <p>${city.id === "taipei" ? "台北还没锁死路线，先把可能想去的点放在地图上。" : `这里先放${esc(city.name)}段会出现的主要地点，选日期后会切到当天路线。`}</p>
            </div>
            <div class="map-toolbar">
              <button class="btn btn-small btn-ghost" onclick="resetMapView('map-city-${city.id}')">${icon("crosshair", "icon-sm")} 重置视角</button>
            </div>
          </div>
          <div class="map-shell"><div id="map-city-${city.id}" class="leaflet-map" data-map-kind="city" data-city="${escAttr(city.id)}" aria-label="${escAttr(city.name)}地点地图"></div></div>
          <div class="map-node-strip">
            ${points.slice(0, 10).map((point, index) => renderMapNodeCard(point, index, `map-city-${city.id}`)).join("")}
          </div>
        </section>
      `;
    }

    function renderRouteMapCard(day, options = {}) {
      const full = !!options.full;
      const mapId = full ? `map-day-${day.id}-full` : `map-day-${day.id}`;
      const points = mapPointsForDay(day);
      const transports = mainTransportLabels(points);
      const isPendingTaipei = !day.planned;
      return `
        <section class="map-card ${full ? "fullscreen-map-card" : ""}">
          <div class="map-card-head">
            <div>
              <div class="map-title-kicker">${icon("route", "icon-sm")} Day ${esc(day.dayNo.replace("Day ", ""))} 今日路线</div>
              <h2 class="serif">今日路线地图</h2>
              <p>${isPendingTaipei ? "台北段还没锁死，地图只标出建议规划点，不把它伪装成已确认行程。" : routeCopyForDay(day)}</p>
              <div class="city-tags">
                <span class="tag">${esc(day.cityName)}</span>
                <span class="tag orange">${esc(day.date)}</span>
                <span class="tag sage">${esc(day.density)}</span>
              </div>
            </div>
            <div class="map-toolbar">
              ${full ? `<button class="btn btn-small btn-ghost" onclick="setState({modal:null,mapViewMode:'inline'})">${icon("x", "icon-sm")} 关闭</button>` : `<button class="btn btn-small btn-primary" onclick="openMapModal('${day.id}')">${icon("maximize-2", "icon-sm")} 全屏查看地图</button>`}
              <button class="btn btn-small btn-ghost" onclick="resetMapView('${mapId}')">${icon("crosshair", "icon-sm")} 重置视角</button>
              <button class="btn btn-small btn-ghost" onclick="copyRoute('${day.id}')">${icon("copy", "icon-sm")} 复制当天路线</button>
            </div>
          </div>
          ${full ? "" : renderRoutePlan(day)}
          <div class="map-shell"><div id="${mapId}" class="leaflet-map" data-map-kind="day" data-day="${escAttr(day.id)}" aria-label="${escAttr(day.label)}路线地图"></div></div>
          <div class="map-route-summary">
            <div class="map-stat"><strong>${points.length}</strong><span>${isPendingTaipei ? "建议点" : "地点数"}</span></div>
            <div class="map-stat"><strong>${esc(transports || "待确认")}</strong><span>主要交通方式</span></div>
            <div class="map-stat"><strong>${esc(day.density)}</strong><span>路线节奏</span></div>
            <div class="map-stat"><strong>${esc(day.focus)}</strong><span>今日重点</span></div>
          </div>
          <div class="map-node-strip">
            ${points.map((point, index) => renderMapNodeCard(point, index, mapId)).join("")}
          </div>
        </section>
      `;
    }

    function renderMapNodeCard(point, index, mapId) {
      const selected = appState.selectedMapPoint === point.id;
      const suggested = !!point.suggested;
      return `
        <button class="map-node-card ${selected ? "active" : ""} ${suggested ? "suggested" : ""}" onclick="focusMapPoint('${escAttr(point.id)}', '${escAttr(mapId)}')">
          <span class="map-node-num">${suggested ? icon("sparkles", "icon-sm") : index + 1}</span>
          <span>
            <strong>${esc(point.time ? `${point.time} · ${point.locationName || point.title}` : (point.locationName || point.title))}</strong>
            <small>${esc(point.transportFromPrevious || point.tag || "步行 / 停留")}${point.approximate ? " · 近似坐标" : ""}</small>
          </span>
        </button>
      `;
    }

    function routeCopyForDay(day) {
      const copy = {
        d1: "落地后先看光之穹顶，傍晚直接去西子湾看日落；中央公园改成晚上顺路散步，最后用六合夜市收尾。",
        d2: "这天改成港边和旗津线：美术馆拍照看展，驳二和永心浮岛接午餐，再坐船去旗津，晚上回瑞丰夜市和巨蛋商圈。",
        d3: "下午换成西线电动车环游，从后壁湖、猫鼻头、白沙湾一路骑到关山看夕阳。",
        d4: "墾丁这天别排太满，台客潜水之后留点时间吹海风。",
        d5: "机车环线的节奏别太赶，龙磐公园适合多停一会儿。",
        d6: "今天是北上转场日，核心是快线和高铁衔接，台北晚上先保持弹性。",
        d9: "返港航班已经补齐，白天先不要跑太远，晚上预留时间去桃园 T1。"
      };
      return copy[day.id] || day.focus;
    }

    function renderRoutePlan(day) {
      if (!day.routePlan) return "";
      const plan = day.routePlan;
      return `
        <article class="route-plan">
          <div class="route-plan-head">
            <div>
              <h3>${icon("bike", "icon-sm")} ${esc(plan.title)}</h3>
              <p>${esc(plan.subtitle)}</p>
            </div>
            <button class="btn btn-small btn-primary" onclick="openMapsUrl('${escAttr(plan.googleMapsUrl)}')">${icon("map-pin", "icon-sm")} 打开西线路线</button>
          </div>
          <div class="route-metrics">
            ${plan.metrics.map(([value, label]) => `<div class="route-metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`).join("")}
          </div>
          <div class="route-stop-grid">
            ${plan.stops.map(([name, tag], index) => `
              <div class="route-stop-pill"><b>${index + 1}</b><span><strong>${esc(name)}</strong><br>${esc(tag)}</span></div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function renderFoodTab(day) {
      const foods = day.food || [];
      return `
        <div class="panel-head"><div><h2>当天美食</h2><p class="rail-muted">餐饮点保留弹性，按体力和排队情况微调。</p></div></div>
        ${foods.length ? `
          <div class="food-grid">
            ${foods.map(food => `<div class="mini-card"><h3>${icon("utensils", "icon-sm")} ${esc(food)}</h3><p>可根据当日体力和现场排队情况微调。</p></div>`).join("")}
          </div>
        ` : `<div class="empty-state"><h2 class="serif">临场选择</h2><p>当天暂无固定餐厅，建议根据酒店位置、体力和天气临场选择。</p></div>`}
      `;
    }

    function renderRemindersTab(day) {
      const list = day.reminders || [];
      return `
        <div class="panel-head">
          <div><h2>当天提醒</h2><p class="rail-muted">当天需要提前确认或留意的事项。</p></div>
          <button class="btn btn-small" onclick="openDrawer('confirm')">${icon("circle-help", "icon-sm")} 打开待确认中心</button>
        </div>
        ${list.length ? `
          <div class="info-list">
            ${list.map((text, index) => {
              const id = `rem-${day.id}-${index}`;
              const done = !!appState.confirmStatus[id];
              const important = /确认|待|现金|恢复|规则/.test(text);
              return `
                <label class="mini-card tip-card ${important ? "important" : "regular"} ${done ? "done" : ""}">
                  ${canEditTrip() ? `<input type="checkbox" ${done ? "checked" : ""} onchange="toggleConfirm('${escAttr(id)}')" />` : ""}
                  <span>${icon(done ? "check-circle-2" : important ? "circle-alert" : "lightbulb", "icon-sm")} ${esc(text)}</span>
                </label>
              `;
            }).join("")}
          </div>
        ` : `<div class="empty-state"><h2 class="serif">No reminders</h2><p>当天暂无特殊提醒。</p></div>`}
      `;
    }

    function renderBudgetTab(day) {
      const userExpenses = expensesForDay(day.id);
      return `
        <div class="panel-head">
          <div><h2>当日预算</h2><p class="rail-muted">费用会进入旅行账本，并按 HKD 估算汇总。</p></div>
          ${canEditTrip() ? `<button class="btn btn-small btn-primary" onclick="openExpenseModal({day_id:'${escAttr(day.id)}'})">${icon("plus", "icon-sm")} 添加费用</button>` : ""}
        </div>
        <div class="budget-grid">
          ${(day.budget || []).map(item => `<div class="mini-card"><h3>${esc(item.label)}</h3><p>${esc(item.category)} · ${esc(item.amount)}</p></div>`).join("")}
          ${!day.budget?.length ? `<div class="mini-card"><h3>暂无固定预算</h3><p>可以手动添加当天费用。</p></div>` : ""}
        </div>
        <div class="soft-card info-card" style="margin-top:14px;">
          <h3>自定义费用</h3>
          ${userExpenses.length ? userExpenses.map(exp => `
            <div class="expense-row">
              <div><strong>${esc(expenseCategoryMeta(exp.category).icon)} ${esc(exp.description)}</strong><br><span class="rail-muted">${esc(exp.category)} · 付款人 ${esc(exp.paid_by)}</span></div>
              <div style="font-weight:900;">${esc(formatMoney(exp.amount, exp.currency))}</div>
              ${canEditTrip() ? `<button class="action-btn" onclick="deleteExpense('${escAttr(day.id)}','${escAttr(exp.id)}')">${icon("trash-2", "icon-sm")} 删除</button>` : ""}
            </div>
          `).join("") : `<p class="rail-muted">还没有添加费用。</p>`}
          ${!canEditTrip() ? `<div class="readonly-note">viewer 只读：费用只能查看，不能新增或删除。</div>` : ""}
          <button class="btn btn-small btn-ghost" style="margin-top:10px;" onclick="goExpenses()">${icon("receipt-text", "icon-sm")} 查看完整账本</button>
        </div>
      `;
    }

    function renderNotesTab(day) {
      const note = appState.dayNotes[day.id] || "";
      return `
        <div class="panel-head"><div><h2>当日备注</h2><p class="rail-muted">像旅行手帐一样写下当天想法，自动保存到本机。</p></div></div>
        ${canEditTrip()
          ? `<textarea class="note-paper" placeholder="写下今天的备注、灵感、临时调整..." oninput="saveDayNote('${day.id}', this.value)">${esc(note)}</textarea>`
          : `<div class="note-paper readonly-value">${esc(note || "还没有备注。")}</div><div class="readonly-note">viewer 只读：不能编辑当天备注。</div>`}
      `;
    }

    function renderAlbumTab(day) {
      const photos = checkinsForDay(day.id);
      return `
        <div class="panel-head">
          <div>
            <h2>当天相册</h2>
            <p class="rail-muted">当天时间轴里的打卡照片会集中在这里。</p>
          </div>
          ${isCheckinFeatureAvailable() ? `<button class="btn btn-small btn-ghost" onclick="loadCheckins()">${icon("refresh-cw", "icon-sm")} 刷新</button>` : ""}
        </div>
        ${renderAlbumGrid(photos, "当天还没有照片", "在时间轴里点击相机打卡，上传照片后会出现在这里。")}
      `;
    }

    function renderAlbumGrid(items, emptyTitle, emptyCopy) {
      if (!isCheckinFeatureAvailable()) {
        return `
          <div class="empty-state">
            ${icon("images", "icon")}
            <h2 class="serif">相册待连接</h2>
            <p>配置 Supabase 后会开启照片打卡、Storage 上传和多人同步相册。</p>
          </div>
        `;
      }
      if (checkinsLoading) {
        return `
          <div class="empty-state">
            ${icon("loader-circle", "icon")}
            <h2 class="serif">相册同步中</h2>
            <p>正在从 Supabase 读取最新打卡照片。</p>
          </div>
        `;
      }
      if (!items.length) {
        return `
          <div class="empty-state">
            ${icon("camera", "icon")}
            <h2 class="serif">${esc(emptyTitle)}</h2>
            <p>${esc(emptyCopy)}</p>
          </div>
        `;
      }
      return `<div class="album-grid">${items.map(renderPhotoCard).join("")}</div>`;
    }

    function renderPhotoCard(checkin) {
      const locationName = checkin.location_name || checkinItem(checkin.item_id)?.title || "自由打卡";
      const caption = checkin.caption || "没有文字说明";
      return `
        <article class="mini-card photo-card">
          <button class="photo-thumb" onclick="openPhotoViewer('${escAttr(checkin.id)}')" aria-label="查看 ${esc(locationName)} 大图">
            <img src="${esc(checkin.photo_url)}" alt="${esc(locationName)}" loading="lazy" />
          </button>
          <div>
            <h3>${icon("camera", "icon-sm")} ${esc(locationName)}</h3>
            <p class="photo-caption">${esc(caption)}</p>
          </div>
          <div class="photo-meta">
            <span>${esc(shortEmail(checkin.user_email))}</span>
            <span>${esc(formatCheckinTime(checkin.checked_at))}</span>
          </div>
        </article>
      `;
    }

    function renderTaipeiEmptyState(context) {
      return `
        <div class="empty-state">
          ${icon("sparkles", "icon")}
          <h2 class="serif">台北先留白</h2>
          <p>前半段已经排得很满，台北先不要急着塞满。等高雄和墾丁路线确认后，再决定是城市夜景、夜市，还是九份/淡水半日线。</p>
          <div class="suggest-grid" style="margin:18px 0;">
            ${tripData.taipeiSuggestions.map(item => `<div class="mini-card"><h3>${esc(item)}</h3><p>建议规划点，还不是确认行程。</p></div>`).join("")}
          </div>
          <button class="btn btn-primary" onclick="openTaipeiPlanModal()">${icon("notebook-pen", "icon-sm")} 补台北段</button>
        </div>
      `;
    }

    function renderDrawer() {
      if (!appState.drawer) return "";
      if (appState.drawer === "checklist") return renderDrawerShell("行程评级", renderChecklistDrawer());
      if (appState.drawer === "confirm") return renderDrawerShell("待确认中心", renderConfirmDrawer());
      if (appState.drawer === "settings") return renderDrawerShell("设置", renderSettingsDrawer());
      if (appState.drawer === "more") return renderDrawerShell("更多", renderMoreDrawer());
      return "";
    }

    function renderDrawerShell(title, content) {
      return `
        <div class="overlay" onclick="closeDrawer(event)">
          <aside class="drawer" onclick="event.stopPropagation()">
            <div class="drawer-head">
              <h2 class="serif">${esc(title)}</h2>
              <button class="btn btn-icon" onclick="setState({drawer:null})">${icon("x", "icon-sm")}</button>
            </div>
            ${content}
          </aside>
        </div>
      `;
    }

    function drawerAction(symbol, label, action) {
      return `<button class="drawer-action" onclick="runDrawerAction(() => ${action})"><span class="drawer-action-icon">${symbol}</span><span>${esc(label)}</span></button>`;
    }

    function renderMoreDrawer() {
      return `
        <div class="more-drawer">
          <div>
            <div class="drawer-section-title">─── 行程导航 ───</div>
            ${drawerAction("🏠", "总览", "goDashboard()")}
            ${drawerAction("🚢", "高雄", "selectCity('kaohsiung')")}
            ${drawerAction("🌊", "墾丁", "selectCity('kenting')")}
            ${drawerAction("🏙", "台北", "selectCity('taipei')")}
          </div>
          <div>
            <div class="drawer-section-title">─── 功能 ───</div>
            ${drawerAction("⭐", "评级中心", "goSpotReviews()")}
            ${drawerAction("✅", "打卡清单", "openDrawer('checklist')")}
            ${drawerAction("🖼", "旅行相册", "openTripAlbum()")}
            ${drawerAction("📄", "旅行报告", "generateTravelReport()")}
            ${drawerAction("📤", "导出到 Google My Maps", "generateKML()")}
          </div>
          <div>
            <div class="drawer-section-title">─── 设置 ───</div>
            ${drawerAction("⚙️", "设置", "openDrawer('settings')")}
          </div>
        </div>
      `;
    }

    function renderChecklistDrawer() {
      const stats = spotRatingStats();
      return `
        <div class="info-list">
          <div class="mini-card">
            <h3>${icon("star", "icon-sm")} 打卡清单已升级</h3>
            <p class="rail-muted">现在用评级中心记录地点评分、吃买日志、备注和照片。已评 ${stats.total - stats.unrated}/${stats.total} 个地点。</p>
          </div>
          <button class="btn btn-primary" onclick="goSpotReviews()">${icon("arrow-right", "icon-sm")} 打开评级中心</button>
        </div>
      `;

    function renderConfirmDrawer() {
      return `
        <p class="rail-muted" style="margin-top:0;">这些事项不默认铺在页面上，需要时从中心打开。</p>
        <div class="check-group">
          ${tripData.globalConfirmations.map(name => {
            const id = `confirm-${name}`;
            return `
              <label class="check-item ${canEditTrip() ? "" : "disabled"}">
                ${canEditTrip() ? `<input type="checkbox" ${appState.confirmStatus[id] ? "checked" : ""} onchange="toggleConfirm('${escAttr(id)}')" />` : icon(appState.confirmStatus[id] ? "check-circle-2" : "circle", "icon-sm")}
                <span>${esc(name)}</span>
              </label>
            `;
          }).join("")}
        </div>
      `;

    function renderCollaborationPanel() {
      if (!isSupabaseConfigured()) {
        return `
          <div class="mini-card collab-card">
            <h3>${icon("cloud-off", "icon-sm")} Supabase 未配置</h3>

        return `
          <div class="mini-card collab-card">
            <h3>${icon("mail", "icon-sm")} 邮箱登录</h3>

            <div class="auth-row">
              <input id="login-email" type="email" placeholder="your@email.com" autocomplete="email" />
              <button class="btn btn-primary" onclick="sendLoginLink()">${icon("send", "icon-sm")} 发送登录链接</button>
            </div>
          </div>

            <span class="tag">${tripStateRealtimeChannel ? "Realtime 已订阅" : "云端同步待连接"}</span>
          </div>
          ${isViewerRole() ? `<div class="readonly-note"><strong>viewer 只读模式。</strong>你可以查看实时更新，但不能修改备注、费用、清单或打卡状态。</div>` : ""}
          ${authNotice ? `<p class="rail-muted">${esc(authNotice)}</p>` : ""}
          <button class="btn" onclick="signOut()">${icon("log-out", "icon-sm")} 退出登录</button>
        </div>
      `;

    function renderInvitePanel() {
      if (!isSupabaseConfigured()) {
        return `
          <div class="mini-card collab-card">
            <h3>${icon("user-plus", "icon-sm")} 邀请成员</h3>
            <p class="rail-muted">Supabase 配置完成后，这里会生成 7 天有效的邀请链接。</p>
            <button class="btn btn-primary" disabled>${icon("wand-sparkles", "icon-sm")} 生成邀请链接</button>

        `;

        return `
          <div class="mini-card collab-card">
            <h3>${icon("link", "icon-sm")} 邀请成员</h3>

        return `
          <div class="mini-card collab-card">
            <h3>${icon("link", "icon-sm")} 邀请成员</h3>
            <p class="rail-muted">当前角色没有生成邀请链接的权限。</p>
          </div>
        `;
      }
      return `
        <div class="mini-card collab-card">
          <h3>${icon("user-plus", "icon-sm")} 邀请成员</h3>
          <p class="rail-muted">邀请链接 7 天有效。收到链接的人登录后会自动加入这趟行程。</p>
          <div class="auth-row">
            <select id="invite-role" class="role-select" aria-label="邀请角色">
              <option value="editor">editor · 可编辑</option>
              <option value="viewer">viewer · 只读</option>
            </select>
            <button class="btn btn-primary" onclick="generateInviteLink()">${icon("wand-sparkles", "icon-sm")} 生成邀请链接</button>
          </div>
          ${generatedInviteLink ? `
            <div class="invite-link-row">
              <input value="${esc(generatedInviteLink)}" readonly />
              <button class="btn" onclick="copyInviteLink()">${icon("copy", "icon-sm")} 复制</button>
            </div>
          ` : ""}
        </div>
      `;
    }

    function renderMembersPanel() {
      if (!isSupabaseConfigured()) {
        return `
          <div class="mini-card member-card">
            <h3>${icon("users-round", "icon-sm")} 成员列表</h3>
            <p class="rail-muted">连接 Supabase 后会从 trip_members 读取成员邮箱和角色。</p>
          </div>
        `;
      }
      return `
        <div class="mini-card member-card">
          <h3>${icon("users-round", "icon-sm")} 成员列表</h3>
          ${tripMembers.length ? `
            <div class="member-list">
              ${tripMembers.map(member => `
                <div class="member-row">

    function countdownText() {
      const now = new Date();
      const start = new Date(tripData.startDate);
      const end = new Date(tripData.endDate);
      if (now < start) {
        const daysLeft = Math.ceil((start - now) / 86400000);
        return `${daysLeft} days`;
      }
      if (now <= end) return "On trip";
      return "Completed";
    }

    function cleanupLeafletMaps() {
      Object.values(activeLeafletMaps || {}).forEach(entry => {
        try { entry.map.remove(); } catch {}
      });
      activeLeafletMaps = {};
    }

    function scheduleMapInit() {
      if (!document.querySelector(".leaflet-map")) return;
      window.requestAnimationFrame(() => window.setTimeout(initLeafletMaps, 0));
    }

    function initLeafletMaps() {
      if (!window.L) return;
      document.querySelectorAll(".leaflet-map").forEach(el => {
        if (!el.id || activeLeafletMaps[el.id]) return;
        const map = L.map(el, {
          zoomControl: true,
          scrollWheelZoom: false,
          doubleClickZoom: true,
          tap: true
        });
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap"
        }).addTo(map);
        const points = pointsForMapElement(el);
        const entry = { map, points, markers: {}, kind: el.dataset.mapKind };
        activeLeafletMaps[el.id] = entry;
        drawTravelMap(el.id, entry, points);
        window.setTimeout(() => {
          map.invalidateSize();
          fitMapToPoints(map, points);
          focusSelectedMarkerInMap(el.id, false);
        }, 80);
      });
    }

    function pointsForMapElement(el) {
      if (el.dataset.mapKind === "trip") {
        return tripMapRoute.map((point, index) => ({
          ...point,
          title: point.name,
          locationName: point.name,
          time: index === 0 ? "Start" : index === tripMapRoute.length - 1 ? "Return" : "",
          routeIndex: index + 1,
          googleMapsQuery: point.name
        }));
      }
      if (el.dataset.mapKind === "city") return mapPointsForCity(el.dataset.city);
      const day = tripData.daysById[el.dataset.day];
      return mapPointsForDay(day);
    }

    function drawTravelMap(mapId, entry, points) {
      if (!points.length) {
        entry.map.setView([23.7, 121], 7);
        return;
      }
      points.forEach((point, index) => {
        if (index === 0) return;
        const previous = points[index - 1];
        const mode = transportMode(point.transportFromPrevious);
        L.polyline([[previous.lat, previous.lng], [point.lat, point.lng]], {
          color: transportColor(mode, point.cityId),
          weight: transportWeight(mode),
          opacity: 0.86,
          dashArray: transportDash(mode),
          className: `travel-line line-${mode}`
        }).addTo(entry.map);
      });
      points.forEach((point, index) => {
        const marker = L.marker([point.lat, point.lng], {
          icon: makeTravelMarker(point, index, entry.kind)
        }).addTo(entry.map);
        marker.bindPopup(renderMapPopup(point, index), { closeButton: false });
        marker.on("click", () => {
          if (entry.kind === "trip" && tripData.cities[point.cityId]) {
            selectCity(point.cityId);
            return;
          }
          focusMapPoint(point.id, mapId);
        });
        marker.on("mouseover", () => setMarkerHover(point.id, true));
        marker.on("mouseout", () => setMarkerHover(point.id, false));
        entry.markers[point.id] = marker;
      });
    }

    function makeTravelMarker(point, index, kind) {
      const selected = appState.selectedMapPoint === point.id || (kind === "trip" && point.cityId === appState.selectedCity);
      const currentTripNode = kind === "trip" && !appState.selectedCity && point.cityId === "kaohsiung";
      const done = !!appState.completedItems[point.id];
      const fav = !!appState.favoriteItems[point.id];
      const color = markerColor(point);
      const label = point.suggested ? "?" : point.routeIndex || index + 1;
      const markerClass = [
        "travel-marker",
        selected || currentTripNode ? "selected" : "",
        done ? "done" : "",
        fav ? "fav" : "",
        point.suggested ? "suggested" : ""
      ].filter(Boolean).join(" ");
      return L.divIcon({
        className: "travel-marker-shell",
        html: `<div class="${markerClass}" style="--marker-color:${color}" data-marker-id="${escAttr(point.id)}"><span>${label}</span></div>`,
        iconSize: [42, 42],
        iconAnchor: [18, 36],
        popupAnchor: [0, -34]
      });
    }

    function renderMapPopup(point, index) {
      const title = point.locationName || point.title;
      const meta = [
        point.time ? `${point.time}` : `No. ${index + 1}`,
        point.transportFromPrevious,
        point.suggested ? "建议规划点" : "",
        point.approximate ? "近似坐标" : ""
      ].filter(Boolean).join(" · ");
      return `
        <div class="map-popup-title">${esc(title)}</div>
        <div class="map-popup-meta">${esc(meta)}</div>
        ${point.description ? `<div class="map-popup-meta">${esc(point.description)}</div>` : ""}
        <button class="btn btn-small btn-ghost" style="margin-top:8px;" onclick="openMaps('${escAttr(point.googleMapsQuery || title)}')">${icon("map-pin", "icon-sm")} Google Maps</button>
      `;
    }

    function markerColor(point) {
      if (point.suggested) return "#FF6B5A";
      if (point.type === "food" || point.type === "night-market") return "#FF6B5A";
      if (point.type === "sunset") return "#FFB23F";
      if (point.type === "activity") return "#00BFA6";
      if (point.cityId === "kenting") return "#00BFA6";
      if (point.cityId === "taipei") return "#5B7CFA";
      if (point.cityId === "kaohsiung") return "#1CA7EC";
      return "#17324D";
    }

    function transportMode(label = "") {
      if (/飞机|航班|flight/i.test(label)) return "flight";
      if (/高铁|HSR/i.test(label)) return "hsr";
      if (/机车|电动车|bike|scooter/i.test(label)) return "scooter";
      if (/捷运|轻轨|MRT/i.test(label)) return "mrt";
      if (/打车|taxi|接送/i.test(label)) return "taxi";
      if (/快线|巴士|bus|9189/i.test(label)) return "bus";
      if (/步行|逛/i.test(label)) return "walk";
      return "default";
    }

    function transportColor(mode, cityId) {
      const colors = {
        flight: "#1CA7EC",
        hsr: "#7C5CFF",
        scooter: "#43B86F",
        mrt: "#1CA7EC",
        taxi: "#FF8A4C",
        bus: "#00BFA6",
        walk: "#A78B5F",
        default: cityId === "kenting" ? "#00BFA6" : cityId === "taipei" ? "#FF6B5A" : "#1CA7EC"
      };
      return colors[mode] || colors.default;
    }

    function transportWeight(mode) {
      return mode === "flight" || mode === "hsr" ? 5 : mode === "walk" ? 3 : 4;
    }

    function transportDash(mode) {
      const dashes = {
        flight: "12 12",
        walk: "2 9",
        scooter: "14 5 4 5",
        taxi: "10 7",
        hsr: "18 6",
        bus: "12 6"
      };
      return dashes[mode] || null;
    }

    function fitMapToPoints(map, points) {
      if (!points.length) return;
      if (points.length === 1) {
        map.setView([points[0].lat, points[0].lng], 14);
        return;
      }
      const bounds = L.latLngBounds(points.map(point => [point.lat, point.lng]));
      map.fitBounds(bounds, { padding: [32, 32], maxZoom: 14 });
    }

    function focusSelectedMarkerInMap(mapId, animate = true) {
      const entry = activeLeafletMaps[mapId];
      if (!entry || !appState.selectedMapPoint) return;
      const marker = entry.markers[appState.selectedMapPoint];
      const point = entry.points.find(item => item.id === appState.selectedMapPoint);
      if (!marker || !point) return;
      if (animate) entry.map.flyTo([point.lat, point.lng], Math.max(entry.map.getZoom(), 14), { duration: 0.6 });
      else entry.map.setView([point.lat, point.lng], Math.max(entry.map.getZoom(), 13));
      marker.openPopup();
    }

    function setMarkerHover(pointId, active) {
      const safeId = window.CSS?.escape ? CSS.escape(pointId) : String(pointId).replace(/"/g, '\\"');
      document.querySelectorAll(`[data-marker-id="${safeId}"]`).forEach(el => {
        el.classList.toggle("hovered", active);
      });
    }

    function resetMapView(mapId) {
      const entry = activeLeafletMaps[mapId];
      if (!entry) return;
      fitMapToPoints(entry.map, entry.points);
    }

    function selectMapPoint(pointId) {
      setState({ selectedMapPoint: pointId });
    }

    function focusMapPoint(pointId, mapId) {
      const entry = activeLeafletMaps[mapId];
      if (entry?.markers?.[pointId]) {
        const point = entry.points.find(item => item.id === pointId);
        if (point) entry.map.flyTo([point.lat, point.lng], Math.max(entry.map.getZoom(), 14), { duration: 0.6 });
        entry.markers[pointId].openPopup();
      }
      setState({ selectedMapPoint: pointId });
    }

    function softHighlightMapPoint(pointId, active) {
      setMarkerHover(pointId, active);
    }

    function showItemOnMap(itemId) {
      setState({ selectedTab: "route", selectedMapPoint: itemId, searchQuery: "", typeFilter: "all" });
    }

    function openMapModal(dayId) {
