<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taiwan Trip 2026 · Travel App</title>
  <meta name="description" content="A layered interactive travel guide for Taiwan Trip 2026." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --navy: #102235;
      --navy-2: #18344f;
      --ivory: #fbf7ef;
      --paper: #fffdf8;
      --sand: #e8dac4;
      --sand-2: #f3eadf;
      --orange: #d76d3a;
      --orange-2: #f2a36e;
      --sage: #7f9a80;
      --sage-2: #e9efe7;
      --ink: #172033;
      --muted: #6e7786;
      --line: rgba(23, 32, 51, 0.1);
      --glass: rgba(255, 253, 248, 0.72);
      --shadow: 0 24px 70px rgba(16, 34, 53, 0.12);
      --shadow-soft: 0 14px 38px rgba(16, 34, 53, 0.1);
      --radius-lg: 28px;
      --radius: 22px;
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(140deg, rgba(16,34,53,.06), transparent 32%),
        linear-gradient(0deg, var(--ivory), #f7efe5 100%);
      letter-spacing: 0;
    }

    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    .hidden { display: none !important; }
    .serif { font-family: "Playfair Display", Georgia, serif; }
    .icon { width: 18px; height: 18px; stroke-width: 1.9; }
    .icon-sm { width: 15px; height: 15px; stroke-width: 2; }

    .app-root { min-height: 100vh; }
    .btn {
      border: 1px solid rgba(16,34,53,.1);
      background: var(--paper);
      color: var(--ink);
      min-height: 42px;
      border-radius: 999px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(16,34,53,.06);
      transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); border-color: rgba(16,34,53,.16); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: var(--navy);
      color: #fff;
      border-color: rgba(255,255,255,.08);
      box-shadow: 0 16px 36px rgba(16,34,53,.22);
    }
    .btn-primary:hover { background: var(--navy-2); }
    .btn-ghost {
      background: rgba(255,253,248,.58);
      box-shadow: none;
      backdrop-filter: blur(16px);
    }
    .btn-danger { color: #9f3d2f; border-color: rgba(159,61,47,.18); background: #fff8f4; }
    .btn-small { min-height: 34px; padding: 0 12px; font-size: 12px; }
    .btn-icon { width: 38px; min-height: 38px; padding: 0; border-radius: 15px; }

    .chip {
      border: 1px solid rgba(16,34,53,.08);
      border-radius: 999px;
      padding: 7px 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,253,248,.64);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .tag { display: inline-flex; padding: 6px 10px; border-radius: 999px; background: var(--sand-2); color: #6f5a40; font-size: 11px; font-weight: 800; }
    .tag.sage { background: var(--sage-2); color: #536c55; }
    .tag.orange { background: #fbe8db; color: #9a4b29; }
    .tag.dark { background: rgba(16,34,53,.08); color: var(--navy); }

    .card {
      background: rgba(255,253,248,.84);
      border: 1px solid rgba(16,34,53,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
    }
    .soft-card {
      background: rgba(255,253,248,.64);
      border: 1px solid rgba(16,34,53,.08);
      border-radius: var(--radius);
    }

    /* Journey selection */
    .journey-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        linear-gradient(120deg, rgba(16,34,53,.94), rgba(20,53,78,.86)),
        linear-gradient(0deg, #102235, #102235);
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .journey-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent);
      pointer-events: none;
    }
    .journey-wrap {
      width: min(1120px, 100%);
      position: relative;
      z-index: 1;
    }
    .journey-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(20px);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .journey-title {
      margin: 24px 0 10px;
      font-size: clamp(42px, 8vw, 96px);
      line-height: .92;
      letter-spacing: 0;
    }
    .journey-subtitle { margin: 0 0 34px; color: rgba(255,255,255,.66); font-size: clamp(16px, 2vw, 22px); }
    .journey-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr);
      gap: 22px;
      align-items: stretch;
    }
    .hero-trip-card {
      border-radius: 34px;
      padding: clamp(24px, 4vw, 42px);
      background:
        linear-gradient(145deg, rgba(255,253,248,.94), rgba(244,232,214,.86));
      color: var(--ink);
      min-height: 470px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 34px 90px rgba(0,0,0,.26);
      border: 1px solid rgba(255,255,255,.28);
    }
    .trip-card-top { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
    .trip-label { color: var(--orange); font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .hero-trip-card h2 { margin: 12px 0 12px; font-size: clamp(34px, 5vw, 62px); line-height: .96; }
    .trip-card-meta { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .trip-route-card {
      border-radius: 26px;
      padding: 18px;
      background: rgba(16,34,53,.06);
      border: 1px solid rgba(16,34,53,.08);
    }
    .trip-route-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--navy); font-size: 13px; font-weight: 800; }
    .future-grid { display: grid; gap: 12px; }
    .future-card {
      border-radius: 24px;
      padding: 22px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(20px);
      color: rgba(255,255,255,.48);
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 82px;
    }
    .future-card strong { color: rgba(255,255,255,.78); font-size: 19px; }
    .future-card span { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

    /* App shell */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 42px);
      background: rgba(251,247,239,.78);
      border-bottom: 1px solid rgba(16,34,53,.08);
      backdrop-filter: blur(24px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: #fff;
      box-shadow: 0 12px 28px rgba(16,34,53,.22);
    }
    .brand-title { display: grid; gap: 1px; min-width: 0; }
    .brand-title strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-title span { color: var(--muted); font-size: 12px; font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .app-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 300px;
      gap: 20px;
      padding: 22px clamp(16px, 4vw, 38px) 92px;
      max-width: 1480px;
      margin: 0 auto;
    }
    .side-nav, .right-rail {
      position: sticky;
      top: 92px;
      align-self: start;
      max-height: calc(100vh - 110px);
      overflow: auto;
    }
    .side-nav { padding: 16px; }
    .side-title { color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; margin: 4px 8px 10px; }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      border-radius: 16px;
      min-height: 42px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
    }
    .nav-btn:hover { background: rgba(16,34,53,.05); }
    .nav-btn.active { background: var(--navy); color: #fff; }
    .nav-btn small { margin-left: auto; color: inherit; opacity: .62; font-weight: 800; }
    .side-divider { height: 1px; background: var(--line); margin: 14px 4px; }
    .main-stage { min-width: 0; display: grid; gap: 18px; }
    .right-rail { display: grid; gap: 14px; }
    .rail-card { padding: 18px; }
    .rail-card h3 { margin: 0 0 12px; font-size: 14px; }
    .rail-muted { color: var(--muted); font-size: 13px; line-height: 1.55; }

    /* Dashboard */
    .dashboard-hero {
      border-radius: 34px;
      padding: clamp(24px, 4vw, 40px);
      min-height: 330px;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(16,34,53,.96), rgba(24,52,79,.88)),
        linear-gradient(180deg, #102235, #18344f);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .dashboard-hero::after {
      content: "";
      position: absolute;
      inset: auto -10% -35% 45%;
      height: 260px;
      background: linear-gradient(90deg, rgba(215,109,58,.34), rgba(127,154,128,.3));
      filter: blur(60px);
      opacity: .7;
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-row { display: flex; justify-content: space-between; gap: 20px; align-items: start; }
    .hero-title { margin: 14px 0 10px; font-size: clamp(36px, 6vw, 74px); line-height: .95; }
    .hero-meta { color: rgba(255,255,255,.74); font-weight: 700; line-height: 1.7; }
    .hero-stats { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 10px; }
    .stat-tile {
      border-radius: 22px;
      padding: 15px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(16px);
      min-width: 140px;
    }
    .stat-tile span { color: rgba(255,255,255,.66); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .stat-tile strong { display: block; margin-top: 7px; font-size: 22px; }
    .progress-bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; margin-top: 10px; }
    .progress-bar div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--orange-2), var(--sage)); }
    .route-visual {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 2px;
      margin-top: 24px;
    }
    .route-node {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.16);
      color: #fff;
      font-weight: 850;
      font-size: 13px;
    }
    .route-arrow { color: rgba(255,255,255,.48); }
    .flight-strip {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .flight-strip .mini-card {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.14);
      color: #fff;
      backdrop-filter: blur(16px);
    }
    .flight-strip .mini-card h3 { color: #fff; }
    .flight-strip .mini-card p { color: rgba(255,255,255,.7); }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }
    .section-head h2 { margin: 0; font-size: 24px; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .city-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .city-card {
      border: 0;
      text-align: left;
      cursor: pointer;
      padding: 20px;
      min-height: 238px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--ink);
    }
    .city-card:hover { transform: translateY(-3px); }
    .city-card h3 { margin: 12px 0 8px; font-size: 29px; }
    .city-card .city-date { color: var(--muted); font-size: 13px; font-weight: 800; }
    .city-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    .status-line { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 18px; color: var(--muted); font-size: 12px; font-weight: 800; }

    /* City/day pages */
    .page-hero {
      border-radius: 32px;
      padding: clamp(22px, 4vw, 34px);
      background: rgba(255,253,248,.86);
      border: 1px solid rgba(16,34,53,.08);
      box-shadow: var(--shadow-soft);
    }
    .crumb-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .page-title-row { display: flex; justify-content: space-between; gap: 20px; align-items: start; }
    .page-title { margin: 0; font-size: clamp(34px, 5vw, 58px); line-height: 1; }
    .page-intro { color: var(--muted); line-height: 1.75; max-width: 720px; font-size: 15px; }
    .date-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: thin;
    }
    .date-chip {
      flex: 0 0 auto;
      min-width: 138px;
      border: 1px solid rgba(16,34,53,.1);
      background: rgba(255,253,248,.76);
      border-radius: 18px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      transition: all .18s var(--ease);
    }
    .date-chip:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .date-chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .date-chip strong { display: block; font-size: 13px; }
    .date-chip span { display: block; margin-top: 4px; color: inherit; opacity: .68; font-size: 11px; font-weight: 800; }
    .hotel-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .info-card { padding: 18px; }
    .info-card h3 { margin: 0 0 10px; font-size: 15px; }
    .info-list { display: grid; gap: 10px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .day-header {
      padding: clamp(22px, 4vw, 32px);
      border-radius: 32px;
      background: rgba(255,253,248,.88);
      border: 1px solid rgba(16,34,53,.08);
      box-shadow: var(--shadow-soft);
    }
    .day-title-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
    .day-title-grid h1 { margin: 10px 0 10px; font-size: clamp(30px, 5vw, 52px); line-height: 1.04; }
    .density-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 9px 13px;
      background: var(--sage-2);
      color: #4f6c54;
      font-size: 12px;
      font-weight: 900;
    }
    .tab-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px;
      border-radius: 22px;
      background: rgba(16,34,53,.05);
      border: 1px solid rgba(16,34,53,.06);
    }
    .tab-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 17px;
      padding: 11px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 850;
      white-space: nowrap;
      cursor: pointer;
      min-height: 42px;
    }
    .tab-btn.active { background: var(--paper); color: var(--navy); box-shadow: 0 8px 18px rgba(16,34,53,.08); }
    .panel { padding: 18px; }
    .panel-head { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .panel-head h2 { margin: 0; font-size: 20px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .search-input {
      border: 1px solid rgba(16,34,53,.1);
      background: var(--paper);
      border-radius: 999px;
      min-height: 40px;
      padding: 0 14px;
      color: var(--ink);
      outline: none;
      min-width: 210px;
    }
    .timeline-list { display: grid; gap: 12px; }
    .timeline-item {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 14px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,253,248,.74);
      border: 1px solid rgba(16,34,53,.08);
      transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    }
    .timeline-item:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(16,34,53,.08); }
    .timeline-item.done { opacity: .68; }
    .timeline-time { color: var(--orange); font-weight: 900; font-size: 14px; padding-top: 2px; }
    .timeline-body h3 { margin: 0 0 7px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .timeline-body p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 13px; }
    .timeline-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .action-btn {
      border: 1px solid rgba(16,34,53,.08);
      background: var(--paper);
      color: var(--muted);
      min-height: 34px;
      border-radius: 13px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 850;
    }
    .action-btn.active { color: var(--navy); border-color: rgba(16,34,53,.2); background: var(--sand-2); }
    .action-btn.done { color: #4f6c54; background: var(--sage-2); }
    .item-note { margin-top: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(232,218,196,.36); color: #5f5146; font-size: 12px; line-height: 1.55; }

    .route-panel { display: grid; gap: 12px; }
    .route-plan {
      margin-bottom: 16px;
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(16,34,53,.07), rgba(127,154,128,.12));
      border: 1px solid rgba(16,34,53,.08);
    }
    .route-plan-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: start;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .route-plan-head h3 { margin: 0 0 7px; font-size: 20px; }
    .route-plan-head p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 13px; max-width: 620px; }
    .route-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .route-metric {
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,253,248,.72);
      border: 1px solid rgba(16,34,53,.08);
    }
    .route-metric strong { display: block; font-size: 17px; color: var(--navy); }
    .route-metric span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .route-stop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .route-stop-pill {
      display: flex;
      gap: 9px;
      align-items: start;
      padding: 11px;
      border-radius: 18px;
      background: rgba(255,253,248,.7);
      border: 1px solid rgba(16,34,53,.08);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .route-stop-pill b {
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: #fff;
      font-size: 12px;

      gap: 12px;
      position: relative;
      padding-bottom: 12px;

      content: "";
      position: absolute;
      left: 16px;
      top: 36px;
      bottom: -2px;
      width: 1px;
      background: rgba(16,34,53,.14);
    }
    .route-dot {
      width: 34px;
      height: 34px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: #fff;
      position: relative;
      z-index: 1;
    }
    .route-card { padding: 14px; }
    .route-card strong { display: block; margin-bottom: 6px; }

    .mini-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .empty-state {
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
      border-radius: 30px;
      background:

      border: 1px solid rgba(16,34,53,.08);

    .empty-state h2 { margin: 12px 0 8px; font-size: clamp(28px, 5vw, 46px); }

      width: 100%;
      min-height: 260px;
      border: 1px solid rgba(16,34,53,.08);
      outline: none;
      resize: vertical;
      border-radius: 26px;
      padding: 22px;
      background:
        linear-gradient(rgba(255,255,255,0) 31px, rgba(16,34,53,.05) 32px),
        var(--paper);
      background-size: 100% 32px;
      line-height: 32px;
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    .expense-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(16,34,53,.07);

    .check-group { margin-bottom: 18px; }

      display: flex;

      gap: 10px;
      padding: 12px;

    .field input, .field textarea, .field select {

      return { id, time, title, type, place, detail, transport };

      return {
        id,

      };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return normalizeState(raw ? { ...defaultState, ...JSON.parse(raw) } : { ...defaultState });
      } catch {
        return { ...defaultState };
      }
    }

    function normalizeState(state) {
      if (!state.currentView) state.currentView = "journey-select";
      if (state.currentView !== "journey-select" && !state.selectedTrip) state.selectedTrip = tripData.id;
      if (state.selectedCity && !tripData.cities[state.selectedCity]) state.selectedCity = null;
      if (state.selectedDay && !tripData.daysById[state.selectedDay]) state.selectedDay = null;
      if (state.currentView === "day" && !state.selectedDay) state.currentView = state.selectedCity ? "city" : "trip-dashboard";
      if (state.currentView === "city" && !state.selectedCity) state.currentView = "trip-dashboard";
      return state;
    }

    function saveState() {
      const persistent = { ...appState, drawer: null, modal: null, toast: "" };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(persistent));
    }

    function setState(patch, shouldRender = true) {
      appState = normalizeState({ ...appState, ...patch });
      saveState();
      if (shouldRender) render();
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function icon(name, cls = "icon") {
      return `<i data-lucide="${name}" class="${cls}"></i>`;
    }

    function daysForCity(cityId) {
      return tripData.cities[cityId]?.dayIds.map(id => tripData.daysById[id]).filter(Boolean) || [];
    }

    function dayContext(day, cityId) {
      const segment = tripData.cityDayLabels?.[cityId]?.[day.id];
      const title = segment?.title || day.title;
      return {
        label: segment?.label || day.label,
        title: day.planned || title.includes("待规划") ? title : `${title} · 待规划`
      };
    }

    function selectedCity() {
      return appState.selectedCity ? tripData.cities[appState.selectedCity] : null;
    }

    function selectedDay() {
      return appState.selectedDay ? tripData.daysById[appState.selectedDay] : null;
    }

    function allTimelineItems() {
      return days.flatMap(day => day.timeline || []);
    }

    function tripProgress() {
      const items = allTimelineItems();
      const completed = items.filter(item => appState.completedItems[item.id]).length;
      return { completed, total: items.length, percent: items.length ? Math.round(completed / items.length * 100) : 0 };
    }

    function userExpenseTotalCount() {
      return Object.values(appState.expenses || {}).flat().length;
    }

    function render() {
      const app = document.getElementById("app");
      if (appState.currentView === "journey-select") {
        app.innerHTML = renderJourneySelect();
      } else {
        app.innerHTML = renderShell();
      }
      document.getElementById("modal-root").innerHTML = renderModal();
      document.getElementById("toast-root").innerHTML = appState.toast ? `<div class="toast">${esc(appState.toast)}</div>` : "";
      if (window.lucide) lucide.createIcons();
    }

          <div class="panel-head">
            <div>
              <h2>轻量预算汇总</h2>
              <p class="rail-muted">已知大项、交通估算与待补费用集中留档。</p>
            </div>
            <button class="btn btn-small" onclick="openDrawer('settings')">${icon("settings", "icon-sm")} 设置</button>
          </div>
          <div class="budget-grid">
            <div class="mini-card"><h3>高雄酒店</h3><p>约 HK$574/晚 · 已订</p></div>
            <div class="mini-card"><h3>墾丁交通</h3><p>墾丁快线 NT$145 · 班次需确认</p></div>
            <div class="mini-card"><h3>机车</h3><p>NT$350–500/天 · 证件规则需确认</p></div>
            <div class="mini-card"><h3>自定义费用</h3><p>已记录 ${userExpenseTotalCount()} 项，保存在本机 localStorage。</p></div>
          </div>
        </section>
      `;
    }

    function renderCityCard(city) {
      return `
        <button class="city-card card" onclick="selectCity('${city.id}')">
          <div>
            <span class="tag ${city.status === "待规划" ? "orange" : "sage"}">${esc(city.status)}</span>
            <h3 class="serif">${esc(city.name)}</h3>
            <div class="city-date">${esc(city.range)} · ${esc(city.nights)}</div>
            <div class="city-tags">${city.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          </div>
          <div class="status-line">
            <span>${city.id === "taipei" ? "保留弹性规划" : "日期与住宿已整理"}</span>
            ${icon("arrow-right", "icon-sm")}
          </div>
        </button>
      `;
    }

    function renderCityPage() {
      const city = selectedCity();
      if (!city) return renderDashboard();
      return `
        <section class="page-hero">
          <div class="crumb-row">
            <button class="btn btn-small btn-ghost" onclick="goDashboard()">${icon("chevron-left", "icon-sm")} 返回台湾总览</button>
            <button class="btn btn-small" onclick="openDrawer('checklist')">${icon("check-square", "icon-sm")} 打卡清单</button>
          </div>
          <div class="page-title-row">
            <div>
              <span class="tag ${city.status === "待规划" ? "orange" : "sage"}">${esc(city.status)}</span>
              <h1 class="page-title serif">${esc(city.name)}</h1>
              <p class="page-intro">${esc(city.intro)}</p>
              <div class="city-tags">${city.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
            </div>
            <div class="soft-card info-card" style="min-width:min(320px,100%);">
              <h3>${esc(city.range)} · ${esc(city.nights)}</h3>
              <div class="rail-muted">按停留节奏进入当天安排。</div>
            </div>
          </div>
        </section>
        <section class="card panel">
          <div class="panel-head">
            <div>
              <h2>选择日期</h2>
              <p class="rail-muted">每一天保留独立节奏，方便临场调整。</p>
            </div>
          </div>
          <div class="date-strip">
            ${daysForCity(city.id).map(day => renderDateChip(day, city.id)).join("")}
          </div>
        </section>
        ${renderCityInfo(city)}
      `;
    }

    function renderCityInfo(city) {
      if (city.id === "taipei") {
        return renderTaipeiEmptyState("city");
      }
      const hotel = city.hotel;
      return `
        <section class="hotel-grid">
          <article class="card info-card">
            <h3>${icon("bed-double", "icon-sm")} 酒店</h3>
            <div class="info-list">
              <div><strong>${esc(hotel.name)}</strong> · ${esc(hotel.status)}</div>
              ${hotel.price ? `<div>${esc(hotel.price)}</div>` : ""}
              ${hotel.feature ? `<div>${esc(hotel.feature)}</div>` : ""}
              <div>入住：${esc(hotel.checkin)}</div>
              <div>退房：${esc(hotel.checkout)}</div>
            </div>
          </article>
          <article class="card info-card">
            <h3>${icon("compass", "icon-sm")} 城市节奏</h3>
            <div class="info-list">
              <div>抵达日轻量打开城市。</div>
              <div>完整日集中安排艺术、海边与夜景。</div>
              <div>跨城日上午退房转场，下午进入下一段旅程。</div>
            </div>
          </article>
        </section>
      `;
    }

    function renderDateChip(day, cityId = appState.selectedCity) {
      const context = dayContext(day, cityId);
      const cityArg = cityId ? `, '${cityId}'` : "";
      return `
        <button class="date-chip ${appState.selectedDay === day.id ? "active" : ""}" onclick="selectDay('${day.id}'${cityArg})">
          <strong>${esc(context.label)}</strong>
          <span>${esc(context.title)}</span>
        </button>
      `;
    }

    function renderDayPage() {
      const day = selectedDay();
      const city = selectedCity() || tripData.cities[day?.cityId];
      if (!day) return renderCityPage();
      return `
        <section class="day-header">
          <div class="crumb-row">
            <button class="btn btn-small btn-ghost" onclick="backToCity()">${icon("chevron-left", "icon-sm")} 返回城市</button>
            <button class="btn btn-small btn-ghost" onclick="goDashboard()">${icon("layout-dashboard", "icon-sm")} 返回台湾总览</button>
            <button class="btn btn-small" onclick="copyDayPlan()">${icon("copy", "icon-sm")} 复制当天行程</button>
          </div>
          <div class="day-title-grid">
            <div>
              <span class="tag ${day.planned ? "sage" : "orange"}">${esc(day.cityName)} · ${esc(day.date)}</span>
              <h1 class="serif">${esc(day.title)}</h1>
              <p class="page-intro">${esc(day.focus)}</p>
            </div>
            <div class="density-pill">${icon(day.planned ? "gauge" : "sparkles", "icon-sm")} 行程密度：${esc(day.density)}</div>
          </div>
        </section>
        <section class="card panel">
          <div class="panel-head">
            <div>
              <h2>${city ? esc(city.name) : "日期"}内日期</h2>
              <p class="rail-muted">同一城市内快速切换当天节奏。</p>
            </div>
          </div>
          <div class="date-strip">
            ${(city ? daysForCity(city.id) : days).map(item => renderDateChip(item, city?.id)).join("")}
          </div>
        </section>
        <section class="tab-bar" aria-label="day tabs">
          ${renderTabButton("timeline", "时间轴", "list-checks")}
          ${renderTabButton("route", "地图路线", "route")}
          ${renderTabButton("food", "美食", "utensils")}
          ${renderTabButton("reminders", "提醒", "bell")}
          ${renderTabButton("budget", "预算", "wallet")}
          ${renderTabButton("notes", "备注", "notebook-pen")}
        </section>
        <section class="card panel">${renderSelectedTab(day)}</section>
      `;
    }

    function renderTabButton(id, label, iconName) {
      return `<button class="tab-btn ${appState.selectedTab === id ? "active" : ""}" onclick="setTab('${id}')">${icon(iconName, "icon-sm")} ${esc(label)}</button>`;
    }

    function renderSelectedTab(day) {
      if (!day.planned && appState.selectedTab !== "notes" && appState.selectedTab !== "budget") {
        return renderTaipeiEmptyState("day");
      }
      if (appState.selectedTab === "route") return renderRouteTab(day);
      if (appState.selectedTab === "food") return renderFoodTab(day);
      if (appState.selectedTab === "reminders") return renderRemindersTab(day);
      if (appState.selectedTab === "budget") return renderBudgetTab(day);
      if (appState.selectedTab === "notes") return renderNotesTab(day);
      return renderTimelineTab(day);
    }

    function renderTimelineTab(day) {
      const types = ["all", ...new Set(day.timeline.map(item => item.type))];
      const query = (appState.searchQuery || "").trim().toLowerCase();
      const filtered = day.timeline.filter(item => {
        const matchesType = appState.typeFilter === "all" || item.type === appState.typeFilter;
        const text = `${item.title} ${item.place} ${item.detail}`.toLowerCase();
        return matchesType && (!query || text.includes(query));
      });
      return `
        <div class="panel-head">
          <div>
            <h2>当天时间轴</h2>
            <p class="rail-muted">聚焦当天节点、地点和移动方式。</p>
          </div>
          <button class="btn btn-small btn-ghost" onclick="clearFilters()">${icon("x", "icon-sm")} 清除筛选</button>
        </div>
        <div class="filter-row" style="margin-bottom:16px;">
          <input class="search-input" placeholder="搜索当天内容..." value="${esc(appState.searchQuery)}" oninput="updateSearch(this.value)" />
          ${types.map(type => `
            <button class="chip ${appState.typeFilter === type ? "active" : ""}" onclick="setTypeFilter('${type}')">
              ${type === "all" ? "全部" : esc(typeMeta[type]?.label || type)}
            </button>
          `).join("")}
        </div>
        <div class="timeline-list">
          ${filtered.length ? filtered.map(renderTimelineItem).join("") : `<div class="empty-state"><h2 class="serif">No matches</h2><p>当前筛选没有结果，可以清除筛选或切换类型。</p></div>`}
        </div>
      `;
    }

    function renderTimelineItem(item) {
      const meta = typeMeta[item.type] || typeMeta.sight;
      const done = !!appState.completedItems[item.id];
      const fav = !!appState.favoriteItems[item.id];
      const note = appState.itemNotes[item.id];
      return `
        <article class="timeline-item ${done ? "done" : ""}">
          <div class="timeline-time">${esc(item.time)}</div>
          <div class="timeline-body">
            <h3>${icon(meta.icon, "icon-sm")} ${esc(item.title)} <span class="tag ${meta.tone}">${esc(meta.label)}</span></h3>
            <p>${esc(item.detail)}</p>
            <div class="timeline-actions">
              <button class="action-btn ${done ? "done" : ""}" onclick="toggleComplete('${item.id}')">${icon(done ? "check-circle-2" : "circle", "icon-sm")} ${done ? "已完成" : "标记完成"}</button>
              <button class="action-btn ${fav ? "active" : ""}" onclick="toggleFavorite('${item.id}')">${icon("heart", "icon-sm")} ${fav ? "已收藏" : "收藏"}</button>
              <button class="action-btn" onclick="openItemNote('${item.id}')">${icon("notebook-pen", "icon-sm")} 添加备注</button>
              <button class="action-btn" onclick="openMaps('${escAttr(item.place)}')">${icon("map-pin", "icon-sm")} 打开地图</button>
              <button class="action-btn" onclick="copyText('${escAttr(item.place || item.title)}')">${icon("copy", "icon-sm")} 复制地点</button>
            </div>
            ${note ? `<div class="item-note">${esc(note)}</div>` : ""}
          </div>
        </article>
      `;
    }

    function escAttr(value) {
      return String(value ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, " ");
    }

    function renderRouteTab(day) {
      if (!day.timeline.length) return renderTaipeiEmptyState("day");
      return `
        <div class="panel-head">
          <div>
            <h2>视觉化路线</h2>
            <p class="rail-muted">按地点顺序串起当天移动方式。</p>
          </div>
        </div>
        ${renderRoutePlan(day)}
        <div class="route-panel">
          ${day.timeline.map((item, index) => `
            <div class="route-step">
              <div class="route-dot">${index + 1}</div>
              <div class="route-card mini-card">
                <strong>${esc(item.time)} · ${esc(item.place || item.title)}</strong>
                <p>${esc(item.transport || "步行")} · ${esc(item.title)}</p>
                <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn btn-small btn-ghost" onclick="openMaps('${escAttr(item.place || item.title)}')">${icon("map-pin", "icon-sm")} 打开地图</button>
                  <button class="btn btn-small btn-ghost" onclick="copyText('${escAttr(item.place || item.title)}')">${icon("copy", "icon-sm")} 复制地点</button>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderRoutePlan(day) {
      if (!day.routePlan) return "";
      const plan = day.routePlan;
      return `
        <article class="route-plan">
          <div class="route-plan-head">
            <div>
              <h3>${icon("bike", "icon-sm")} ${esc(plan.title)}</h3>
              <p>${esc(plan.subtitle)}</p>
            </div>
            <button class="btn btn-small btn-primary" onclick="openMapsUrl('${escAttr(plan.googleMapsUrl)}')">${icon("map-pin", "icon-sm")} 打开西线路线</button>
          </div>
          <div class="route-metrics">
            ${plan.metrics.map(([value, label]) => `<div class="route-metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`).join("")}
          </div>
          <div class="route-stop-grid">
            ${plan.stops.map(([name, tag], index) => `
              <div class="route-stop-pill"><b>${index + 1}</b><span><strong>${esc(name)}</strong><br>${esc(tag)}</span></div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function renderFoodTab(day) {
      const foods = day.food || [];
      return `
        <div class="panel-head"><div><h2>当天美食</h2><p class="rail-muted">餐饮点保留弹性，按体力和排队情况微调。</p></div></div>
        ${foods.length ? `
          <div class="food-grid">
            ${foods.map(food => `<div class="mini-card"><h3>${icon("utensils", "icon-sm")} ${esc(food)}</h3><p>可根据当日体力和现场排队情况微调。</p></div>`).join("")}
          </div>
        ` : `<div class="empty-state"><h2 class="serif">临场选择</h2><p>当天暂无固定餐厅，建议根据酒店位置、体力和天气临场选择。</p></div>`}
      `;
    }

    function renderRemindersTab(day) {
      const list = day.reminders || [];
      return `
        <div class="panel-head">
          <div><h2>当天提醒</h2><p class="rail-muted">当天需要提前确认或留意的事项。</p></div>
          <button class="btn btn-small" onclick="openDrawer('confirm')">${icon("circle-help", "icon-sm")} 打开待确认中心</button>
        </div>
        ${list.length ? `<div class="info-list">${list.map(text => `<div class="mini-card">${icon("bell", "icon-sm")} ${esc(text)}</div>`).join("")}</div>` : `<div class="empty-state"><h2 class="serif">No reminders</h2><p>当天暂无特殊提醒。</p></div>`}
      `;
    }

    function renderBudgetTab(day) {
      const userExpenses = appState.expenses[day.id] || [];
      return `
        <div class="panel-head">
          <div><h2>当日预算</h2><p class="rail-muted">自定义费用会保存在 localStorage。</p></div>
          <button class="btn btn-small btn-primary" onclick="openExpenseModal()">${icon("plus", "icon-sm")} 添加预算</button>
        </div>
        <div class="budget-grid">
          ${(day.budget || []).map(item => `<div class="mini-card"><h3>${esc(item.label)}</h3><p>${esc(item.category)} · ${esc(item.amount)}</p></div>`).join("")}
          ${!day.budget?.length ? `<div class="mini-card"><h3>暂无固定预算</h3><p>可以手动添加当天费用。</p></div>` : ""}
        </div>
        <div class="soft-card info-card" style="margin-top:14px;">
          <h3>自定义费用</h3>
          ${userExpenses.length ? userExpenses.map(exp => `
            <div class="expense-row">
              <div><strong>${esc(exp.label)}</strong><br><span class="rail-muted">${esc(exp.currency)}</span></div>
              <div style="font-weight:900;">${esc(exp.amount)}</div>
              <button class="action-btn" onclick="deleteExpense('${day.id}','${exp.id}')">${icon("trash-2", "icon-sm")} 删除</button>
            </div>
          `).join("") : `<p class="rail-muted">还没有添加费用。</p>`}
        </div>
      `;
    }

    function renderNotesTab(day) {
      const note = appState.dayNotes[day.id] || "";
      return `
        <div class="panel-head"><div><h2>当日备注</h2><p class="rail-muted">像旅行手帐一样写下当天想法，自动保存到本机。</p></div></div>
        <textarea class="note-paper" placeholder="写下今天的备注、灵感、临时调整..." oninput="saveDayNote('${day.id}', this.value)">${esc(note)}</textarea>
      `;
    }

    function renderTaipeiEmptyState(context) {
      return `
        <div class="empty-state">
          ${icon("sparkles", "icon")}
          <h2 class="serif">台北段待规划</h2>
          <p>台北段保持开放，适合根据高雄和墾丁后的体力，再决定城市夜景、购物夜市或半日线。</p>
          <div class="suggest-grid" style="margin:18px 0;">
            ${tripData.taipeiSuggestions.map(item => `<div class="mini-card"><h3>${esc(item)}</h3><p>建议方向，可后续展开成半日或整日路线。</p></div>`).join("")}
          </div>
          <button class="btn btn-primary" onclick="openAIModal()">${icon("wand-sparkles", "icon-sm")} 生成台北行程</button>
        </div>
      `;
    }

    function renderDrawer() {
      if (!appState.drawer) return "";
      if (appState.drawer === "checklist") return renderDrawerShell("打卡清单", renderChecklistDrawer());
      if (appState.drawer === "confirm") return renderDrawerShell("待确认中心", renderConfirmDrawer());
      if (appState.drawer === "settings") return renderDrawerShell("设置", renderSettingsDrawer());
      return "";
    }

    function renderDrawerShell(title, content) {
      return `
        <div class="overlay" onclick="closeDrawer(event)">
          <aside class="drawer" onclick="event.stopPropagation()">
            <div class="drawer-head">
              <h2 class="serif">${esc(title)}</h2>
              <button class="btn btn-icon" onclick="setState({drawer:null})">${icon("x", "icon-sm")}</button>
            </div>
            ${content}
          </aside>
        </div>
      `;
    }

    function renderChecklistDrawer() {
      return Object.entries(tripData.checklist).map(([group, items]) => `
        <div class="check-group">
          <h3>${esc(group)}</h3>
          ${items.map(name => {
            const id = `check-${group}-${name}`;
            return `
              <label class="check-item">
                <input type="checkbox" ${appState.checklistStatus[id] ? "checked" : ""} onchange="toggleChecklist('${escAttr(id)}')" />
                <span>${esc(name)}</span>
              </label>
            `;
          }).join("")}
        </div>
      `).join("");
    }

    function renderConfirmDrawer() {
      return `
        <p class="rail-muted" style="margin-top:0;">这些事项不默认铺在页面上，需要时从中心打开。</p>
        <div class="check-group">
          ${tripData.globalConfirmations.map(name => {
            const id = `confirm-${name}`;
            return `
              <label class="check-item">
                <input type="checkbox" ${appState.confirmStatus[id] ? "checked" : ""} onchange="toggleConfirm('${escAttr(id)}')" />
                <span>${esc(name)}</span>
              </label>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderSettingsDrawer() {
      return `
        <div class="info-list">
          <div class="mini-card"><h3>本地状态</h3><p>当前攻略、城市、日期、打卡、收藏、备注和预算都保存在 localStorage key：<strong>${STORAGE_KEY}</strong></p></div>
          <button class="btn btn-danger" onclick="resetLocalData()">${icon("rotate-ccw", "icon-sm")} 重置本地数据</button>
          <button class="btn" onclick="goJourneySelect()">${icon("map", "icon-sm")} 返回攻略选择</button>
        </div>
      `;
    }

    function renderModal() {
      if (!appState.modal) return "";
      const modal = appState.modal;
      if (modal.type === "ai") {
        return `
          <div class="modal-wrap" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()">
              <h2 class="serif">AI Planning Demo</h2>
              <p class="rail-muted">这里可以接入 AI 规划，当前为前端演示。</p>
              <div style="display:flex;justify-content:flex-end;margin-top:18px;"><button class="btn btn-primary" onclick="setState({modal:null})">知道了</button></div>
            </div>
          </div>
        `;
      }
      if (modal.type === "item-note") {
        const note = appState.itemNotes[modal.itemId] || "";
        const item = allTimelineItems().find(i => i.id === modal.itemId);
        return `
          <div class="modal-wrap" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()">
              <h2 class="serif">行程备注</h2>
              <p class="rail-muted">${esc(item?.title || "当前行程")}</p>
              <div class="field">
                <label>备注</label>
                <textarea id="item-note-input" placeholder="写下这项行程的临时想法...">${esc(note)}</textarea>
              </div>
              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
                <button class="btn" onclick="setState({modal:null})">取消</button>
                <button class="btn btn-primary" onclick="saveItemNote('${modal.itemId}')">保存</button>
              </div>
            </div>
          </div>
        `;
      }
      if (modal.type === "expense") {
        return `
          <div class="modal-wrap" onclick="closeModal(event)">
            <div class="modal" onclick="event.stopPropagation()">
              <h2 class="serif">添加预算</h2>
              <p class="rail-muted">费用只会保存到本机 localStorage。</p>
              <div class="field"><label>项目</label><input id="expense-label" placeholder="例如：晚饭 / 打车 / 门票" /></div>
              <div class="field"><label>金额</label><input id="expense-amount" placeholder="例如：350" inputmode="decimal" /></div>
              <div class="field"><label>币种</label><select id="expense-currency"><option>NTD</option><option>HKD</option><option>RMB</option></select></div>
              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
                <button class="btn" onclick="setState({modal:null})">取消</button>
                <button class="btn btn-primary" onclick="saveExpense()">添加</button>
              </div>
            </div>
          </div>
        `;
      }
      return "";
    }

    function renderMobileNav() {
      if (appState.currentView === "journey-select") return "";
      return `
        <nav class="mobile-nav">
          <button class="${appState.currentView === "trip-dashboard" ? "active" : ""}" onclick="goDashboard()">${icon("layout-dashboard", "icon-sm")}<span>总览</span></button>
          <button class="${appState.currentView === "city" ? "active" : ""}" onclick="mobileGoCity()">${icon("building-2", "icon-sm")}<span>城市</span></button>
          <button class="${appState.currentView === "day" ? "active" : ""}" onclick="mobileGoDay()">${icon("calendar-days", "icon-sm")}<span>日期</span></button>
          <button onclick="openDrawer('checklist')">${icon("check-square", "icon-sm")}<span>清单</span></button>
          <button onclick="openDrawer('settings')">${icon("settings", "icon-sm")}<span>设置</span></button>
        </nav>
      `;
    }

    function countdownText() {
      const now = new Date();
      const start = new Date(tripData.startDate);
      const end = new Date(tripData.endDate);
      if (now < start) {
        const daysLeft = Math.ceil((start - now) / 86400000);
        return `${daysLeft} days`;
      }
      if (now <= end) return "On trip";
      return "Completed";
    }

    function enterTrip() {
      setState({ currentView: "trip-dashboard", selectedTrip: tripData.id, selectedCity: null, selectedDay: null, selectedTab: "timeline" });
    }
    function goJourneySelect() { setState({ currentView: "journey-select", drawer: null }); }
    function goDashboard() { setState({ currentView: "trip-dashboard", selectedTrip: tripData.id, selectedDay: null, selectedTab: "timeline", drawer: null }); }
    function selectCity(cityId) { setState({ currentView: "city", selectedTrip: tripData.id, selectedCity: cityId, selectedDay: null, selectedTab: "timeline", searchQuery: "", typeFilter: "all", drawer: null }); }
    function selectDay(dayId, cityContext) {
      const day = tripData.daysById[dayId];
      const cityId = cityContext && tripData.cities[cityContext] ? cityContext : (day?.cityId || appState.selectedCity);
      setState({ currentView: "day", selectedTrip: tripData.id, selectedCity: cityId, selectedDay: dayId, selectedTab: "timeline", searchQuery: "", typeFilter: "all", drawer: null });
    }
    function backToCity() { setState({ currentView: "city", selectedDay: null, selectedTab: "timeline", searchQuery: "", typeFilter: "all" }); }
    function setTab(tab) { setState({ selectedTab: tab, searchQuery: "", typeFilter: "all" }); }
    function updateSearch(value) { setState({ searchQuery: value }, true); }
    function setTypeFilter(type) { setState({ typeFilter: type }); }
    function clearFilters() { setState({ searchQuery: "", typeFilter: "all" }); }
    function openDrawer(name) { setState({ drawer: name }); }
    function closeDrawer(event) { if (event.target.classList.contains("overlay")) setState({ drawer: null }); }
    function openAIModal() { setState({ modal: { type: "ai" } }); }
    function openItemNote(itemId) { setState({ modal: { type: "item-note", itemId } }); }
    function openExpenseModal() { setState({ modal: { type: "expense" } }); }
    function closeModal(event) { if (event.target.classList.contains("modal-wrap")) setState({ modal: null }); }

    function toggleComplete(itemId) {
      const completedItems = { ...appState.completedItems, [itemId]: !appState.completedItems[itemId] };
      setState({ completedItems });
    }
    function toggleFavorite(itemId) {
      const favoriteItems = { ...appState.favoriteItems, [itemId]: !appState.favoriteItems[itemId] };
      setState({ favoriteItems });
    }
    function toggleChecklist(id) {
      const checklistStatus = { ...appState.checklistStatus, [id]: !appState.checklistStatus[id] };
      setState({ checklistStatus });
    }
    function toggleConfirm(id) {
      const confirmStatus = { ...appState.confirmStatus, [id]: !appState.confirmStatus[id] };
      setState({ confirmStatus });
    }
    function saveItemNote(itemId) {
      const input = document.getElementById("item-note-input");
      const itemNotes = { ...appState.itemNotes, [itemId]: input.value.trim() };
      setState({ itemNotes, modal: null });
      toast("行程备注已保存");
    }
    function saveDayNote(dayId, value) {
      const dayNotes = { ...appState.dayNotes, [dayId]: value };
      setState({ dayNotes }, false);
    }
    function saveExpense() {
      const day = selectedDay();
      if (!day) return;
      const label = document.getElementById("expense-label").value.trim();
      const amount = document.getElementById("expense-amount").value.trim();
      const currency = document.getElementById("expense-currency").value;
      if (!label || !amount) {
        toast("请填写预算项目和金额");
        return;
      }
      const expenses = { ...appState.expenses };
      expenses[day.id] = [...(expenses[day.id] || []), { id: `exp-${Date.now()}`, label, amount, currency }];
      setState({ expenses, modal: null });
      toast("预算已添加");
    }
    function deleteExpense(dayId, expenseId) {
      const expenses = { ...appState.expenses, [dayId]: (appState.expenses[dayId] || []).filter(exp => exp.id !== expenseId) };
      setState({ expenses });
    }
    function openMaps(query) {
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, "_blank", "noopener,noreferrer");
    }
    function openMapsUrl(url) {
      window.open(url, "_blank", "noopener,noreferrer");
    }
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        toast("已复制");
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        document.body.removeChild(textarea);
        toast(copied ? "已复制" : "复制失败，请手动复制");
      }
    }
    async function copyDayPlan() {
      const day = selectedDay();
      if (!day) return;
      const lines = [
        `${day.label} · ${day.date} · ${day.cityName}`,
        `今日重点：${day.focus}`,
        ...day.timeline.map(item => `${item.time} ${item.title}`)
      ];
      await copyText(lines.join("\\n"));
    }
    async function copyTripSummary() {
      await copyText(`${tripData.title}\\n${tripData.range}\\n路线：${tripData.route.join(" → ")}`);
    }
    function toast(message) {
      appState.toast = message;
      render();
      window.clearTimeout(window.__toastTimer);
      window.__toastTimer = window.setTimeout(() => {
        appState.toast = "";
        render();
      }, 1800);
    }
    function resetLocalData() {
      if (!confirm("确定要重置本地保存的状态、备注、预算和清单吗？")) return;
      localStorage.removeItem(STORAGE_KEY);
      appState = { ...defaultState, currentView: "journey-select" };
      render();
    }
    function mobileGoCity() {
      if (appState.selectedCity) setState({ currentView: "city", selectedDay: null });
      else goDashboard();
    }
    function mobileGoDay() {
      if (appState.selectedDay) setState({ currentView: "day" });
      else if (appState.selectedCity) setState({ currentView: "city" });
      else goDashboard();
    }

    window.enterTrip = enterTrip;
    window.goJourneySelect = goJourneySelect;
    window.goDashboard = goDashboard;
    window.selectCity = selectCity;
    window.selectDay = selectDay;
    window.backToCity = backToCity;
    window.setTab = setTab;
    window.updateSearch = updateSearch;
    window.setTypeFilter = setTypeFilter;
    window.clearFilters = clearFilters;
    window.openDrawer = openDrawer;
    window.closeDrawer = closeDrawer;
    window.openAIModal = openAIModal;
    window.openItemNote = openItemNote;
    window.openExpenseModal = openExpenseModal;
    window.closeModal = closeModal;
    window.toggleComplete = toggleComplete;
    window.toggleFavorite = toggleFavorite;
    window.toggleChecklist = toggleChecklist;
    window.toggleConfirm = toggleConfirm;
    window.saveItemNote = saveItemNote;
    window.saveDayNote = saveDayNote;
    window.saveExpense = saveExpense;
    window.deleteExpense = deleteExpense;
    window.openMaps = openMaps;
    window.openMapsUrl = openMapsUrl;
    window.copyText = copyText;
    window.copyDayPlan = copyDayPlan;
    window.copyTripSummary = copyTripSummary;
    window.resetLocalData = resetLocalData;
    window.mobileGoCity = mobileGoCity;
    window.mobileGoDay = mobileGoDay;

    render();
  </script>
</body>
</html>
