<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台湾旅行 2026 · 路线手帐</title>
  <meta name="description" content="高雄、墾丁、台北 9 天 8 夜的台湾旅行路线、地图与每日行程手帐。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --cream: #FFF8EA;
      --paper: #FFFDF6;
      --ink: #17324D;
      --muted: #6C7B8A;
      --ocean: #1CA7EC;
      --teal: #00BFA6;
      --coral: #FF6B5A;
      --mango: #FFD166;
      --palm: #6BCB77;
      --kaohsiung-main: #1CA7EC;
      --kaohsiung-accent: #FF8A3D;
      --kenting-main: #00BFA6;
      --kenting-accent: #FFD166;
      --taipei-main: #3577FF;
      --taipei-accent: #FF4D66;
      --navy: var(--ink);
      --navy-2: #245174;
      --ivory: var(--cream);
      --sand: #FFE7BD;
      --sand-2: #FFF1D0;
      --orange: var(--coral);
      --orange-2: #FF9D5C;
      --sage: var(--palm);
      --sage-2: #E6F9DD;
      --line: rgba(23, 50, 77, 0.12);
      --glass: rgba(255, 253, 246, 0.72);
      --shadow: 0 26px 70px rgba(50, 95, 129, 0.16);
      --shadow-soft: 0 16px 38px rgba(72, 98, 120, 0.11);
      --radius-lg: 32px;
      --radius: 24px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --font-title: "Noto Serif TC", "Noto Serif SC", serif;
      --font-display: "Newsreader", "Noto Serif TC", "Noto Serif SC", serif;
      --font-body: "Noto Sans TC", "Noto Sans SC", system-ui, sans-serif;
      --font-label: "Manrope", "Noto Sans TC", "Noto Sans SC", system-ui, sans-serif;
      --font-note: "Noto Serif TC", "Noto Serif SC", serif;
      --font-serif: var(--font-title);
      --font-sans: var(--font-body);
      --font-mono: var(--font-label);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--ink);
      background:
        linear-gradient(140deg, rgba(16,34,53,.06), transparent 32%),
        linear-gradient(0deg, var(--ivory), #f7efe5 100%);
      letter-spacing: 0;
    }

    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    .hidden { display: none !important; }
    .serif { font-family: var(--font-serif); }
    .icon { width: 18px; height: 18px; stroke-width: 1.9; }
    .icon-sm { width: 15px; height: 15px; stroke-width: 2; }

    .app-root { min-height: 100vh; }
    .cloud-sync-banner {
      position: sticky;
      top: 0;
      z-index: 1200;
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      background: #17324D;
      color: #FFFDF6;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 10px 24px rgba(16,34,53,.16);
    }
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: clamp(28px, 7vw, 72px) 18px;
      background: linear-gradient(135deg, #FFF8EA 0%, #f0e8d8 100%);
    }
    .auth-wrap {
      width: min(470px, 100%);
      display: grid;
      gap: 18px;
    }
    .auth-intro,
    .auth-card {
      padding: clamp(22px, 5vw, 34px);
    }
    .auth-intro {
      padding-bottom: 4px;
      text-align: center;
    }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--ink);
    }
    .auth-brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--ocean), var(--teal));
      box-shadow: 0 14px 28px rgba(28,167,236,.22);
    }
    .auth-title {
      margin: 0;
      font-size: clamp(32px, 9vw, 46px);
      line-height: 1;
    }
    .auth-copy {
      color: var(--muted);
      line-height: 1.65;
      margin: 12px auto 0;
      font-size: 15px;
      max-width: 340px;
    }
    .auth-card {
      border-radius: 30px;
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(16,34,53,.06);
      margin: 20px 0 18px;
    }
    .auth-tab {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 900;
    }
    .auth-tab.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 8px 18px rgba(16,34,53,.08);
    }
    .auth-form {
      display: grid;
      gap: 14px;
    }
    .auth-text-btn {
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--ocean);
      cursor: pointer;
      font-weight: 900;
      justify-self: center;
      padding: 4px 10px;
    }
    .auth-text-btn:disabled {
      color: var(--muted);
      cursor: not-allowed;
      opacity: .62;
    }
    .otp-panel {
      display: grid;
      gap: 16px;
      text-align: center;
    }
    .otp-panel h2 {
      margin: 0;
    }
    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .otp-inputs input {
      width: 48px;
      height: 56px;
      border-radius: 12px;
      border: 2px solid rgba(23,50,77,.15);
      background: #fff;
      text-align: center;
      color: var(--ink);
      font-size: 24px;
      font-weight: 900;
      outline: none;
      line-height: 1;
      transition: border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
    }
    .otp-inputs input:focus {
      border-color: var(--ocean);
      box-shadow: 0 0 0 4px rgba(28,167,236,.12);
      transform: translateY(-1px);
    }
    .otp-resend-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .auth-alert {
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      font-weight: 750;
    }
    .auth-alert.error {
      background: #fff1ec;
      color: #9f3d2f;
      border: 1px solid rgba(159,61,47,.14);
    }
    .auth-alert.success {
      background: var(--sage-2);
      color: #456d4b;
      border: 1px solid rgba(80,130,85,.14);
    }
    .auth-footnote {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .platform-page {
      min-height: 100vh;
      padding: clamp(24px, 5vw, 58px) 18px;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 209, 102, .34), transparent 26%),
        radial-gradient(circle at 88% 14%, rgba(0, 191, 166, .18), transparent 30%),
        linear-gradient(140deg, rgba(255,253,246,.96), rgba(255,248,234,.9));
    }
    .platform-wrap {
      width: min(940px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }
    .platform-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .platform-head h1 {
      margin: 8px 0 8px;
      font-size: clamp(34px, 6vw, 62px);
      line-height: .98;
    }
    .platform-head p,
    .platform-empty p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }
    .trip-list-grid {
      display: grid;
      gap: 12px;
    }
    .trip-select-card {
      width: 100%;
      min-height: 116px;
      border: 1px solid rgba(16,34,53,.08);
      border-radius: 24px;
      background: rgba(255,253,248,.86);
      box-shadow: var(--shadow-soft);
      padding: 18px;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      text-align: left;
      color: var(--ink);
      cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
    }
    .trip-select-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: rgba(28,167,236,.22);
    }
    .trip-cover-emoji {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #FFF6DF, rgba(0,191,166,.12));
      font-size: 48px;
      line-height: 1;
    }
    .trip-card-body {
      min-width: 0;
      display: grid;
      gap: 8px;
    }
    .trip-card-body strong {
      font-size: 18px;
      font-weight: 900;
    }
    .trip-card-body span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .trip-role-chip {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 900;
      background: rgba(28,167,236,.12);
      color: #245174;
    }
    .trip-role-chip.owner {
      background: rgba(255,209,102,.26);
      color: #735B24;
    }
    .trip-role-chip.viewer {
      background: rgba(23,50,77,.08);
      color: var(--muted);
    }
    .trip-arrow {
      color: var(--muted);
    }
    .platform-empty {
      min-height: min(620px, calc(100vh - 80px));
      display: grid;
      place-items: center;
      text-align: center;
    }
    .platform-empty-card {
      width: min(560px, 100%);
      padding: clamp(28px, 5vw, 46px);
      border-radius: 30px;
      background: rgba(255,253,248,.86);
      border: 1px solid rgba(16,34,53,.08);
      box-shadow: var(--shadow-soft);
    }
    .platform-empty-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
    }
    .platform-empty h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 48px);
    }
    .platform-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .trip-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .trip-switch-btn {
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 11px;
      box-shadow: none;
    }
    .user-session {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .user-email-chip {
      max-width: 170px;
      border: 1px solid rgba(16,34,53,.1);
      border-radius: 999px;
      padding: 8px 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,253,248,.62);
      color: var(--ink);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
    }
    .user-email-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .journey-auth-bar {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 2;
    }
    .journey-auth-bar .user-email-chip {
      background: rgba(255,255,255,.12);
      color: #fff;
      border-color: rgba(255,255,255,.18);
      backdrop-filter: blur(18px);
    }
    .journey-auth-bar .btn-ghost {
      color: #fff;
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.1);
    }
    .btn {
      border: 1px solid rgba(16,34,53,.1);
      background: var(--paper);
      color: var(--ink);
      min-height: 44px;
      border-radius: 999px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(16,34,53,.06);
      transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); border-color: rgba(16,34,53,.16); }
    .btn:active { transform: translateY(0); }
    .btn:disabled,
    .action-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-primary {
      background: var(--navy);
      color: #fff;
      border-color: rgba(255,255,255,.08);
      box-shadow: 0 16px 36px rgba(16,34,53,.22);
    }
    .btn-primary:hover { background: var(--navy-2); }
    .btn-ghost {
      background: rgba(255,253,248,.58);
      box-shadow: none;
      backdrop-filter: blur(16px);
    }
    .btn-danger { color: #9f3d2f; border-color: rgba(159,61,47,.18); background: #fff8f4; }
    .btn-small { min-height: 44px; padding: 0 13px; font-size: 13px; }
    .btn-icon { width: 44px; min-height: 44px; padding: 0; border-radius: 15px; }
    .google-map-btn {
      color: var(--teal);
      border-color: rgba(0,191,166,.28);
      background: rgba(0,191,166,.08);
      box-shadow: none;
    }
    .google-route-row,
    .map-export-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .google-route-row {
      justify-content: space-between;
      padding: 10px 4px 0;
    }
    .map-export-steps {
      flex-direction: column;
      align-items: flex-start;
      margin-top: 12px;
    }

    .chip {
      border: 1px solid rgba(16,34,53,.08);
      border-radius: 999px;
      padding: 7px 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,253,248,.64);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .tag { display: inline-flex; padding: 6px 10px; border-radius: 999px; background: var(--sand-2); color: #6f5a40; font-size: 11px; font-weight: 800; }
    .tag.sage { background: var(--sage-2); color: #536c55; }
    .tag.orange { background: #fbe8db; color: #9a4b29; }
    .tag.dark { background: rgba(16,34,53,.08); color: var(--navy); }

    .card {
      background: rgba(255,253,248,.84);
      border: 1px solid rgba(16,34,53,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
    }
    .soft-card {
      background: rgba(255,253,248,.64);
      border: 1px solid rgba(16,34,53,.08);
      border-radius: var(--radius);
    }

    /* Taiwan boarding page */
    .journey-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        linear-gradient(120deg, rgba(16,34,53,.94), rgba(20,53,78,.86)),
        linear-gradient(0deg, #102235, #102235);
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .journey-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent);
      pointer-events: none;
    }
    .journey-wrap {
      width: min(1120px, 100%);
      position: relative;
      z-index: 1;
    }
    .journey-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(20px);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: none;
    }
    .journey-title {
      margin: 24px 0 10px;
      font-size: clamp(42px, 8vw, 96px);
      line-height: .92;
      letter-spacing: 0;
    }
    .journey-subtitle { margin: 0 0 34px; color: rgba(255,255,255,.66); font-size: clamp(16px, 2vw, 22px); }
    .journey-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr);
      gap: 22px;
      align-items: stretch;
    }
    .hero-trip-card {
      border-radius: 34px;
      padding: clamp(24px, 4vw, 42px);
      background:
        linear-gradient(145deg, rgba(255,253,248,.94), rgba(244,232,214,.86));
      color: var(--ink);
      min-height: 470px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 34px 90px rgba(0,0,0,.26);
      border: 1px solid rgba(255,255,255,.28);
    }
    .trip-card-top { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
    .trip-label { color: var(--orange); font-size: 12px; font-weight: 900; letter-spacing: 0; text-transform: none; }
    .hero-trip-card h2 { margin: 12px 0 12px; font-size: clamp(34px, 5vw, 62px); line-height: .96; }
    .trip-card-meta { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .trip-route-card {
      border-radius: 26px;
      padding: 18px;
      background: rgba(16,34,53,.06);
      border: 1px solid rgba(16,34,53,.08);
    }
    .trip-route-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--navy); font-size: 13px; font-weight: 800; }
    /* App shell */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 42px);
      background: rgba(251,247,239,.78);
      border-bottom: 1px solid rgba(16,34,53,.08);
      backdrop-filter: blur(24px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: #fff;
      box-shadow: 0 12px 28px rgba(16,34,53,.22);
    }
    .brand-title { display: grid; gap: 1px; min-width: 0; }
    .brand-title strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-title span { color: var(--muted); font-size: 12px; font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .app-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 300px;
      gap: 20px;
      padding: 22px clamp(16px, 4vw, 38px) 92px;
      max-width: 1480px;
      margin: 0 auto;
    }
    .side-nav, .right-rail {
      position: sticky;
      top: 92px;
      align-self: start;
      max-height: calc(100vh - 110px);
      overflow: auto;
    }
    .side-nav { padding: 16px; }
    .side-title { color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: 0; text-transform: none; margin: 4px 8px 10px; }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      border-radius: 16px;
      min-height: 44px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
    }
    .nav-btn:hover { background: rgba(16,34,53,.05); }
    .nav-btn.active { background: var(--navy); color: #fff; }
    .nav-btn small { margin-left: auto; color: inherit; opacity: .62; font-weight: 800; }
    .side-divider { height: 1px; background: var(--line); margin: 14px 4px; }
    .main-stage { min-width: 0; display: grid; gap: 18px; }
    .right-rail { display: grid; gap: 14px; }
    .rail-card { padding: 18px; }
    .rail-card h3 { margin: 0 0 12px; font-size: 14px; }

    .progress-bar div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--orange-2), var(--sage)); }
    .route-visual {

      font-size: 13px;

    .route-arrow { color: rgba(255,255,255,.48); }
    .flight-strip {

      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .flight-strip .mini-card {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.14);
      color: #fff;
      backdrop-filter: blur(16px);
    }
    .flight-strip .mini-card h3 { color: #fff; }
    .flight-strip .mini-card p { color: rgba(255,255,255,.7); }
    .section-head {

      justify-content: space-between;

      margin-top: 4px;

    .section-head h2 { margin: 0; font-size: 24px; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .city-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .city-card {

      text-align: left;

    .city-card .city-date { color: var(--muted); font-size: 13px; font-weight: 800; }
    .city-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    .status-line { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 18px; color: var(--muted); font-size: 12px; font-weight: 800; }

    /* City/day pages */
    .page-hero {

    .timeline-body h3 { margin: 0 0 7px; font-size: 16px; display: flex; align-items: center; gap: 8px; }

    .day-inline-panel {

    .add-itinerary-row {

    .action-btn {

    .item-note { margin-top: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(232,218,196,.36); color: #5f5146; font-size: 12px; line-height: 1.55; }

    .route-panel { display: grid; gap: 12px; }

    .mini-card { padding: 15px; border-radius: 20px; background: rgba(255,253,248,.72); border: 1px solid rgba(16,34,53,.08); }

    /* Drawers and modals */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(16,34,53,.28);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: flex-end;
    }
    .drawer {
      width: min(480px, 100%);
      height: 100%;
      background: var(--paper);
      box-shadow: -30px 0 80px rgba(16,34,53,.24);
      padding: 22px;
      overflow: auto;
      animation: slideIn .24s var(--ease);
    }
    @keyframes slideIn { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .drawer-head h2 { margin: 0; font-size: 24px; }
    .check-group { margin-bottom: 18px; }
    .check-group h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(16,34,53,.08);
      background: rgba(251,247,239,.6);
      margin-bottom: 8px;
      cursor: pointer;
    }
    .check-item input { accent-color: var(--navy); width: 18px; height: 18px; }
    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      background: rgba(16,34,53,.34);
      backdrop-filter: blur(10px);
      padding: 18px;
    }
    .modal {
      width: min(540px, 100%);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid rgba(255,255,255,.7);
      animation: popIn .2s var(--ease);
    }
    @keyframes popIn { from { transform: translateY(8px) scale(.98); opacity: .55; } to { transform: none; opacity: 1; } }
    .modal h2 { margin: 0 0 8px; }
    .map-modal-wrap { padding: 14px; }
    .map-modal {
      width: auto;
      max-width: none;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .field { display: grid; gap: 7px; margin-top: 14px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 850; }
    .field input, .field textarea, .field select {
      border: 1px solid rgba(16,34,53,.1);
      background: #fff;
      border-radius: 16px;
      padding: 12px 14px;
      min-height: 44px;
      outline: none;
      color: var(--ink);
    }
    .field textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
    .btn[disabled],
    .action-btn[disabled],
    .check-item.disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }
    .auth-row,
    .invite-link-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }
    .auth-row input,
    .invite-link-row input,
    .role-select {
      min-width: 0;
      flex: 1;
      border: 1px solid rgba(16,34,53,.1);
      background: #fff;
      border-radius: 16px;
      padding: 11px 13px;
      color: var(--ink);
      outline: none;
    }
    .collab-card {
      display: grid;
      gap: 12px;
    }
    .collab-card h3,
    .member-card h3 {
      margin: 0;
    }
    .collab-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .member-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .member-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 11px 12px;
      border-radius: 16px;
      border: 1px solid rgba(16,34,53,.08);
      background: rgba(255,253,248,.66);
      font-size: 13px;
    }
    .member-row strong {
      overflow-wrap: anywhere;
    }
    .readonly-note {
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px dashed rgba(23,50,77,.18);
      background: rgba(255,248,234,.74);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .readonly-note strong {
      color: var(--ink);
    }
    .readonly-value {
      min-height: 120px;
      white-space: pre-wrap;
      line-height: 1.65;
    }
    .role-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(23,50,77,.08);
      color: var(--ink);
      font-size: 11px;
      font-weight: 850;
    }
    .role-pill.viewer {
      background: rgba(255,107,90,.12);
      color: #9f3d2f;
    }
    .role-pill.editor {
      background: rgba(0,191,166,.13);
      color: #267263;
    }
    .toast {
      position: fixed;
      z-index: 90;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 12px 16px;
      background: var(--navy);
      color: #fff;
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 800;
    }

    .mobile-nav {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 35;
      display: none;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      padding: 7px;
      border-radius: 24px;
      background: rgba(255,253,248,.86);
      border: 1px solid rgba(16,34,53,.08);
      box-shadow: 0 18px 48px rgba(16,34,53,.18);
      backdrop-filter: blur(22px);
    }
    .mobile-nav button {
      border: 0;
      background: transparent;
      border-radius: 18px;
      min-height: 52px;
      display: grid;
      place-items: center;
      gap: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }
    .mobile-nav button.active { background: var(--navy); color: #fff; }
    .mobile-nav .mobile-fab {
      width: 56px;
      height: 56px;
      min-height: 56px;
      justify-self: center;
      align-self: center;
      border-radius: 999px;
      background: var(--ocean);
      color: #fff;
      transform: translateY(-8px);
      box-shadow: 0 18px 36px rgba(28,167,236,.42);
      z-index: 2;
    }
    .mobile-nav .mobile-fab .icon-sm {
      width: 24px;
      height: 24px;
      stroke-width: 2.6;
    }
    .mobile-nav .mobile-fab span {
      display: none;
    }
    .fab-sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: grid;
      align-items: end;
      padding: 0 14px 92px;
      background: rgba(23,50,77,.28);
      backdrop-filter: blur(8px);
      animation: overlayIn .2s var(--ease) both;
    }
    .fab-sheet {
      display: grid;
      gap: 10px;
      width: min(460px, 100%);
      margin: 0 auto;
      animation: sheetSlideUp .28s var(--bounce);
    }
    .fab-sheet-list {
      display: grid;
      gap: 2px;
      padding: 10px;
      border-radius: 26px;
      background: rgba(255,253,246,.96);
      box-shadow: 0 28px 70px rgba(23,50,77,.24);
      border: 1px solid rgba(255,255,255,.72);
    }
    .fab-sheet-item,
    .fab-sheet-cancel,
    .drawer-action {
      min-height: 48px;
      border: 0;
      background: transparent;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 18px;
      padding: 0 14px;
      font: inherit;
      font-weight: 850;
      text-align: left;
      cursor: pointer;
    }
    .fab-sheet-item:hover,
    .drawer-action:hover {
      background: rgba(28,167,236,.08);
    }
    .fab-sheet-icon,
    .drawer-action-icon {
      width: 26px;
      display: inline-grid;
      place-items: center;
      font-size: 18px;
      flex: 0 0 26px;
    }
    .fab-sheet-cancel {
      justify-content: center;
      background: rgba(255,253,246,.96);
      box-shadow: 0 12px 30px rgba(23,50,77,.16);
    }
    .more-drawer {
      display: grid;
      gap: 14px;
    }
    .drawer-section-title {
      margin: 8px 6px 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    .drawer-action {
      width: 100%;
      background: rgba(255,255,255,.66);
      border: 1px solid rgba(16,34,53,.08);
    }

    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 220px minmax(0, 1fr) minmax(240px, 270px); gap: 16px; }
      .city-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 1024px) {
      .app-shell { grid-template-columns: 220px minmax(0, 1fr); }
      .right-rail { display: none; }
      .inline-rail {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 820px) {
      .journey-grid { grid-template-columns: 1fr; }
      .hero-trip-card { min-height: 430px; }
      .topbar { height: 62px; padding: 0 14px; }
      .top-actions .btn:not(.keep-mobile):not(.home-mobile) { display: none; }
      .top-actions .home-mobile {
        display: inline-flex;
        width: 44px;
        min-width: 44px;
        padding: 0;
      }
      .top-actions .home-mobile span { display: none; }
      .top-actions .keep-mobile {
        width: 44px;
        min-width: 44px;
        padding: 0;
        font-size: 0;
        gap: 0;
      }
      .top-actions .keep-mobile .icon-sm {
        width: 18px;
        height: 18px;
      }
      .app-shell { grid-template-columns: 1fr; padding: 16px 14px 96px; }
      .side-nav { display: none; }
      .mobile-nav { display: grid; }
      .hero-row, .page-title-row, .day-title-grid { grid-template-columns: 1fr; display: grid; }
      .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hotel-grid, .food-grid, .budget-grid, .suggest-grid { grid-template-columns: 1fr; }
      .expense-summary-card,
      .expense-form-grid { grid-template-columns: 1fr; }
      .expense-hero-actions,
      .modal-actions,
      .settings-action-row { justify-content: stretch; }
      .expense-hero-actions .btn,
      .modal-actions .btn,
      .settings-action-row .btn { flex: 1 1 150px; }
      .expense-item {
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: start;
      }
      .expense-item .receipt-thumb,
      .expense-item .action-btn {
        grid-column: 2 / -1;
        width: fit-content;
      }
      .expense-amount-cell {
        grid-column: 2 / -1;
        text-align: left;
      }
      .route-metrics, .route-stop-grid { grid-template-columns: 1fr; }
      .timeline-item { grid-template-columns: 1fr; }
      .timeline-time { padding-top: 0; }
      .search-input { width: 100%; min-width: 0; }
    }

    /* Sunny Taiwan travel redesign */
    :root {
      --ocean: #1CA7EC;
      --teal: #00BFA6;
      --coral: #FF6B5A;
      --mango: #FFD166;
      --palm: #6BCB77;
      --cream: #FFF8EA;
      --ink-navy: #17324D;
      --paper-white: #FFFDF6;
      --sand-warm: #FFE7BD;
      --sky-soft: #DDF5FF;
      --rose-soft: #FFE7E1;
      --mint-soft: #E2FFF8;
      --night-red: #FF4D66;
      --city-blue: #3577FF;
      --kaohsiung-main: #1CA7EC;
      --kaohsiung-accent: #FF8A3D;
      --kenting-main: #00BFA6;
      --kenting-accent: #FFD166;
      --taipei-main: #3577FF;
      --taipei-accent: #FF4D66;
      --accent: var(--ocean);
      --accent-2: var(--teal);
      --accent-3: var(--coral);
      --wash: rgba(28, 167, 236, .12);
      --navy: var(--ink-navy);
      --navy-2: #245174;
      --ivory: var(--cream);
      --paper: var(--paper-white);
      --sand: var(--sand-warm);
      --sand-2: #FFF1D0;
      --orange: var(--coral);
      --orange-2: #FF9D5C;
      --sage: var(--palm);
      --sage-2: #E6F9DD;
      --ink: var(--ink-navy);
      --muted: #68788B;
      --line: rgba(23, 50, 77, .12);
      --shadow: 0 26px 70px rgba(50, 95, 129, .18);
      --shadow-soft: 0 16px 38px rgba(72, 98, 120, .12);
      --radius-lg: 32px;
      --radius: 24px;
      --ease: cubic-bezier(.19, 1, .22, 1);
      --bounce: cubic-bezier(.34, 1.56, .64, 1);
      --font-title: "Noto Serif TC", "Noto Serif SC", serif;
      --font-display: "Newsreader", "Noto Serif TC", "Noto Serif SC", serif;
      --font-body: "Noto Sans TC", "Noto Sans SC", system-ui, sans-serif;
      --font-label: "Manrope", "Noto Sans TC", "Noto Sans SC", system-ui, sans-serif;
      --font-note: "Noto Serif TC", "Noto Serif SC", serif;
      --font-serif: var(--font-title);
      --font-sans: var(--font-body);
      --font-mono: var(--font-label);
    }

    body {
      font-family: var(--font-sans);
      color: var(--ink-navy);
      background-color: var(--cream);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(255, 209, 102, .34), transparent 26%),
        radial-gradient(circle at 88% 16%, rgba(28, 167, 236, .18), transparent 32%),
        radial-gradient(circle at 68% 78%, rgba(0, 191, 166, .16), transparent 30%),
        linear-gradient(115deg, rgba(255,255,255,.64), rgba(255,248,234,.78));
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .45;
      background-image:
        linear-gradient(90deg, rgba(23,50,77,.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23,50,77,.035) 1px, transparent 1px),
        radial-gradient(circle, rgba(23,50,77,.08) 1px, transparent 1.4px);
      background-size: 88px 88px, 88px 88px, 18px 18px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,.18));
    }

    .travel-app {
      min-height: 100vh;
      position: relative;
      --accent: var(--ocean);
      --accent-2: var(--teal);
      --accent-3: var(--coral);
      --wash: rgba(28, 167, 236, .13);
      animation: pageDrift .42s var(--ease) both;
    }
    .travel-app::before,
    .travel-app::after {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(1px);
      opacity: .55;
      animation: lazyFloat 9s ease-in-out infinite;
    }
    .journey-page::after,
    .journey-wrap::before,
    .journey-wrap::after,
    .hero-trip-card::before,
    .city-card::before,
    .city-card::after,
    .dashboard-hero::before,
    .dashboard-hero::after,
    .page-hero::before,
    .page-hero::after,
    .day-header::before,
    .day-header::after,
    .date-chip::after,
    .mobile-nav button.active::after {
      pointer-events: none;
    }
    .travel-app::before {
      width: 320px;
      height: 320px;
      right: -90px;
      top: 110px;
      background: radial-gradient(circle, rgba(255,209,102,.42), rgba(255,107,90,.1) 56%, transparent 70%);
    }
    .travel-app::after {
      width: 250px;
      height: 250px;
      left: -70px;
      bottom: 120px;
      background: radial-gradient(circle, rgba(0,191,166,.22), rgba(28,167,236,.12) 58%, transparent 72%);
      animation-delay: -3s;
    }
    .theme-trip { --accent: var(--ocean); --accent-2: var(--teal); --accent-3: var(--coral); --wash: rgba(28,167,236,.13); }
    .theme-kaohsiung { --accent: #1CA7EC; --accent-2: #FF8A3D; --accent-3: #FFD166; --wash: rgba(28,167,236,.16); }
    .theme-kenting { --accent: #00BFA6; --accent-2: #FFD166; --accent-3: #1CA7EC; --wash: rgba(0,191,166,.14); }
    .theme-taipei { --accent: #3577FF; --accent-2: #FF4D66; --accent-3: #FFD166; --wash: rgba(53,119,255,.13); }

    .serif,
    .journey-title,
    .hero-title,
    .page-title,
    .day-title-grid h1,
    .empty-state h2,
    .hero-trip-card h2,
    .city-card h3 {
      font-family: var(--font-serif);
      font-variation-settings: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    .chip,
    .tag,
    .timeline-time,
    .date-chip strong,
    .stat-tile span,
    .stat-tile strong,
    .route-metric strong,
    .route-metric span {
      font-family: var(--font-mono);
    }

    .card,
    .soft-card {
      background: rgba(255, 253, 246, .9);
      border: 1px solid rgba(255, 163, 90, .18);
      box-shadow: var(--shadow-soft);
      backdrop-filter: none;
    }
    .card {
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.46), transparent 36%),
        radial-gradient(circle at 0% 0%, var(--wash), transparent 38%);
      opacity: .76;
    }
    .card > * { position: relative; z-index: 1; }

    .btn {
      border: 0;
      background: #fff;
      color: var(--ink-navy);
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(23, 50, 77, .1), inset 0 -2px 0 rgba(23,50,77,.04);
      font-family: var(--font-mono);
      font-weight: 700;
      transition: transform .22s var(--bounce), box-shadow .22s var(--ease), background .22s var(--ease);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 36px rgba(23, 50, 77, .16);
    }
    .btn .icon-sm,
    .btn .icon {
      transition: transform .22s var(--bounce);
    }
    .btn:hover .icon-sm,
    .btn:hover .icon {
      transform: translateX(2px) rotate(-4deg);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2) 52%, var(--accent-3));
      color: #fff;
      box-shadow: 0 18px 38px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .btn-ghost {
      background: rgba(255, 253, 246, .76);
      border: 1px solid rgba(23,50,77,.08);
      backdrop-filter: none;
    }
    .btn-danger {
      background: #FFF0EA;
      color: #C23D36;
      border: 1px solid rgba(255,107,90,.24);
    }
    .chip {
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(23,50,77,.08);
      color: var(--ink-navy);
      box-shadow: 0 6px 14px rgba(23,50,77,.05);
    }
    .chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-color: transparent;
      animation: chipPop .26s var(--bounce);
    }
    .tag {
      background: rgba(255, 209, 102, .28);
      color: #876115;
      border: 1px solid rgba(255, 209, 102, .3);
    }
    .tag.sage {
      background: rgba(107, 203, 119, .18);
      color: #2D7B45;
      border-color: rgba(107, 203, 119, .28);
    }
    .tag.orange {
      background: rgba(255, 107, 90, .16);
      color: #B64332;
      border-color: rgba(255,107,90,.25);
    }
    .tag.dark {
      background: rgba(28, 167, 236, .12);
      color: #0A6EA1;
      border-color: rgba(28,167,236,.2);
    }

    .journey-page {
      color: var(--ink-navy);
      background:
        radial-gradient(circle at 8% 16%, rgba(255,209,102,.78), transparent 22%),
        radial-gradient(circle at 82% 18%, rgba(28,167,236,.44), transparent 30%),
        radial-gradient(circle at 68% 88%, rgba(0,191,166,.32), transparent 28%),
        linear-gradient(145deg, #FFF8EA 0%, #E8FAFF 48%, #FFF2D8 100%);
      overflow: hidden;
    }
    .journey-page::before {
      opacity: .5;
      background:
        linear-gradient(110deg, transparent 0 14%, rgba(28,167,236,.26) 14.2% 14.5%, transparent 14.8% 36%, rgba(255,107,90,.26) 36.2% 36.5%, transparent 36.8%),
        repeating-linear-gradient(135deg, rgba(23,50,77,.04) 0 1px, transparent 1px 22px);
      background-size: 120% 120%, 100% 100%;
      mask-image: none;
      animation: routeDraw 7s ease-in-out infinite alternate;
    }
    .journey-page::after {
      content: "";
      position: absolute;
      width: min(58vw, 720px);
      height: min(58vw, 720px);
      right: -16%;
      bottom: -26%;
      border-radius: 999px;
      background:
        radial-gradient(circle at 44% 42%, rgba(255,209,102,.72), rgba(255,209,102,.28) 36%, transparent 37%),
        conic-gradient(from 18deg, rgba(255,107,90,.22), rgba(0,191,166,.18), rgba(28,167,236,.14), rgba(255,107,90,.22));
      animation: lazyFloat 8s ease-in-out infinite;
    }
    .journey-wrap {
      animation: heroIn .74s var(--ease) both;
    }
    .journey-wrap::before,
    .journey-wrap::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: -1;
      border-radius: 28px;
      border: 2px solid rgba(255,107,90,.22);
      background: rgba(255,255,255,.42);
      box-shadow: 0 18px 40px rgba(23,50,77,.08);
      animation: lazyFloat 7s ease-in-out infinite;
    }
    .journey-wrap::before {
      width: 110px;
      height: 72px;
      right: 22%;
      top: 4%;
      transform: rotate(9deg);
    }
    .journey-wrap::after {
      width: 84px;
      height: 84px;
      left: 2%;
      bottom: 10%;
      border-radius: 999px;
      border-color: rgba(28,167,236,.2);
      animation-delay: -2.2s;
    }
    .journey-kicker {
      color: #0A6EA1;

      box-shadow: 0 22px 44px rgba(23,50,77,.08);
    }
    .note-paper {
      border: 1px solid rgba(255,209,102,.42);
      background:
        linear-gradient(90deg, rgba(255,107,90,.22) 0 2px, transparent 2px 100%),
        linear-gradient(rgba(255,255,255,0) 31px, rgba(28,167,236,.12) 32px),
        #FFF9E8;
      background-size: 100% 100%, 100% 32px, 100% 100%;
      box-shadow: 0 16px 34px rgba(23,50,77,.09), inset 0 0 0 10px rgba(255,255,255,.28);

    }

    .overlay {
      background: rgba(23, 50, 77, .24);

      animation: overlayIn .22s var(--ease) both;
    }
    .drawer {
      background:
        radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 28%),
        var(--cream);
      box-shadow: -26px 0 70px rgba(23,50,77,.2);
      animation: drawerTripIn .32s var(--bounce);
    }
    .drawer-head h2,
    .modal h2 {
      color: var(--ink-navy);
    }
    .check-item {
      background: rgba(255,255,255,.72);
      border-color: rgba(23,50,77,.08);
      transition: transform .18s var(--bounce), background .18s var(--ease);
    }
    .check-item:hover {
      transform: translateX(3px);
    }
    .check-item input {
      accent-color: var(--accent);
    }
    .modal {
      background: #FFFDF6;
      border: 1px solid rgba(255,209,102,.2);
      box-shadow: 0 28px 80px rgba(23,50,77,.2);
    }
    .field input,
    .field textarea,
    .field select {
      border-color: rgba(28,167,236,.16);
      background: #fff;
    }
    .toast {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 18px 38px color-mix(in srgb, var(--accent) 26%, transparent);
    }

    .mobile-nav {
      background: rgba(255,253,246,.9);
      border-color: rgba(255,163,90,.18);
      box-shadow: 0 18px 48px rgba(23,50,77,.18);
    }
    .mobile-nav button {
      color: #64788D;
      transition: transform .22s var(--bounce), background .22s var(--ease), color .22s var(--ease);
      position: relative;
    }
    .mobile-nav button.active:not(.mobile-fab) {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 12px 24px color-mix(in srgb, var(--accent) 24%, transparent);
    }
    .mobile-nav button.active:not(.mobile-fab)::after {
      content: "";
      position: absolute;
      bottom: 5px;
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #fff;
      animation: chipPop .28s var(--bounce);
    }
    .mobile-nav button.active .icon-sm {
      animation: navBounce .44s var(--bounce);
    }
    .mobile-nav .mobile-fab {
      background: linear-gradient(135deg, var(--ocean), var(--teal));
      color: #fff;
    }

    /* Interactive Leaflet travel maps */
    .map-card {
      border-radius: 30px;
      overflow: hidden;
      background:
        radial-gradient(circle at 84% 10%, color-mix(in srgb, var(--accent-2) 28%, transparent), transparent 22%),
        linear-gradient(135deg, rgba(255,253,246,.96), #FFF3D9);
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      box-shadow: 0 24px 58px rgba(23,50,77,.14);
    }
    .map-card-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      padding: 20px 20px 12px;
      flex-wrap: wrap;
    }
    .map-title-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: color-mix(in srgb, var(--accent) 70%, var(--ink-navy));
      font: 800 12px/1 var(--font-mono);
      letter-spacing: 0;
      text-transform: none;
    }
    .map-card-head h2 {
      margin: 8px 0 4px;
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
    }
    .map-card-head p {
      margin: 0;
      max-width: 660px;
      color: var(--muted);
      line-height: 1.6;
    }
    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .map-shell {
      position: relative;
      padding: 0 16px 16px;
    }
    .leaflet-map {
      height: 520px;
      width: 100%;
      border-radius: 26px;
      overflow: hidden;
      background: #E8FAFF;
      border: 1px solid rgba(23,50,77,.1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.38), 0 20px 44px rgba(23,50,77,.1);
      z-index: 1;
    }
    .overview-map .leaflet-map,
    .city-mini-map .leaflet-map {
      height: 420px;
    }
    .map-card.fullscreen-map-card {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 0;
      height: min(86vh, 920px);
      width: min(1220px, calc(100vw - 36px));
      border-radius: 34px;
      padding: 0;
    }
    .fullscreen-map-card .map-card-head {
      grid-column: 1;
      grid-row: 1;
      display: block;
      padding: 24px;
      overflow: auto;
      border-right: 1px solid rgba(23,50,77,.08);
    }
    .fullscreen-map-card .map-shell {
      grid-column: 2;
      grid-row: 1 / 4;
      padding: 16px;
      min-width: 0;
    }
    .fullscreen-map-card .leaflet-map {
      height: calc(min(86vh, 920px) - 32px);
    }
    .fullscreen-map-card .map-route-summary {
      grid-column: 1;
      grid-row: 2;
      grid-template-columns: 1fr;
      padding: 0 24px 14px;
    }
    .map-route-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 0 16px 16px;
    }
    .map-stat {
      border-radius: 20px;
      padding: 14px;
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(23,50,77,.08);
      box-shadow: 0 10px 20px rgba(23,50,77,.06);
    }
    .map-stat strong {
      display: block;
      font: 800 20px/1.1 var(--font-mono);
      color: var(--ink-navy);
      margin-bottom: 4px;
    }
    .map-stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .map-node-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 16px 18px;
      scroll-snap-type: x mandatory;
    }
    .fullscreen-map-card .map-node-strip {
      grid-column: 1;
      grid-row: 3;
      display: grid;
      padding: 0 24px 24px;
      overflow: auto;
    }
    .map-node-card {
      flex: 0 0 230px;
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      text-align: left;
      border: 1px solid rgba(23,50,77,.08);
      background: rgba(255,255,255,.78);
      border-radius: 20px;
      padding: 12px;
      color: var(--ink-navy);
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(23,50,77,.06);
      transition: transform .2s var(--bounce), box-shadow .2s var(--ease), border-color .2s var(--ease);
    }
    .map-node-card:hover,
    .map-node-card.active {
      transform: translateY(-3px);
      box-shadow: 0 18px 32px rgba(23,50,77,.12);
      border-color: color-mix(in srgb, var(--accent) 34%, transparent);
    }
    .map-node-card.active {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, #fff), #FFFDF6);
    }
    .map-node-num {
      width: 34px;
      height: 34px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font: 900 14px/1 var(--font-mono);
      box-shadow: 0 10px 18px color-mix(in srgb, var(--accent) 24%, transparent);
    }
    .map-node-card h3 {
      margin: 0 0 4px;
      font-size: 14px;
      line-height: 1.3;
    }
    .map-node-card p,
    .map-node-card small {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      display: block;
    }
    .map-node-card.suggested {
      border-style: dashed;
      background: rgba(255,255,255,.58);
    }
    .leaflet-container {
      font-family: var(--font-sans);
    }
    .leaflet-control-attribution {
      font-size: 10px;
      background: rgba(255,253,246,.74) !important;
      border-radius: 999px 0 0 0;
    }
    .travel-marker-shell {
      background: transparent;
      border: 0;
    }
    .travel-marker {
      --marker-color: var(--accent);
      width: 34px;
      height: 34px;
      border-radius: 999px 999px 999px 10px;
      transform: rotate(-45deg);
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--marker-color), color-mix(in srgb, var(--marker-color) 70%, var(--mango)));
      border: 3px solid #fff;
      color: #fff;
      box-shadow: 0 10px 22px color-mix(in srgb, var(--marker-color) 36%, transparent);
      transition: transform .2s var(--bounce), filter .2s var(--ease), box-shadow .2s var(--ease);
      position: relative;
    }
    .travel-marker span {
      transform: rotate(45deg);
      font: 900 13px/1 var(--font-mono);
    }
    .travel-marker.selected,
    .travel-marker.hovered {
      transform: rotate(-45deg) scale(1.22);
      filter: saturate(1.15);
      box-shadow: 0 0 0 8px color-mix(in srgb, var(--marker-color) 18%, transparent), 0 16px 30px color-mix(in srgb, var(--marker-color) 46%, transparent);
      z-index: 999 !important;
    }
    .travel-marker.done span {
      font-size: 0;
    }
    .travel-marker.done span::after {
      content: "✓";
      font-size: 15px;
    }
    .travel-marker.fav::after {
      content: "★";
      position: absolute;
      right: -8px;
      top: -9px;
      transform: rotate(45deg);
      width: 18px;
      height: 18px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--mango);
      color: #8A5300;
      border: 2px solid #fff;
      font-size: 10px;
    }
    .travel-marker.suggested {
      background: #FFFDF6;
      color: var(--ink-navy);
      border: 3px dashed var(--marker-color);
      box-shadow: 0 8px 18px rgba(23,50,77,.14);
    }
    .travel-marker.suggested span {
      color: var(--marker-color);
    }
    .leaflet-marker-icon {
      animation: markerPop .32s var(--bounce) both;
    }
    .leaflet-marker-icon:nth-child(2) { animation-delay: .04s; }
    .leaflet-marker-icon:nth-child(3) { animation-delay: .08s; }
    .leaflet-marker-icon:nth-child(4) { animation-delay: .12s; }
    .travel-line {
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 4px 7px rgba(23,50,77,.18));
      animation: mapLineFlow 4.4s linear infinite;
    }
    .line-flight { stroke-dasharray: 12 12; }
    .line-walk { stroke-dasharray: 2 9; }
    .line-scooter { stroke-dasharray: 14 5 4 5; }
    .line-taxi { stroke-dasharray: 10 7; }
    .line-hsr { stroke-dasharray: 18 6; }
    .line-bus { stroke-dasharray: 12 6; }
    .leaflet-popup-content-wrapper {
      border-radius: 18px;
      background: #FFFDF6;
      box-shadow: 0 14px 34px rgba(23,50,77,.18);
    }
    .leaflet-popup-content {
      margin: 12px 14px;
      min-width: 170px;
    }
    .map-popup-title {
      font-weight: 900;
      color: var(--ink-navy);
      margin-bottom: 4px;
    }
    .map-popup-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .timeline-item.map-selected {
      border-color: color-mix(in srgb, var(--accent) 38%, transparent);
      box-shadow: 0 22px 44px color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .map-placeholder-note {
      margin: 0 16px 16px;
      padding: 14px 16px;
      border-radius: 20px;
      background: rgba(255,209,102,.2);
      border: 1px dashed rgba(255,209,102,.5);
      color: #76581D;
      line-height: 1.55;
      font-size: 13px;
    }

    /* Typography polish: modern Chinese web feel, no stroke-contrast display font */
    .serif,
    .journey-title,
    .hero-title,
    .page-title,
    .day-title-grid h1,
    .empty-state h2,
    .hero-trip-card h2,
    .city-card h3,
    .postcard-content h2,
    .home-city-card strong,
    .home-card-head strong,
    .section-head h2,
    .panel-head h2,
    .map-card-head h2,
    .brand-title strong {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.012em;
      font-variation-settings: normal;
    }
    .journey-title {
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .btn,
    .nav-btn,
    .tab-btn,
    .action-btn,
    .chip,
    .tag,
    .density-pill,
    .route-node,
    .top-actions .btn,
    .journey-quick-row button {
      font-family: var(--font-sans);
      font-weight: 700;
      letter-spacing: 0;
    }
    .top-actions .btn {
      font-size: 15px;
    }
    .panel-head h2,
    .section-head h2,
    .map-card-head h2 {
      line-height: 1.16;
    }
    .timeline-time,
    .date-chip strong,
    .route-metric strong,
    .route-metric span,
    .map-stat strong,
    .map-node-num,
    .travel-marker span {
      font-family: var(--font-mono);
      font-weight: 700;
    }

    /* Taiwan route notebook cleanup: one bright system, with travel materials */
    body {
      background-color: var(--cream);
      background-image:
        radial-gradient(circle at 10% 12%, rgba(255, 209, 102, .28), transparent 24%),
        radial-gradient(circle at 90% 8%, rgba(28, 167, 236, .16), transparent 28%),
        linear-gradient(115deg, rgba(255,253,246,.96), rgba(255,248,234,.86));
    }
    .journey-page {
      background:
        radial-gradient(circle at 16% 16%, rgba(255,209,102,.38), transparent 26%),
        radial-gradient(circle at 88% 14%, rgba(28,167,236,.2), transparent 30%),
        linear-gradient(135deg, #FFFDF6, #FFF8EA 54%, #FFEBD8);
      color: var(--ink-navy);
    }
    .journey-page::before {
      background:
        linear-gradient(90deg, rgba(23,50,77,.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23,50,77,.035) 1px, transparent 1px),
        radial-gradient(circle, rgba(23,50,77,.08) 1px, transparent 1.4px);
      background-size: 86px 86px, 86px 86px, 18px 18px;
      mask-image: none;
    }
    .journey-title,
    .hero-title,
    .page-title,
    .day-title-grid h1,
    .postcard-content h2 {
      font-family: var(--font-title);
      font-weight: 600;
      letter-spacing: 0;
    }
    .journey-title { font-weight: 700; }
    .panel-head h2,
    .section-head h2,
    .map-card-head h2,
    .drawer h2,
    .modal h2,
    .home-card-head strong,
    .brand-title strong {
      font-family: var(--font-body);
      font-weight: 700;
      letter-spacing: 0;
    }
    .trip-label,
    .side-title,
    .stat-tile span,
    .map-title-kicker {
      text-transform: none;
      letter-spacing: 0;
    }
    .postcard-card,
    .ticket-card,
    .receipt-card,
    .note-card,
    .map-card-lite {
      position: relative;

      border: 1px solid rgba(23,50,77,.1);

      box-shadow: 0 18px 40px rgba(23,50,77,.1);
    }
    .postcard-card,
    .note-card {
      border-radius: 28px;
      background:
        linear-gradient(90deg, rgba(23,50,77,.035) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(180deg, #FFFDF6, #FFF6DF);
    }
    .ticket-card {
      border-radius: 26px;
      background:
        radial-gradient(circle at 0 50%, transparent 14px, rgba(255,255,255,.95) 15px),
        radial-gradient(circle at 100% 50%, transparent 14px, rgba(255,255,255,.95) 15px),
        linear-gradient(135deg, #fff, #FFF1D0);
    }
    .ticket-card::after {
      content: "";
      position: absolute;
      top: 18px;
      bottom: 18px;
      left: 62%;
      border-left: 2px dashed rgba(23,50,77,.14);
    }
    .receipt-card {
      border-radius: 22px;
      background:
        repeating-linear-gradient(180deg, rgba(23,50,77,.045) 0 1px, transparent 1px 28px),
        linear-gradient(180deg, #fff, #FFF8EA);
    }
    .map-card-lite {
      border-radius: 26px;
      background:
        linear-gradient(120deg, rgba(28,167,236,.1), transparent 38%),
        linear-gradient(90deg, rgba(23,50,77,.04) 1px, transparent 1px) 0 0 / 34px 34px,

    .stamp-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .stamp {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid rgba(23,50,77,.13);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      color: var(--ink-navy);
      font-family: var(--font-label);
      font-size: 12px;
      font-weight: 800;
    }
    .stamp-pending { border-style: dashed; color: #9C512A; background: rgba(255,209,102,.24); }
    .prep-row {
      display: flex;
      flex-wrap: wrap;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 390px);
      gap: clamp(16px, 3vw, 26px);

      margin: 16px 0 0;

    .prep-ticket {

      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transform: rotate(.5deg);
    }
    .ticket-row {
      position: relative;
      z-index: 1;
      min-width: 0;
      flex: 1 1 0;
      display: grid;
      gap: 5px;
      font-family: var(--font-label);
      font-weight: 800;
    }
    .ticket-row span { color: var(--muted); }
    .ticket-row strong { line-height: 1.2; overflow-wrap: anywhere; }
    .ticket-route {
      color: #526D83;
      font-weight: 700;
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      max-width: 160px;
      padding: 0 2px;
      text-align: center;
      line-height: 1.35;

      border-left: 1px dashed rgba(23,50,77,.18);

      z-index: 1;

    .prep-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .trip-now-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--teal);
      background: rgba(0,191,166,.08);
      border: 1px solid rgba(0,191,166,.18);
      border-radius: 999px;
      padding: 7px 14px;
      margin-top: 2px;

    .prep-card:nth-child(5) { --tilt: -.25deg; }

    .prep-card p {

      color: #526D83;
      line-height: 1.65;
      font-weight: 600;

    .prep-card small {

      font-family: var(--font-label);
      font-weight: 800;
      margin-top: 0;

    button.prep-card {

    .route-node.clickable:hover { transform: translateY(-3px); }
    .home-route-node small {
      margin-top: -4px;
      color: rgba(255,255,255,.86);
      font-size: 10px;
    }
    .home-city-card {
      border-radius: 28px;
      background:

<body>
  <div id="cloud-sync-banner" class="cloud-sync-banner hidden" role="status">当前数据保存在本地浏览器，配置 Supabase 后可多设备同步</div>
  <div id="app" class="app-root"></div>

  <!--
    Supabase setup SQL:
    Auth 设置说明：
    在 Supabase Dashboard -> Authentication -> Email 中，把邮箱确认方式改为 OTP / 6 位验证码模式，
    这样注册邮件会发送验证码而不是跳转链接。下面的验证码登录使用
    signInWithOtp + verifyOtp({ type: "magiclink" })，注册验证使用 verifyOtp({ type: "signup" })。

    CREATE TABLE trip_user_state (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
      trip_id text NOT NULL DEFAULT 'taiwan2026',
      user_id uuid REFERENCES auth.users(id),
      state_key text NOT NULL,
      state_value jsonb,
      updated_at timestamptz DEFAULT now(),
      UNIQUE(trip_id, user_id, state_key)
    );

    CREATE TABLE trip_invites (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
      trip_id text NOT NULL DEFAULT 'taiwan2026',
      invite_code text UNIQUE NOT NULL,
      created_by uuid REFERENCES auth.users(id),
      role text DEFAULT 'editor',  -- 'editor' | 'viewer'
      created_at timestamptz DEFAULT now(),
      expires_at timestamptz DEFAULT now() + interval '7 days'
    );

    CREATE TABLE trip_members (
      trip_id text NOT NULL,
      user_id uuid REFERENCES auth.users(id),
      email text,
      role text DEFAULT 'editor',
      joined_at timestamptz DEFAULT now(),
      PRIMARY KEY (trip_id, user_id)
    );

    ALTER TABLE trip_invites ENABLE ROW LEVEL SECURITY;
    ALTER TABLE trip_members ENABLE ROW LEVEL SECURITY;
    ALTER TABLE trip_user_state ENABLE ROW LEVEL SECURITY;

    CREATE TABLE expenses (
      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
      trip_id text DEFAULT 'taiwan2026',
      date date,
      day_id text,
      category text,
      description text,
      amount numeric,
      currency text DEFAULT 'HKD',
      amount_hkd numeric,
      paid_by text,
      split_with text[],
      receipt_url text,
      created_by uuid REFERENCES auth.users(id),
      created_at timestamptz DEFAULT now()
    );
    ALTER TABLE expenses ENABLE ROW LEVEL SECURITY;
    CREATE POLICY "trip members can access expenses"
      ON expenses FOR ALL
      USING (public.is_trip_member(trip_id));

    CREATE OR REPLACE FUNCTION public.is_trip_member(check_trip_id text)
    RETURNS boolean
    LANGUAGE sql
    SECURITY DEFINER
    SET search_path = public
    AS $$
      SELECT EXISTS (
        SELECT 1 FROM trip_members
        WHERE trip_id = check_trip_id
          AND user_id = auth.uid()
      );
    $$;

    CREATE OR REPLACE FUNCTION public.is_trip_editor(check_trip_id text)
    RETURNS boolean
    LANGUAGE sql
    SECURITY DEFINER
    SET search_path = public
    AS $$
      SELECT EXISTS (
        SELECT 1 FROM trip_members
        WHERE trip_id = check_trip_id
          AND user_id = auth.uid()
          AND role = 'editor'
      );
    $$;

    CREATE OR REPLACE FUNCTION public.is_trip_empty(check_trip_id text)
    RETURNS boolean
    LANGUAGE sql
    SECURITY DEFINER
    SET search_path = public
    AS $$
      SELECT NOT EXISTS (
        SELECT 1 FROM trip_members
        WHERE trip_id = check_trip_id
      );
    $$;

    CREATE TABLE trips (
      id text PRIMARY KEY,
      title text NOT NULL,
      description text,
      cover_emoji text DEFAULT '✈️',
      start_date date,
      end_date date,
      owner_id uuid REFERENCES auth.users(id),
      created_at timestamptz DEFAULT now()
    );
    ALTER TABLE trips ENABLE ROW LEVEL SECURITY;
    CREATE POLICY "members see their trips"
      ON trips FOR SELECT
      USING (public.is_trip_member(id));

    -- 插入台湾行程记录（在 SQL Editor 手动执行）
    INSERT INTO trips (id, title, description, cover_emoji, start_date, end_date)
    VALUES ('taiwan2026', '台湾旅行 2026', '高雄·墾丁·台北 9天8夜', '🌴', '2026-05-11', '2026-05-19')
    ON CONFLICT (id) DO NOTHING;

    CREATE POLICY "active invites are readable for join"
      ON trip_invites FOR SELECT
      USING (expires_at > now());

    CREATE POLICY "editors can create invites"
      ON trip_invites FOR INSERT
      WITH CHECK (
        created_by = auth.uid()
        AND public.is_trip_editor(trip_invites.trip_id)
      );

    CREATE POLICY "members can read same trip members"
      ON trip_members FOR SELECT
      USING (public.is_trip_member(trip_members.trip_id));

    CREATE POLICY "first user can bootstrap trip membership"
      ON trip_members FOR INSERT
      WITH CHECK (
        user_id = auth.uid()
        AND public.is_trip_empty(trip_members.trip_id)
      );

    CREATE POLICY "users can join through active invite"
      ON trip_members FOR INSERT
      WITH CHECK (
        user_id = auth.uid()
        AND EXISTS (
          SELECT 1 FROM trip_invites i
          WHERE i.trip_id = trip_members.trip_id
            AND i.expires_at > now()
        )
      );

    -- RLS: members can read all state for the same trip.
    CREATE POLICY "members can read same trip state"
      ON trip_user_state FOR SELECT
      USING (public.is_trip_member(trip_user_state.trip_id));

    -- Write permission is editor and above.
    CREATE POLICY "editors can insert same trip state"
      ON trip_user_state FOR INSERT
      WITH CHECK (
        user_id = auth.uid()
        AND public.is_trip_editor(trip_user_state.trip_id)
      );

    CREATE POLICY "editors can update same trip state"
      ON trip_user_state FOR UPDATE
      USING (public.is_trip_editor(trip_user_state.trip_id))
      WITH CHECK (
        user_id = auth.uid()
        AND public.is_trip_editor(trip_user_state.trip_id)
      );
  -->

    const SESSION_HOME_KEY = "taiwanTrip2026BoardingSeen-v1";
    const TRIP_ID = "taiwan2026";
    const INVITE_PARAM = "invite";
    const PHOTO_BUCKET = "trip-photos";
    const MAX_PHOTO_SIZE = 5 * 1024 * 1024;
    const EXCHANGE_RATES_TO_HKD = { HKD: 1, NTD: 0.24, RMB: 1.07 };
    const EXPENSE_CURRENCIES = ["HKD", "NTD", "RMB"];
    const EXPENSE_CATEGORIES = [
      { id: "餐饮", icon: "🍜", lucide: "utensils" },

    function expenseAmountToHkd(amount, currency) {
      const numeric = Number(amount) || 0;
      return Number((numeric * (EXCHANGE_RATES_TO_HKD[normalizeExpenseCurrency(currency)] || 1)).toFixed(2));
    }

    function createExpenseId() {

    function currentTaiwanDate() {
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Taipei",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(new Date());
      } catch {
        return new Date().toISOString().slice(0, 10);
      }
    }

    function dateForDayId(dayId) {
      const match = String(dayId || "").match(/^d(\d+)$/);
      if (!match) return "";
      const dayNumber = Number(match[1]);
      if (!Number.isFinite(dayNumber)) return "";
      return `2026-05-${String(10 + dayNumber).padStart(2, "0")}`;
    }

    function dayIdForDate(dateValue) {
      return days.find(day => dateForDayId(day.id) === dateValue)?.id || "";
    }

    function getTripPhase() {
      const today = currentTaiwanDate();
      const tripStart = "2026-05-11";
      const tripEnd   = "2026-05-19";
      if (today < tripStart) return { phase: "before" };
      if (today > tripEnd)   return { phase: "after" };
      const dayId = nearestTripDayId();
      const day   = tripData.daysById[dayId];
      const dayNum = days.findIndex(d => d.id === dayId) + 1;
      return { phase: "during", cityId: day?.cityId || "kaohsiung", day, dayId, dayNum };
    }

    function getCurrentActivity() {
      const phase = getTripPhase();
      if (phase.phase !== "during" || !phase.day) return null;
      const now = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Taipei", hour: "2-digit", minute: "2-digit", hour12: false
      }).format(new Date());
      const items = baseTimelineItemsForDay(phase.day);
      let current = null, next = null;
      for (const item of items) {
        const t = (item.time || "").replace(/[^\d:]/g, "").slice(0, 5);
        if (t && t <= now) current = item;
        else if (t && !next) next = item;
      }
      return { current, next };
    }

    function parseExpenseAmount(value) {
      if (typeof value === "number") return Number.isFinite(value) ? value : 0;
      const numeric = Number(String(value || "").replace(/[^\d.-]/g, ""));
      return Number.isFinite(numeric) ? numeric : 0;
    }

    function normalizeExpenseRecord(expense = {}, fallbackDayId = "") {
      const date = expense.date || dateForDayId(expense.day_id || fallbackDayId) || currentTaiwanDate();
      const dayId = dayIdForDate(date) || expense.day_id || fallbackDayId || "";
      const currency = normalizeExpenseCurrency(expense.currency || "HKD");
      const amount = parseExpenseAmount(expense.amount);
      const description = String(expense.description || expense.label || "未命名费用").trim();
      const paidBy = String(expense.paid_by || expense.paidBy || currentUserHandle()).trim() || "我";
      const splitWith = Array.isArray(expense.split_with)
        ? expense.split_with
        : Array.isArray(expense.splitWith)
          ? expense.splitWith
          : paidBy ? [paidBy] : [];
      return {
        id: String(expense.id || createExpenseId()),
        trip_id: expense.trip_id || TRIP_ID,
        date,
        day_id: dayId,
        category: expenseCategoryMeta(expense.category || "其他").id,
        description,
        amount,
        currency,
        amount_hkd: Number(expense.amount_hkd ?? expenseAmountToHkd(amount, currency)),
        paid_by: paidBy,
        split_with: [...new Set(splitWith.map(name => String(name || "").trim()).filter(Boolean))],
        receipt_url: expense.receipt_url || expense.receiptUrl || null,
        created_by: expense.created_by || expense.createdBy || currentUser?.id || currentUserHandle(),
        created_at: expense.created_at || expense.createdAt || new Date().toISOString()
      };
    }

    function migrateExpensesState(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw.map(item => normalizeExpenseRecord(item)).filter(item => item.amount > 0 || item.description);
      if (typeof raw === "object") {
        return Object.entries(raw).flatMap(([dayId, list]) => {
          if (!Array.isArray(list)) return [];
          return list.map(item => normalizeExpenseRecord(item, dayId));
        });
      }
      return [];
    }

    function mergeExpenseLists(...lists) {
      const byId = new Map();
      lists.flatMap(list => migrateExpensesState(list)).forEach(item => byId.set(item.id, item));
      return [...byId.values()].sort((a, b) => {
        const dateSort = String(a.date || "").localeCompare(String(b.date || ""));
        if (dateSort) return dateSort;
        return String(a.created_at || "").localeCompare(String(b.created_at || ""));
      });
    }

        const raw = localStorage.getItem(STORAGE_KEY);
        const saved = raw ? JSON.parse(raw) : null;
        const state = normalizeState(saved ? { ...defaultState, ...saved } : { ...defaultState }, saved?.designVersion, saved?.homeSeenVersion);
        state.expenses = mergeExpenseLists(state.expenses, loadExpensesFromLocalStorage());
        persistExpensesToLocalStorage(state.expenses);
        if (!sessionStorage.getItem(SESSION_HOME_KEY)) {
          sessionStorage.setItem(SESSION_HOME_KEY, "1");
          return {
            ...state,
            currentView: "journey-select",
            selectedTrip: null,
            selectedCity: null,
            selectedDay: null,
            selectedTab: "timeline",
            selectedMapPoint: null,
            drawer: null,
            modal: null
          };
        }
        return state;
      } catch {
        const state = normalizeState({ ...defaultState });
        state.expenses = loadExpensesFromLocalStorage();
        return state;
      }
    }

      Object.entries(incoming || {}).forEach(([dayId, list]) => {
        const byId = new Map((merged[dayId] || []).map(exp => [exp.id, exp]));
        (Array.isArray(list) ? list : []).forEach(exp => byId.set(exp.id, exp));
        merged[dayId] = [...byId.values()];
      });
      return merged;
    }

    function mergeCloudPatch(target, appKey, value) {
      if (!appKey) return;
      if (appKey === "expenses") {
        target.expenses = mergeExpensesState(target.expenses, value);
        return;
      }
      if (appKey === "deletedItems") {
        target.deletedItems = mergeDeletedItemsState(target.deletedItems, value);
        return;
      }
      if (appKey === "addedItems") {
        target.addedItems = mergeAddedItemsState(target.addedItems, value);
        return;
      }
      target[appKey] = mergeObjectState(target[appKey], value);
      if (appKey === "checklistStatus") target.checkedItems = target.checklistStatus;
    }

      return APP_TO_CLOUD_STATE_KEY[appKey] || null;
    }

      return appKey ? (appState[appKey] || {}) : {};
    }

    function queueCloudStateSave(changedKeys = []) {
      if (!supabaseClient || !changedKeys.length || applyingRemoteState || !canEditTrip()) return;
      changedKeys.forEach((key) => {
        const cloudKey = cloudKeyFromAppKey(key);
        if (cloudKey) pendingCloudSaveKeys.add(cloudKey);
      });
      if (!pendingCloudSaveKeys.size) return;
      window.clearTimeout(cloudSaveTimer);
      cloudSaveTimer = window.setTimeout(flushCloudStateSave, 300);
    }

    async function flushCloudStateSave() {
      const keys = [...pendingCloudSaveKeys];
      pendingCloudSaveKeys.clear();
      try {
        await Promise.all(keys.map(key => saveStateToCloud(key, cloudValueForKey(key))));
      } catch {
      }
    }

    async function cloudUserId() {
      if (!supabaseClient) return null;
      if (currentUser?.id) return currentUser.id;
      try {
        const { data } = await supabaseClient.auth.getUser();
        currentUser = data?.user || null;
        return currentUser?.id || null;
      } catch {
        return null;
      }

    async function saveStateToCloud(key, value) {
      if (!supabaseClient || !CLOUD_STATE_KEYS.includes(key) || !canEditTrip()) return;
      try {
        const userId = await cloudUserId();
        if (!userId) return;
        const tripId = activeTripId();
        if (!tripId) return;
        const payload = {
          trip_id: tripId,
          user_id: userId,
          state_key: key,
          state_value: value,
          updated_at: new Date().toISOString()
        };

        const { error } = await supabaseClient
          .from("trip_user_state")
          .upsert(payload, { onConflict: "trip_id,user_id,state_key" });
        if (error) throw error;
      } catch {
      }
    }

    async function loadStateFromCloud() {
      if (!supabaseClient || !currentUser) return;
      try {
        const { data, error } = await supabaseClient
          .from("trip_user_state")
          .select("user_id,state_key,state_value,updated_at")
          .eq("trip_id", activeTripId())
          .eq("user_id", currentUser.id)
          .in("state_key", CLOUD_STATE_KEYS)
          .order("updated_at", { ascending: true });
        if (error || !Array.isArray(data) || !data.length) return;

        const cloudPatch = {};
        data.forEach((row) => {
          const appKey = CLOUD_TO_APP_STATE_KEY[row.state_key];
          mergeCloudPatch(cloudPatch, appKey, row.state_value || {});
        });

        applyingRemoteState = true;
        appState = normalizeState({ ...appState, ...cloudPatch });
        saveState([]);
        applyingRemoteState = false;
        render();
      } catch {
        applyingRemoteState = false;
      }
    }

        currentMembership = error ? null : data;
        return currentMembership;

        currentMembership = null;

          trip_id: activeTripId(),

          email: currentUser.email,
          role: "editor"

      if (!supabaseClient || !currentUser) {
