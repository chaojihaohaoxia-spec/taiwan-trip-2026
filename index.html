    async function handleInviteCode(rawCode) {
      const inviteCode = extractInviteCode(rawCode);
      if (!inviteCode) {
        toast("请输入有效的邀请码");
        return null;
      }
      if (!supabaseClient) {
        toast("请先配置 Supabase");
        return null;
      }
      if (!currentUser) {
        pendingInviteCode = inviteCode;
        setState({
          currentView: "auth",
          modal: null,
          authMode: "signin",
          authError: "",
          authMessage: "检测到邀请链接，请先登录或注册，登录后会自动加入行程。"
        });
        return null;
      }
      try {
        const { data: invite, error } = await supabaseClient
          .from("trip_invites")
          .select("trip_id,invite_code,role,expires_at")
          .eq("invite_code", inviteCode)
          .maybeSingle();
        if (error || !invite) {
          if (pendingInviteCode === inviteCode) pendingInviteCode = "";
          toast("邀请链接无效");
          return null;
        }
        if (invite.expires_at && new Date(invite.expires_at) < new Date()) {
          if (pendingInviteCode === inviteCode) pendingInviteCode = "";
          toast("邀请链接已过期");
          return null;
        }
        const joinedTripId = invite.trip_id || TRIP_ID;
        const { error: joinError } = await supabaseClient
          .from("trip_members")
          .upsert({
            trip_id: joinedTripId,
            user_id: currentUser.id,
            email: currentUser.email,
            role: invite.role || "editor"
          }, { onConflict: "trip_id,user_id" });
        if (joinError) throw joinError;
        pendingInviteCode = "";
        authNotice = "已加入行程协作";
        clearInviteCodeFromUrl();
        toast("已加入行程协作");
        await routeAfterLogin({ preferredTripId: joinedTripId });
        return joinedTripId;
      } catch {
        toast("加入失败，请确认邀请权限和 RLS 设置");
        return null;
      }
    }

    async function processPendingInvite() {
      if (!pendingInviteCode) return null;
      return handleInviteCode(pendingInviteCode);
    }

    async function routeAfterLogin(options = {}) {
      const preferredTripId = options.preferredTripId || "";
      const userTrips = await loadUserTrips();
      const basePatch = {
        userTrips,
        authLoading: false,
        authError: "",
        authMessage: "",
        modal: null,
        drawer: null,
        fabOpen: false
      };

      if (preferredTripId && userTrips.some(trip => trip.id === preferredTripId)) {
        appState = normalizeState({ ...appState, ...basePatch });
        saveState([]);
        await enterUserTrip(preferredTripId, { userTrips });
        return userTrips;
      }

      if (userTrips.length === 1) {
        appState = normalizeState({ ...appState, ...basePatch });
        saveState([]);
        await enterUserTrip(userTrips[0].id, { userTrips });
        return userTrips;
      }

      if (userTrips.length > 1) {
        currentMembership = null;
        tripMembers = [];
        unsubscribeTripStateRealtime();
        unsubscribeExpensesRealtime();
        setState({ ...basePatch, currentView: "trip-list", selectedTrip: null, selectedCity: null, selectedDay: null, selectedTab: "timeline", selectedMapPoint: null });
        return userTrips;
      }

      currentMembership = null;
      tripMembers = [];
      unsubscribeTripStateRealtime();
      unsubscribeExpensesRealtime();
      setState({ ...basePatch, currentView: "no-trips", selectedTrip: null, selectedCity: null, selectedDay: null, selectedTab: "timeline", selectedMapPoint: null });
      return userTrips;
    }

    async function enterUserTrip(tripId, options = {}) {
      const userTrips = options.userTrips || appState.userTrips || [];
      const selected = userTrips.find(trip => trip.id === tripId) || fallbackTripMeta(tripId);
      const basePatch = {
        currentView: "trip-dashboard",
        userTrips,
        selectedTrip: selected.id,
        selectedCity: null,
        selectedDay: null,
        selectedTab: "timeline",
        selectedMapPoint: null,
        drawer: null,
        modal: null,
        fabOpen: false
      };

      if (selected.id !== TRIP_ID) {
        currentMembership = { role: selected.role || "editor" };
        tripMembers = [];
        unsubscribeTripStateRealtime();
        unsubscribeExpensesRealtime();
        setState(basePatch);
        return selected;
      }

      setState(basePatch);
      await Promise.all([
        loadCurrentMembership(selected.id),
        loadTripMembers(selected.id),
        loadStateFromCloud(),
        loadExpenses({ silent: true }),
        loadCheckins()
      ]);
      subscribeTripStateRealtime();
      subscribeExpensesRealtime();
      render();
      return selected;
    }

    function applyTripStatePayload(payload) {
      const row = payload?.new;
      if (!row || row.user_id === currentUser?.id || !CLOUD_STATE_KEYS.includes(row.state_key)) return;
      const appKey = CLOUD_TO_APP_STATE_KEY[row.state_key];
      if (!appKey) return;
      try {
        applyingRemoteState = true;
        const patch = {};
        mergeCloudPatch(patch, appKey, row.state_value || {});
        appState = normalizeState({ ...appState, ...patch });
        saveState([]);
        render();
      } finally {
        applyingRemoteState = false;
      }
    }

    function subscribeTripStateRealtime() {
      if (!supabaseClient || !currentUser) return;
      if (tripStateRealtimeChannel) {
        supabaseClient.removeChannel(tripStateRealtimeChannel);
        tripStateRealtimeChannel = null;
      }
      tripStateRealtimeChannel = supabaseClient
        .channel("trip-state")
        .on("postgres_changes", {
          event: "*",
          schema: "public",
          table: "trip_user_state",
          filter: `trip_id=eq.${activeTripId()}`
        }, (payload) => {
          applyTripStatePayload(payload);
        })
        .subscribe();
    }

    function unsubscribeTripStateRealtime() {
      if (supabaseClient && tripStateRealtimeChannel) {
        supabaseClient.removeChannel(tripStateRealtimeChannel);
      }
      tripStateRealtimeChannel = null;
    }

    function canUseCloudExpenses() {
      return Boolean(supabaseClient && isSupabaseConfigured() && currentUser);
    }

    function expenseSelectFields() {
      return "id,trip_id,date,day_id,category,description,amount,currency,amount_hkd,paid_by,split_with,receipt_url,created_by,created_at";
    }

    async function loadExpenses(options = {}) {
      const silent = !!options.silent;
      if (!canUseCloudExpenses()) {
        const localExpenses = mergeExpenseLists(appState.expenses, loadExpensesFromLocalStorage());
        setState({ expenses: localExpenses }, !silent);
        return localExpenses;
      }
      try {
        const { data, error } = await supabaseClient
          .from("expenses")
          .select(expenseSelectFields())
          .eq("trip_id", activeTripId())
          .order("date", { ascending: true })
          .order("created_at", { ascending: true });
        if (error) throw error;
        const merged = mergeExpenseLists(loadExpensesFromLocalStorage(), data || []);
        setState({ expenses: merged }, !silent);
        return merged;
      } catch (error) {
        console.warn("Expenses table unavailable, using local ledger.", error);
        const localExpenses = mergeExpenseLists(appState.expenses, loadExpensesFromLocalStorage());
        setState({ expenses: localExpenses }, !silent);
        return localExpenses;
      }
    }

    function applyExpenseRealtimePayload(payload) {
      const eventType = payload?.eventType || payload?.type;
      if (eventType === "DELETE") {
        const removedId = payload?.old?.id;
        if (!removedId) return;
        setState({ expenses: appState.expenses.filter(item => item.id !== removedId) });
        return;
      }
      const row = payload?.new;
      if (!row) return;
      setState({ expenses: mergeExpenseLists(appState.expenses, [row]) });
    }

    function subscribeExpensesRealtime() {
      if (!canUseCloudExpenses()) return;
      if (expensesRealtimeChannel) {
        supabaseClient.removeChannel(expensesRealtimeChannel);
        expensesRealtimeChannel = null;
      }
      expensesRealtimeChannel = supabaseClient
        .channel("trip-expenses")
        .on("postgres_changes", {
          event: "*",
          schema: "public",
          table: "expenses",
          filter: `trip_id=eq.${activeTripId()}`
        }, applyExpenseRealtimePayload)
        .subscribe();
    }

    function unsubscribeExpensesRealtime() {
      if (supabaseClient && expensesRealtimeChannel) {
        supabaseClient.removeChannel(expensesRealtimeChannel);
      }
      expensesRealtimeChannel = null;
    }

    function makeInviteCode() {
      const bytes = new Uint8Array(8);
      crypto.getRandomValues(bytes);
      return [...bytes].map(byte => byte.toString(36).padStart(2, "0")).join("").toUpperCase();
    }

    function buildInviteLink(code) {
      const url = new URL(window.location.href);
      url.searchParams.set(INVITE_PARAM, code);
      return url.toString();
    }

        toast("请先登录邮箱");

      const email = input?.value.trim();
      if (!email || !email.includes("@")) {

        authNotice = "登录链接已发送，请回到邮箱确认";

    async function refreshCollaboration(session) {
      currentUser = session?.user || null;
      currentMembership = null;
      tripMembers = [];
      if (!supabaseClient) return;
      if (!currentUser) {
        unsubscribeTripStateRealtime();
        unsubscribeExpensesRealtime();
        if (pendingInviteCode) {
          authNotice = "检测到邀请链接，请先用邮箱登录，登录后会自动加入行程。";
          appState = normalizeState({ ...appState, currentView: "auth", selectedTrip: null, authMessage: authNotice });
          saveState([]);
        }
        render();
        return;
      }
      if (pendingInviteCode) {
        const joinedTripId = await processPendingInvite();
        if (joinedTripId) return;
      }
      await routeAfterLogin();
    }

    async function initCollaboration() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.auth.getSession();
        await refreshCollaboration(data?.session || null);
        supabaseClient.auth.onAuthStateChange((_event, session) => {
          refreshCollaboration(session);
        });
      } catch {
      }
    }

    function saveState(changedKeys = []) {
      const persistent = { ...appState, drawer: null, modal: null, toast: "", fabOpen: false, authLoading: false, authError: "", authMessage: "" };

      if (changedKeys.includes("expenses")) persistExpensesToLocalStorage(appState.expenses);
      queueCloudStateSave(changedKeys);

    function itemLocationName(item) {
      return item?.location || item?.locationName || item?.place || item?.title || "";
    }

    function getEffectiveItem(item) {
      if (!item) return null;
      const edits = (appState.itemEdits || {})[item.id] || {};
      const merged = { ...item, ...edits };
      const day = tripData.daysById[merged.dayId] || selectedDay();
      const locationName = itemLocationName(merged);
      const loc = locationFor(locationName || merged.title, day?.cityId || merged.cityId);
      const detail = merged.detail ?? merged.notes ?? "";
      return {
        ...merged,
        place: locationName,
        location: locationName,
        locationName,
        detail,
        description: detail,
        notes: merged.notes ?? detail,
        dayId: merged.dayId || day?.id || "",
        cityId: loc.cityId || day?.cityId || merged.cityId,
        lat: loc.lat,
        lng: loc.lng,
        googleMapsQuery: loc.query || `${locationName || merged.title} ${day?.cityName || ""}`.trim(),
        approximate: !!loc.approximate,
        transportFromPrevious: merged.transportFromPrevious || merged.transport || merged.duration || ""
      };
    }

    function timelineItemsForDay(day) {
      if (!day) return [];
      const deleted = new Set(appState.deletedItems || []);
      return baseTimelineItemsForDay(day)
        .filter(item => item?.id && !deleted.has(item.id))
        .map(getEffectiveItem)
        .filter(Boolean);
    }

    function allTimelineItems() {
      return days.flatMap(day => timelineItemsForDay(day));

    function locationFor(place, cityId) {
      const text = String(place || "").trim();
      if (locationCatalog[text]) return locationCatalog[text];
      const key = Object.keys(locationCatalog).find(name => text.includes(name) || name.includes(text));
      if (key) return locationCatalog[key];
      return cityCenter(cityId);
    }

          item.transportFromPrevious = item.transport;
          item.googleMapsQuery = loc.query || `${item.locationName} ${day.cityName}`;

        });

        ]
      };
      return routes[dayId] || [];
    }

    function routePointFromPlace(day, entry, index, usedIds) {
      const [locationName, time, transport] = entry;
      const candidates = timelineItemsForDay(day).filter(item => {
        if (usedIds.has(item.id)) return false;
        const itemPlace = itemLocationName(item);
        return itemPlace === locationName || item.title.includes(locationName) || locationName.includes(itemPlace || "");
      });
      const exactMatch = candidates.find(item => item.time === time);
      const timelineMatch = time ? exactMatch : candidates[0];
      if (timelineMatch) usedIds.add(timelineMatch.id);
      const effectiveLocationName = timelineMatch ? itemLocationName(timelineMatch) : locationName;
      const loc = locationFor(effectiveLocationName, day.cityId);
      return {
        id: timelineMatch?.id || `${day.id}-route-${index}`,
        dayId: day.id,
        cityId: loc.cityId || day.cityId,
        time: timelineMatch?.time || time || "",
        title: timelineMatch?.title || effectiveLocationName,
        description: timelineMatch?.detail || (day.id === "d3" ? "西线骑行节点，实际停留可按体力缩短。" : "路线节点。"),
        type: timelineMatch?.type || (transport?.includes("车") || transport?.includes("捷运") || transport?.includes("高铁") ? "transport" : "sight"),
        locationName: effectiveLocationName,
        lat: loc.lat,
        lng: loc.lng,
        transportFromPrevious: transport || timelineMatch?.transport || "步行",
        googleMapsQuery: loc.query || `${effectiveLocationName} ${day.cityName}`,
        notes: timelineMatch?.detail || "",
        approximate: !!loc.approximate,
        routeIndex: index + 1
      };
    }

    function mapPointsForDay(day) {
      if (!day) return [];
      if (!day.planned) {
        return taipeiSuggestionPoints.map((point, index) => ({ ...point, id: `${day.id}-${point.id}`, dayId: day.id, routeIndex: index + 1 }));
      }
      const routeEntries = dayRoutePlaces(day.id);
      if (routeEntries.length) {
        const usedIds = new Set();
        const routePoints = routeEntries.map((entry, index) => routePointFromPlace(day, entry, index, usedIds));
        const customPoints = timelineItemsForDay(day)
          .filter(item => !usedIds.has(item.id) && Number.isFinite(item.lat) && Number.isFinite(item.lng))
          .map((item, index) => ({ ...item, routeIndex: routePoints.length + index + 1 }));
        return [...routePoints, ...customPoints];
      }
      return timelineItemsForDay(day)
        .filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng))
        .map((item, index) => ({ ...item, routeIndex: index + 1 }));
    }

    function mapPointsForCity(cityId) {
      if (cityId === "taipei") return taipeiSuggestionPoints.map((point, index) => ({ ...point, routeIndex: index + 1 }));
      const seen = new Set();
      const points = [];
      daysForCity(cityId).forEach(day => {
        mapPointsForDay(day).forEach(point => {
          if (point.cityId !== cityId || seen.has(point.locationName)) return;
          seen.add(point.locationName);
          points.push({ ...point, id: `city-${cityId}-${points.length}`, routeIndex: points.length + 1 });
        });
      });
      return points;
    }

    function spotLogSectionsForSpot(spot, review = emptySpotReview()) {
      const matches = timelineMatchesForSpot(spot.cityName, spot.name);
      const types = new Set(matches.map(({ item }) => item.type));
      const context = [
        spot.name,
        spot.schedule,
        ...matches.flatMap(({ item }) => [item.title, itemLocationName(item), item.detail, item.description])
      ].filter(Boolean).join(" ");
      const hasFoodEntry = (review.foodLog || []).length > 0;
      const hasShopEntry = (review.shopLog || []).length > 0;
      const foodRelevant = hasFoodEntry
        || types.has("food")
        || types.has("night-market")
        || /餐|饭|食|吃|小吃|夜市|红茶|牛奶|咖啡|甜|冰|茶|大街|恒春镇中心/.test(context);
      const shopRelevant = hasShopEntry
        || types.has("night-market")
        || /商圈|新堀江|购物|逛街|买|补给|伴手礼|市场|夜市|大街/.test(context);
      return [
        foodRelevant ? { logType: "foodLog", iconName: "utensils", title: "吃了什么" } : null,
        shopRelevant ? { logType: "shopLog", iconName: "shopping-bag", title: "买了什么" } : null
      ].filter(Boolean);
    }

    function spotCandidates(spotName) {
      return [...new Set([spotName, ...(SPOT_ALIASES[spotName] || [])].filter(Boolean))];
    }

    function itemMatchesSpot(item, spotName) {
      const candidates = spotCandidates(spotName);
      const fields = [item.title, item.place, item.locationName, item.googleMapsQuery, item.description, item.detail]
        .filter(Boolean)
        .map(value => String(value).trim());
      return candidates.some(candidate => {
        const text = String(candidate).trim();
        return fields.some(field => field === text || field.includes(text) || text.includes(field));
      });
    }

    function timelineMatchesForSpot(cityName, spotName) {
      const cityId = SPOT_CITY_IDS[cityName];
      return days.flatMap(day => timelineItemsForDay(day).map(item => ({ day, item }))).filter(({ day, item }) => {
        const itemCityId = item.cityId || day.cityId;
        if (cityId && itemCityId && itemCityId !== cityId && day.cityId !== cityId) return false;
        return itemMatchesSpot(item, spotName);
      });
    }

    function spotLocationFor(cityName, spotName) {
      const candidates = spotCandidates(spotName);
      for (const candidate of candidates) {
        const exact = catalogLocationFor(candidate);
        if (exact) return exact;
      }
      const match = timelineMatchesForSpot(cityName, spotName)[0];
      if (match?.item) return {
        lat: match.item.lat,
        lng: match.item.lng,
        cityId: match.item.cityId,
        query: match.item.googleMapsQuery || match.item.locationName || match.item.place || spotName,
        approximate: !!match.item.approximate
      };
      return cityCenter(SPOT_CITY_IDS[cityName]);
    }

    function allSpotEntries() {
      return Object.entries(tripData.checklist).flatMap(([cityName, names]) => {
        const cityId = SPOT_CITY_IDS[cityName];
        return names.map(name => {
          const matches = timelineMatchesForSpot(cityName, name);
          const dayLabels = [...new Set(matches.map(({ day }) => day.dayNo || day.label))];
          const dateLabels = [...new Set(matches.map(({ day }) => day.shortLabel || day.label))];
          const location = spotLocationFor(cityName, name);
          return {
            id: spotIdFor(cityName, name),
            cityName,
            cityId,
            name,
            dayLabels,
            dateLabels,
            schedule: dayLabels.length ? dayLabels.join(" / ") : "未排入时间轴",
            dateText: dateLabels.length ? dateLabels.join(" / ") : "未排入时间轴",
            location
          };
        });
      });
    }

    function spotEntryForTimelineItem(item) {

      return allSpotEntries().find(spot => {

    function spotRatingStats() {
      const spots = allSpotEntries();
      const counts = Object.fromEntries(RATING_ORDER.map(rating => [rating, 0]));
      let unrated = 0;
      spots.forEach(spot => {
        const rating = spotReview(spot.id).rating;
        if (rating && counts[rating] !== undefined) counts[rating] += 1;
        else unrated += 1;
      });
      return { counts, unrated, total: spots.length };
    }

        .filter(spot => spot.review.rating)

          const rankDelta = RATING_ORDER.indexOf(a.review.rating) - RATING_ORDER.indexOf(b.review.rating);
          if (rankDelta) return rankDelta;
          return new Date(b.review.ratedAt || 0) - new Date(a.review.ratedAt || 0);
        });
    }

    async function loadUserTrips() {
      if (!supabaseClient || !currentUser) return [];
      try {
        const { data, error } = await supabaseClient
          .from("trip_members")
          .select("trip_id, role, trips(id, title, description, cover_emoji, start_date, end_date, owner_id)")
          .eq("user_id", currentUser.id)
          .order("joined_at", { ascending: true });
        if (error) throw error;
        return (data || []).map(normalizeTripCard).filter(Boolean);
      } catch {
        try {
          const { data: memberRows, error: memberError } = await supabaseClient
            .from("trip_members")
            .select("trip_id, role, joined_at")
            .eq("user_id", currentUser.id)
            .order("joined_at", { ascending: true });
          if (memberError || !Array.isArray(memberRows) || !memberRows.length) return [];
          const tripIds = [...new Set(memberRows.map(row => row.trip_id).filter(Boolean))];
          let tripRows = [];
          if (tripIds.length) {
            const { data } = await supabaseClient
              .from("trips")
              .select("id, title, description, cover_emoji, start_date, end_date, owner_id")
              .in("id", tripIds);
            tripRows = Array.isArray(data) ? data : [];
          }
          const tripsById = new Map(tripRows.map(trip => [trip.id, trip]));
          return memberRows.map(row => normalizeTripCard({ ...row, trips: tripsById.get(row.trip_id) || fallbackTripMeta(row.trip_id, row.role) })).filter(Boolean);
        } catch {
          return [];
        }
      }
    }

    function resetCheckinDraft() {
      if (checkinDraft.previewUrl) URL.revokeObjectURL(checkinDraft.previewUrl);
      checkinDraft = createEmptyCheckinDraft();
      checkinUploading = false;
    }

    function isCheckinFeatureAvailable() {
      return Boolean(supabaseClient && isSupabaseConfigured());
    }

    function checkinItem(itemId) {
      return allTimelineItems().find(item => item.id === itemId) || null;
    }

    function defaultCheckinItemId() {
      if (appState.selectedMapPoint && checkinItem(appState.selectedMapPoint)) return appState.selectedMapPoint;
      const day = selectedDay() || tripData.daysById[nearestTripDayId()];
      return timelineItemsForDay(day).find(item => item.id)?.id || allTimelineItems()[0]?.id || null;
    }

    function allCheckinsSorted() {
      return [...checkins].sort((a, b) => new Date(b.checked_at || 0) - new Date(a.checked_at || 0));
    }

    function checkinsForDay(dayId) {
      return allCheckinsSorted().filter(item => item.day_id === dayId);
    }

    function hasItemCheckin(itemId) {
      return checkins.some(item => item.item_id === itemId);
    }

    function shortEmail(email = "") {
      const value = String(email || "").trim();
      if (!value) return "未知用户";
      const [name, domain] = value.split("@");
      if (!domain) return value.length > 12 ? `${value.slice(0, 10)}...` : value;
      const shortName = name.length > 8 ? `${name.slice(0, 7)}...` : name;
      return `${shortName}@${domain}`;
    }

    function formatCheckinTime(value) {
      if (!value) return "";
      try {
        return new Intl.DateTimeFormat("zh-Hant", {
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "Asia/Taipei"
        }).format(new Date(value));
      } catch {
        return String(value).slice(0, 16).replace("T", " ");
      }
    }

    function formatFileSize(size = 0) {
      if (!size) return "";
      return size > 1024 * 1024 ? `${(size / 1024 / 1024).toFixed(1)} MB` : `${Math.round(size / 1024)} KB`;
    }

    function createEmptyExpenseDraft(seed = {}) {
      const activeDay = seed.day_id ? tripData.daysById[seed.day_id] : selectedDay();
      const date = seed.date || dateForDayId(activeDay?.id) || currentTaiwanDate();
      const paidBy = seed.paid_by || currentUserHandle();
      return {
        date,
        day_id: seed.day_id || dayIdForDate(date) || activeDay?.id || "",
        category: expenseCategoryMeta(seed.category || "餐饮").id,
        description: seed.description || "",
        amount: seed.amount ?? "",
        currency: normalizeExpenseCurrency(seed.currency || "NTD"),
        paid_by: paidBy,
        split_with: Array.isArray(seed.split_with) && seed.split_with.length ? seed.split_with : [paidBy],
        receipt_url: seed.receipt_url || null,
        receiptPreviewUrl: seed.receiptPreviewUrl || "",
        receiptFile: seed.receiptFile || null,
        receiptFileName: seed.receiptFileName || "",
        receiptFileSize: seed.receiptFileSize || 0,
        scanning: !!seed.scanning
      };
    }

    function revokeExpenseDraftPreview() {
      if (expenseDraft?.receiptPreviewUrl?.startsWith("blob:")) URL.revokeObjectURL(expenseDraft.receiptPreviewUrl);
    }

    function resetExpenseDraft() {
      revokeExpenseDraftPreview();
      expenseDraft = null;
      expenseSaving = false;
    }

    function knownExpenseMembers() {
      const names = [
        currentUserHandle(),
        ...tripMembers.map(member => formatUserHandle(member.email || member.user_id || "")),
        ...migrateExpensesState(appState.expenses).flatMap(item => [item.paid_by, ...(item.split_with || [])])
      ].map(name => String(name || "").trim()).filter(Boolean);
      return [...new Set(names.length ? names : ["我"])];
    }

    function expensesForDay(dayId) {
      return migrateExpensesState(appState.expenses).filter(item => item.day_id === dayId || (!item.day_id && item.date === dateForDayId(dayId)));
    }

    function allExpensesSorted() {
      return migrateExpensesState(appState.expenses).sort((a, b) => {
        const dateSort = String(a.date || "").localeCompare(String(b.date || ""));
        if (dateSort) return dateSort;
        return String(b.created_at || "").localeCompare(String(a.created_at || ""));
      });
    }

    function formatMoney(amount, currency = "HKD") {
      const value = Number(amount) || 0;
      return `${normalizeExpenseCurrency(currency)} ${value.toLocaleString("zh-HK", { maximumFractionDigits: 2 })}`;
    }

    function formatHkd(amount) {
      const value = Number(amount) || 0;
      return `HKD ${value.toLocaleString("zh-HK", { maximumFractionDigits: 2 })}`;
    }

    function expenseStats(expenses = allExpensesSorted()) {
      const totalHkd = expenses.reduce((sum, item) => sum + (Number(item.amount_hkd) || expenseAmountToHkd(item.amount, item.currency)), 0);
      const categoryTotals = EXPENSE_CATEGORIES.map(category => {
        const amount = expenses
          .filter(item => item.category === category.id)
          .reduce((sum, item) => sum + (Number(item.amount_hkd) || 0), 0);
        return { ...category, amount, percent: totalHkd ? Math.round(amount / totalHkd * 100) : 0 };
      }).filter(item => item.amount > 0);
      const payerTotals = {};
      expenses.forEach(item => {
        const payer = item.paid_by || "未知";
        payerTotals[payer] = (payerTotals[payer] || 0) + (Number(item.amount_hkd) || 0);
      });
      const current = currentUserHandle();
      return {
        expenses,
        totalHkd,
        categoryTotals,
        payerTotals,
        currentPaidHkd: payerTotals[current] || 0
      };
    }

    function groupedExpensesByDay(expenses = allExpensesSorted()) {
      const groups = new Map();
      expenses.forEach(expense => {
        const dayId = expense.day_id || dayIdForDate(expense.date) || "other";
        if (!groups.has(dayId)) groups.set(dayId, []);
        groups.get(dayId).push(expense);
      });
      return [...groups.entries()].map(([dayId, expenses]) => ({ dayId, expenses }));
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || "").split(",")[1] || "");
        reader.onerror = () => reject(reader.error || new Error("读取图片失败"));
        reader.readAsDataURL(file);
      });
    }

    function parseAIJson(text) {
      const raw = String(text || "").trim();
      try {
        return JSON.parse(raw);
      } catch {
        const start = raw.indexOf("{");
        const end = raw.lastIndexOf("}");
        if (start < 0 || end <= start) return null;
        try { return JSON.parse(raw.slice(start, end + 1)); } catch { return null; }
      }
    }

    async function scanReceiptWithAI(imageFile) {
      const base64 = await fileToBase64(imageFile);
      const mimeType = imageFile.type || "image/jpeg";
      const apiKey = appConfig.anthropicApiKey;
      if (!apiKey) {
        toast("请先在设置里填入 Anthropic API Key");
        return null;
      }
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "content-type": "application/json",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 300,
          messages: [{
            role: "user",
            content: [
              {
                type: "image",
                source: { type: "base64", media_type: mimeType, data: base64 }
              },
              {
                type: "text",
                text: "这是一张消费小票或付款截图。请提取以下信息并以 JSON 格式返回，如果某项无法识别就返回 null：\n{\n  \"amount\": 数字（金额，只取数字）,\n  \"currency\": \"HKD\" 或 \"NTD\" 或 \"RMB\"（台湾用NTD，香港用HKD，大陆用RMB）,\n  \"description\": \"消费描述（店名或商品名，中文，简短）\",\n  \"date\": \"YYYY-MM-DD格式的日期，如果有的话\",\n  \"category\": \"餐饮\" 或 \"交通\" 或 \"住宿\" 或 \"购物\" 或 \"门票\" 或 \"活动\" 或 \"其他\"\n}\n只返回 JSON，不要其他文字。"
              }
            ]
          }]
        })
      });
      if (!response.ok) throw new Error("AI 识别请求失败");
      const data = await response.json();
      const text = data.content?.[0]?.text || "{}";
      return parseAIJson(text);
    }

    async function uploadExpenseReceipt(file) {
      if (!file || !canUseCloudExpenses()) return null;
      if (file.size > MAX_PHOTO_SIZE) throw new Error("图片超过 5MB");
      const safeName = String(file.name || "receipt.jpg").replace(/[^\w.-]+/g, "-").slice(-80);
      const path = `${tripData.id}/${currentUser.id}/expenses/${Date.now()}-${safeName}`;
      const { error } = await supabaseClient.storage.from(PHOTO_BUCKET).upload(path, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type || "image/jpeg"
      });
      if (error) throw error;
      return supabaseClient.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    async function refreshCurrentUser() {
      if (!supabaseClient) return null;
      try {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error) throw error;
        currentUser = data?.user || null;
        return currentUser;
      } catch {
        currentUser = null;
        return null;
      }
    }

    async function requireCheckinUser() {
      if (!currentUser) await refreshCurrentUser();
      if (!currentUser) throw new Error("请先登录后再打卡");
      return currentUser;
    }

    async function loadCheckins() {
      if (!isCheckinFeatureAvailable()) return;
      checkinsLoading = true;
      render();
      try {
        const { data, error } = await supabaseClient
          .from("checkins")
          .select("id,trip_id,user_id,user_email,day_id,item_id,location_name,caption,photo_url,checked_at")
          .eq("trip_id", activeTripId())
          .order("checked_at", { ascending: false });
        if (error) throw error;
        checkins = Array.isArray(data) ? data : [];
      } catch (error) {
        toast(`相册加载失败：${error.message || "请检查 Supabase 设置"}`);
      } finally {
        checkinsLoading = false;
        render();
      }
    }

    function subscribeCheckins() {
      if (!isCheckinFeatureAvailable() || checkinsRealtimeChannel) return;
      checkinsRealtimeChannel = supabaseClient
        .channel("taiwan2026-checkins")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "checkins", filter: `trip_id=eq.${activeTripId()}` },
          () => loadCheckins()
        )
        .subscribe();
    }

    async function initCheckins() {
      if (!isCheckinFeatureAvailable()) return;
      try {
        const { data } = await supabaseClient.auth.getSession();
        currentUser = data?.session?.user || null;
        supabaseClient.auth.onAuthStateChange((_event, session) => {
          currentUser = session?.user || null;
          render();
          loadCheckins();
        });
      } catch {
        await refreshCurrentUser();
      }
      await loadCheckins();
      subscribeCheckins();
    }

    function validateCheckinFile(file) {
      if (!file) throw new Error("请先选择一张照片");
      if (!file.type?.startsWith("image/")) throw new Error("文件类型必须是图片");
      if (file.size > MAX_PHOTO_SIZE) throw new Error("图片大小不能超过 5MB");
    }

    function setCheckinFile(file) {
      try {
        validateCheckinFile(file);
        if (checkinDraft.previewUrl) URL.revokeObjectURL(checkinDraft.previewUrl);
        checkinDraft = {
          ...checkinDraft,
          file,
          fileName: file.name,
          fileSize: file.size,
          photoUrl: "",
          previewUrl: URL.createObjectURL(file)
        };
        render();
      } catch (error) {
        toast(error.message || "图片选择失败");
      }
    }

    function updateCheckinCaption(value) {
      checkinDraft.caption = value;
    }

    function handleCheckinFileSelect(event) {
      event.stopPropagation();
      const file = event.target.files?.[0];
      if (file) setCheckinFile(file);
    }

    function handleCheckinDrop(event) {
      event.preventDefault();
      event.stopPropagation();
      event.currentTarget.classList.remove("dragging");
      const file = event.dataTransfer?.files?.[0];
      if (file) setCheckinFile(file);
    }

    function safePathPart(value) {
      return String(value || "free-checkin").replace(/[^a-z0-9_-]+/gi, "-").replace(/^-+|-+$/g, "") || "free-checkin";
    }

    async function uploadCheckinPhoto(file, itemId) {
      validateCheckinFile(file);
      const user = await requireCheckinUser();
      const path = `taiwan2026/${user.id}/${safePathPart(itemId)}-${Date.now()}.jpg`;
      const { error } = await supabaseClient.storage.from(PHOTO_BUCKET).upload(path, file, {
        cacheControl: "3600",
        contentType: file.type,
        upsert: false
      });
      if (error) throw error;
      const { publicUrl } = supabaseClient.storage.from(PHOTO_BUCKET).getPublicUrl(path).data;
      return publicUrl;
    }

    async function ensureDraftPhotoUploaded(itemId) {
      if (checkinDraft.photoUrl) return checkinDraft.photoUrl;
      const publicUrl = await uploadCheckinPhoto(checkinDraft.file, itemId);
      checkinDraft.photoUrl = publicUrl;
      return publicUrl;
    }

      if (!requireEditor("上传打卡照片")) return;
      try {

        render();
        await ensureDraftPhotoUploaded(modal.itemId);

        checkinUploading = false;
        render();
      }

    function openCheckinModal(itemId, event) {
      event?.stopPropagation();
      if (!requireEditor("打卡")) return;
      if (!isCheckinFeatureAvailable()) {
        toast("请先在设置里配置 Supabase 后再打卡");
        return;
      }
      const targetItemId = itemId || defaultCheckinItemId();
      const item = checkinItem(targetItemId);
      if (!item) {
        toast("当前没有可打卡的行程项");
        return;
      }
      resetCheckinDraft();
      setState({ modal: { type: "checkin", itemId: item.id }, fabOpen: false });
    }

    function cancelCheckinModal() {
      resetCheckinDraft();
      setState({ modal: null });
    }

    async function confirmCheckin() {
      const modal = appState.modal;
      if (!modal || modal.type !== "checkin" || checkinUploading) return;
      if (!requireEditor("打卡")) return;
      const item = checkinItem(modal.itemId);
      if (!item) return;
      const day = tripData.daysById[item.dayId] || selectedDay();
      const caption = document.getElementById("checkin-caption-input")?.value.trim() || checkinDraft.caption.trim();
      checkinDraft.caption = caption;
      try {
        checkinUploading = true;
        render();
        const user = await requireCheckinUser();
        const photoUrl = await ensureDraftPhotoUploaded(item.id);
        const payload = {
          trip_id: activeTripId(),
          user_id: user.id,
          user_email: user.email || user.user_metadata?.email || "",
          day_id: day?.id || item.dayId || null,
          item_id: item.id || null,
          location_name: item.locationName || item.place || item.title,
          caption,
          photo_url: photoUrl
        };
        const { data, error } = await supabaseClient
          .from("checkins")
          .insert(payload)
          .select("id,trip_id,user_id,user_email,day_id,item_id,location_name,caption,photo_url,checked_at")
          .single();
        if (error) throw error;
        if (data) checkins = [data, ...checkins.filter(row => row.id !== data.id)];
        resetCheckinDraft();
        setState({ modal: null });
        toast("打卡成功，已加入相册");
        loadCheckins();
      } catch (error) {
        toast(`打卡失败：${error.message || "请稍后重试"}`);
      } finally {
        checkinUploading = false;
        render();
      }
    }
