<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taiwan Trip 2026 · Travel App</title>
  <meta name="description" content="A layered interactive travel guide for Taiwan Trip 2026." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --navy: #102235;
      --navy-2: #18344f;
      --ivory: #fbf7ef;
      --paper: #fffdf8;
      --sand: #e8dac4;
      --sand-2: #f3eadf;
      --orange: #d76d3a;
      --orange-2: #f2a36e;
      --sage: #7f9a80;
      --sage-2: #e9efe7;
      --ink: #172033;
      --muted: #6e7786;
      --line: rgba(23, 32, 51, 0.1);
      --glass: rgba(255, 253, 248, 0.72);
      --shadow: 0 24px 70px rgba(16, 34, 53, 0.12);
      --shadow-soft: 0 14px 38px rgba(16, 34, 53, 0.1);
      --radius-lg: 28px;
      --radius: 22px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --font-display: "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", "Microsoft JhengHei", "Microsoft YaHei", system-ui, sans-serif;
      --font-serif: var(--font-display);
      --font-sans: "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", "Microsoft JhengHei", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "Manrope", "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--ink);
      background:
        linear-gradient(140deg, rgba(16,34,53,.06), transparent 32%),
        linear-gradient(0deg, var(--ivory), #f7efe5 100%);
      letter-spacing: 0;
    }

    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    .hidden { display: none !important; }
    .serif { font-family: var(--font-serif); }
    .icon { width: 18px; height: 18px; stroke-width: 1.9; }
    .icon-sm { width: 15px; height: 15px; stroke-width: 2; }

    .app-root { min-height: 100vh; }
    .btn {
      border: 1px solid rgba(16,34,53,.1);
      background: var(--paper);
      color: var(--ink);
      min-height: 42px;
      border-radius: 999px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(16,34,53,.06);
      transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-soft); border-color: rgba(16,34,53,.16); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: var(--navy);
      color: #fff;
      border-color: rgba(255,255,255,.08);
      box-shadow: 0 16px 36px rgba(16,34,53,.22);
    }
    .btn-primary:hover { background: var(--navy-2); }
    .btn-ghost {
      background: rgba(255,253,248,.58);
      box-shadow: none;
      backdrop-filter: blur(16px);
    }
    .btn-danger { color: #9f3d2f; border-color: rgba(159,61,47,.18); background: #fff8f4; }
    .btn-small { min-height: 34px; padding: 0 12px; font-size: 12px; }
    .btn-icon { width: 38px; min-height: 38px; padding: 0; border-radius: 15px; }

    .chip {
      border: 1px solid rgba(16,34,53,.08);
      border-radius: 999px;
      padding: 7px 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,253,248,.64);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .tag { display: inline-flex; padding: 6px 10px; border-radius: 999px; background: var(--sand-2); color: #6f5a40; font-size: 11px; font-weight: 800; }
    .tag.sage { background: var(--sage-2); color: #536c55; }
    .tag.orange { background: #fbe8db; color: #9a4b29; }
    .tag.dark { background: rgba(16,34,53,.08); color: var(--navy); }

    .card {
      background: rgba(255,253,248,.84);
      border: 1px solid rgba(16,34,53,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
    }
    .soft-card {
      background: rgba(255,253,248,.64);
      border: 1px solid rgba(16,34,53,.08);
      border-radius: var(--radius);
    }

    /* Journey selection */
    .journey-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        linear-gradient(120deg, rgba(16,34,53,.94), rgba(20,53,78,.86)),
        linear-gradient(0deg, #102235, #102235);
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .journey-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent);
      pointer-events: none;
    }
    .journey-wrap {
      width: min(1120px, 100%);
      position: relative;
      z-index: 1;
    }
    .journey-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      padding: 9px 14px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(20px);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .journey-title {
      margin: 24px 0 10px;
      font-size: clamp(42px, 8vw, 96px);
      line-height: .92;
      letter-spacing: 0;
    }
    .journey-subtitle { margin: 0 0 34px; color: rgba(255,255,255,.66); font-size: clamp(16px, 2vw, 22px); }
    .journey-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr);
      gap: 22px;
      align-items: stretch;
    }
    .hero-trip-card {
      border-radius: 34px;
      padding: clamp(24px, 4vw, 42px);
      background:
        linear-gradient(145deg, rgba(255,253,248,.94), rgba(244,232,214,.86));
      color: var(--ink);
      min-height: 470px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 34px 90px rgba(0,0,0,.26);
      border: 1px solid rgba(255,255,255,.28);
    }
    .trip-card-top { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
    .trip-label { color: var(--orange); font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .hero-trip-card h2 { margin: 12px 0 12px; font-size: clamp(34px, 5vw, 62px); line-height: .96; }
    .trip-card-meta { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px; }
    .trip-route-card {
      border-radius: 26px;
      padding: 18px;
      background: rgba(16,34,53,.06);
      border: 1px solid rgba(16,34,53,.08);
    }
    .trip-route-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--navy); font-size: 13px; font-weight: 800; }
    .future-grid { display: grid; gap: 12px; }
    .future-card {
      border-radius: 24px;
      padding: 22px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(20px);
      color: rgba(255,255,255,.48);
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 82px;
    }
    .future-card strong { color: rgba(255,255,255,.78); font-size: 19px; }
    .future-card span { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

    /* App shell */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 42px);
      background: rgba(251,247,239,.78);
      border-bottom: 1px solid rgba(16,34,53,.08);
      backdrop-filter: blur(24px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: #fff;
      box-shadow: 0 12px 28px rgba(16,34,53,.22);
    }
    .brand-title { display: grid; gap: 1px; min-width: 0; }
    .brand-title strong { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-title span { color: var(--muted); font-size: 12px; font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .app-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 300px;
      gap: 20px;
      padding: 22px clamp(16px, 4vw, 38px) 92px;
      max-width: 1480px;
      margin: 0 auto;
    }
    .side-nav, .right-rail {
      position: sticky;
      top: 92px;
      align-self: start;
      max-height: calc(100vh - 110px);
      overflow: auto;
    }
    .side-nav { padding: 16px; }
    .side-title { color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; margin: 4px 8px 10px; }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      border-radius: 16px;
      min-height: 42px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
    }
    .nav-btn:hover { background: rgba(16,34,53,.05); }
    .nav-btn.active { background: var(--navy); color: #fff; }
    .nav-btn small { margin-left: auto; color: inherit; opacity: .62; font-weight: 800; }
    .side-divider { height: 1px; background: var(--line); margin: 14px 4px; }
    .main-stage { min-width: 0; display: grid; gap: 18px; }
    .right-rail { display: grid; gap: 14px; }
    .rail-card { padding: 18px; }
    .rail-card h3 { margin: 0 0 12px; font-size: 14px; }
    .rail-muted { color: var(--muted); font-size: 13px; line-height: 1.55; }

    /* Dashboard */
    .dashboard-hero {
      border-radius: 34px;
      padding: clamp(24px, 4vw, 40px);
      min-height: 330px;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(16,34,53,.96), rgba(24,52,79,.88)),
        linear-gradient(180deg, #102235, #18344f);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .dashboard-hero::after {
      content: "";
      position: absolute;
      inset: auto -10% -35% 45%;
      height: 260px;
      background: linear-gradient(90deg, rgba(215,109,58,.34), rgba(127,154,128,.3));
      filter: blur(60px);
      opacity: .7;
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-row { display: flex; justify-content: space-between; gap: 20px; align-items: start; }
    .hero-title { margin: 14px 0 10px; font-size: clamp(36px, 6vw, 74px); line-height: .95; }
    .hero-meta { color: rgba(255,255,255,.74); font-weight: 700; line-height: 1.7; }
    .hero-stats { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 10px; }
    .stat-tile {
      border-radius: 22px;
      padding: 15px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(16px);
      min-width: 140px;
    }
    .stat-tile span { color: rgba(255,255,255,.66); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .stat-tile strong { display: block; margin-top: 7px; font-size: 22px; }
    .progress-bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; margin-top: 10px; }
    .progress-bar div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--orange-2), var(--sage)); }
    .route-visual {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 2px;
      margin-top: 24px;
    }
    .route-node {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.16);
      color: #fff;
      font-weight: 850;
      font-size: 13px;
    }
    .route-arrow { color: rgba(255,255,255,.48); }
    .flight-strip {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .flight-strip .mini-card {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.14);
      color: #fff;
      backdrop-filter: blur(16px);
    }
    .flight-strip .mini-card h3 { color: #fff; }
    .flight-strip .mini-card p { color: rgba(255,255,255,.7); }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }
    .section-head h2 { margin: 0; font-size: 24px; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .city-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .city-card {
      border: 0;
      text-align: left;
      cursor: pointer;
      padding: 20px;
      min-height: 238px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--ink);
    }
    .city-card:hover { transform: translateY(-3px); }
    .city-card h3 { margin: 12px 0 8px; font-size: 29px; }
    .city-card .city-date { color: var(--muted); font-size: 13px; font-weight: 800; }
    .city-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    .status-line { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 18px; color: var(--muted); font-size: 12px; font-weight: 800; }

    /* City/day pages */
    .page-hero {
      border-radius: 32px;
      padding: clamp(22px, 4vw, 34px);
      background: rgba(255,253,248,.86);
      border: 1px solid rgba(16,34,53,.08);
      box-shadow: var(--shadow-soft);
    }
    .crumb-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .page-title-row { display: flex; justify-content: space-between; gap: 20px; align-items: start; }
    .page-title { margin: 0; font-size: clamp(34px, 5vw, 58px); line-height: 1; }
    .page-intro { color: var(--muted); line-height: 1.75; max-width: 720px; font-size: 15px; }
    .date-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: thin;
    }
    .date-chip {
      flex: 0 0 auto;
      min-width: 138px;
      border: 1px solid rgba(16,34,53,.1);
      background: rgba(255,253,248,.76);
      border-radius: 18px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      transition: all .18s var(--ease);
    }
    .date-chip:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .date-chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .date-chip strong { display: block; font-size: 13px; }
    .date-chip span { display: block; margin-top: 4px; color: inherit; opacity: .68; font-size: 11px; font-weight: 800; }
    .hotel-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .info-card { padding: 18px; }
    .info-card h3 { margin: 0 0 10px; font-size: 15px; }
    .info-list { display: grid; gap: 10px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .day-header {
      padding: clamp(22px, 4vw, 32px);
      border-radius: 32px;
      background: rgba(255,253,248,.88);
      border: 1px solid rgba(16,34,53,.08);
      box-shadow: var(--shadow-soft);
    }
    .day-title-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
    .day-title-grid h1 { margin: 10px 0 10px; font-size: clamp(30px, 5vw, 52px); line-height: 1.04; }
    .density-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 9px 13px;
      background: var(--sage-2);
      color: #4f6c54;
      font-size: 12px;
      font-weight: 900;
    }
    .tab-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px;
      border-radius: 22px;
      background: rgba(16,34,53,.05);
      border: 1px solid rgba(16,34,53,.06);
    }
    .tab-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 17px;
      padding: 11px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 850;
      white-space: nowrap;
      cursor: pointer;
      min-height: 42px;
    }
    .tab-btn.active { background: var(--paper); color: var(--navy); box-shadow: 0 8px 18px rgba(16,34,53,.08); }
    .panel { padding: 18px; }
    .panel-head { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .panel-head h2 { margin: 0; font-size: 20px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .search-input {
      border: 1px solid rgba(16,34,53,.1);
      background: var(--paper);
      border-radius: 999px;
      min-height: 40px;
      padding: 0 14px;
      color: var(--ink);
      outline: none;
      min-width: 210px;
    }
    .timeline-list { display: grid; gap: 12px; }
    .timeline-item {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 14px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,253,248,.74);
      border: 1px solid rgba(16,34,53,.08);
      transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    }
    .timeline-item:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(16,34,53,.08); }
    .timeline-item.done { opacity: .68; }
    .timeline-time { color: var(--orange); font-weight: 900; font-size: 14px; padding-top: 2px; }
    .timeline-body h3 { margin: 0 0 7px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .timeline-body p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 13px; }
    .timeline-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .action-btn {
      border: 1px solid rgba(16,34,53,.08);
      background: var(--paper);
      color: var(--muted);
      min-height: 34px;
      border-radius: 13px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 850;
    }
    .action-btn.active { color: var(--navy); border-color: rgba(16,34,53,.2); background: var(--sand-2); }
    .action-btn.done { color: #4f6c54; background: var(--sage-2); }
    .item-note { margin-top: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(232,218,196,.36); color: #5f5146; font-size: 12px; line-height: 1.55; }

    .route-panel { display: grid; gap: 12px; }
    .route-plan {
      margin-bottom: 16px;
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(16,34,53,.07), rgba(127,154,128,.12));
      border: 1px solid rgba(16,34,53,.08);
    }
    .route-plan-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: start;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .route-plan-head h3 { margin: 0 0 7px; font-size: 20px; }
    .route-plan-head p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 13px; max-width: 620px; }
    .route-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .route-metric {
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,253,248,.72);
      border: 1px solid rgba(16,34,53,.08);
    }
    .route-metric strong { display: block; font-size: 17px; color: var(--navy); }
    .route-metric span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .route-stop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .route-stop-pill {
      display: flex;
      gap: 9px;
      align-items: start;
      padding: 11px;
      border-radius: 18px;
      background: rgba(255,253,248,.7);
      border: 1px solid rgba(16,34,53,.08);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .route-stop-pill b {
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: #fff;
      font-size: 12px;
    }
    .route-step {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      position: relative;
      padding-bottom: 12px;
    }
    .route-step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 16px;
      top: 36px;
      bottom: -2px;
      width: 1px;
      background: rgba(16,34,53,.14);
    }
    .route-dot {
      width: 34px;
      height: 34px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: #fff;
      position: relative;
      z-index: 1;
    }
    .route-card { padding: 14px; }
    .route-card strong { display: block; margin-bottom: 6px; }
    .food-grid, .budget-grid, .suggest-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .mini-card { padding: 15px; border-radius: 20px; background: rgba(255,253,248,.72); border: 1px solid rgba(16,34,53,.08); }
    .mini-card h3 { margin: 0 0 7px; font-size: 15px; }
    .mini-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .empty-state {
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
      border-radius: 30px;
      background:
        linear-gradient(145deg, rgba(255,253,248,.86), rgba(243,234,223,.68));
      border: 1px solid rgba(16,34,53,.08);
    }
    .empty-state h2 { margin: 12px 0 8px; font-size: clamp(28px, 5vw, 46px); }
    .empty-state p { color: var(--muted); line-height: 1.7; max-width: 620px; margin: 0 auto 18px; }
    .note-paper {
      width: 100%;
      min-height: 260px;
      border: 1px solid rgba(16,34,53,.08);
      outline: none;
      resize: vertical;
      border-radius: 26px;
      padding: 22px;
      background:
        linear-gradient(rgba(255,255,255,0) 31px, rgba(16,34,53,.05) 32px),
        var(--paper);
      background-size: 100% 32px;
      line-height: 32px;
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }
    .expense-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(16,34,53,.07);
    }
    .expense-row:last-child { border-bottom: 0; }

    /* Drawers and modals */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(16,34,53,.28);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: flex-end;
    }
    .drawer {
      width: min(480px, 100%);
      height: 100%;
      background: var(--paper);
      box-shadow: -30px 0 80px rgba(16,34,53,.24);
      padding: 22px;
      overflow: auto;
      animation: slideIn .24s var(--ease);
    }
    @keyframes slideIn { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .drawer-head h2 { margin: 0; font-size: 24px; }
    .check-group { margin-bottom: 18px; }
    .check-group h3 { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(16,34,53,.08);
      background: rgba(251,247,239,.6);
      margin-bottom: 8px;
      cursor: pointer;
    }
    .check-item input { accent-color: var(--navy); width: 18px; height: 18px; }
    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      background: rgba(16,34,53,.34);
      backdrop-filter: blur(10px);
      padding: 18px;
    }
    .modal {
      width: min(540px, 100%);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid rgba(255,255,255,.7);
      animation: popIn .2s var(--ease);
    }
    @keyframes popIn { from { transform: translateY(8px) scale(.98); opacity: .55; } to { transform: none; opacity: 1; } }
    .modal h2 { margin: 0 0 8px; }
    .map-modal-wrap { padding: 14px; }
    .map-modal {
      width: auto;
      max-width: none;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .field { display: grid; gap: 7px; margin-top: 14px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 850; }
    .field input, .field textarea, .field select {
      border: 1px solid rgba(16,34,53,.1);
      background: #fff;
      border-radius: 16px;
      padding: 12px 14px;
      outline: none;
      color: var(--ink);
    }
    .field textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
    .toast {
      position: fixed;
      z-index: 90;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 12px 16px;
      background: var(--navy);
      color: #fff;
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 800;
    }

    .mobile-nav {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 35;
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 7px;
      border-radius: 24px;
      background: rgba(255,253,248,.86);
      border: 1px solid rgba(16,34,53,.08);
      box-shadow: 0 18px 48px rgba(16,34,53,.18);
      backdrop-filter: blur(22px);
    }
    .mobile-nav button {
      border: 0;
      background: transparent;
      border-radius: 18px;
      min-height: 52px;
      display: grid;
      place-items: center;
      gap: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
    }
    .mobile-nav button.active { background: var(--navy); color: #fff; }

    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 230px minmax(0, 1fr); }
      .right-rail { display: none; }
      .city-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      .journey-grid { grid-template-columns: 1fr; }
      .hero-trip-card { min-height: 430px; }
      .topbar { height: 62px; padding: 0 14px; }
      .top-actions .btn:not(.keep-mobile):not(.home-mobile) { display: none; }
      .top-actions .home-mobile {
        display: inline-flex;
        width: 42px;
        min-width: 42px;
        padding: 0;
      }
      .top-actions .home-mobile span { display: none; }
      .app-shell { grid-template-columns: 1fr; padding: 16px 14px 96px; }
      .side-nav { display: none; }
      .mobile-nav { display: grid; }
      .hero-row, .page-title-row, .day-title-grid { grid-template-columns: 1fr; display: grid; }
      .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hotel-grid, .food-grid, .budget-grid, .suggest-grid { grid-template-columns: 1fr; }
      .route-metrics, .route-stop-grid { grid-template-columns: 1fr; }
      .timeline-item { grid-template-columns: 1fr; }
      .timeline-time { padding-top: 0; }
      .search-input { width: 100%; min-width: 0; }
    }

    /* Sunny Taiwan travel redesign */
    :root {
      --ocean: #1CA7EC;
      --teal: #00BFA6;
      --coral: #FF6B5A;
      --mango: #FFD166;
      --palm: #6BCB77;
      --cream: #FFF8EA;
      --ink-navy: #17324D;
      --paper-white: #FFFDF6;
      --sand-warm: #FFE7BD;
      --sky-soft: #DDF5FF;
      --rose-soft: #FFE7E1;
      --mint-soft: #E2FFF8;
      --night-red: #FF4D66;
      --city-blue: #3577FF;
      --accent: var(--ocean);
      --accent-2: var(--teal);
      --accent-3: var(--coral);
      --wash: rgba(28, 167, 236, .12);
      --navy: var(--ink-navy);
      --navy-2: #245174;
      --ivory: var(--cream);
      --paper: var(--paper-white);
      --sand: var(--sand-warm);
      --sand-2: #FFF1D0;
      --orange: var(--coral);
      --orange-2: #FF9D5C;
      --sage: var(--palm);
      --sage-2: #E6F9DD;
      --ink: var(--ink-navy);
      --muted: #68788B;
      --line: rgba(23, 50, 77, .12);
      --shadow: 0 26px 70px rgba(50, 95, 129, .18);
      --shadow-soft: 0 16px 38px rgba(72, 98, 120, .12);
      --radius-lg: 32px;
      --radius: 24px;
      --ease: cubic-bezier(.19, 1, .22, 1);
      --bounce: cubic-bezier(.34, 1.56, .64, 1);
      --font-display: "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", "Microsoft JhengHei", "Microsoft YaHei", system-ui, sans-serif;
      --font-serif: var(--font-display);
      --font-sans: "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", "Microsoft JhengHei", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "Manrope", "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", system-ui, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      color: var(--ink-navy);
      background-color: var(--cream);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(255, 209, 102, .34), transparent 26%),
        radial-gradient(circle at 88% 16%, rgba(28, 167, 236, .18), transparent 32%),
        radial-gradient(circle at 68% 78%, rgba(0, 191, 166, .16), transparent 30%),
        linear-gradient(115deg, rgba(255,255,255,.64), rgba(255,248,234,.78));
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .45;
      background-image:
        linear-gradient(90deg, rgba(23,50,77,.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(23,50,77,.035) 1px, transparent 1px),
        radial-gradient(circle, rgba(23,50,77,.08) 1px, transparent 1.4px);
      background-size: 88px 88px, 88px 88px, 18px 18px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,.18));
    }

    .travel-app {
      min-height: 100vh;
      position: relative;
      --accent: var(--ocean);
      --accent-2: var(--teal);
      --accent-3: var(--coral);
      --wash: rgba(28, 167, 236, .13);
      animation: pageDrift .42s var(--ease) both;
    }
    .travel-app::before,
    .travel-app::after {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(1px);
      opacity: .55;
      animation: lazyFloat 9s ease-in-out infinite;
    }
    .journey-page::after,
    .journey-wrap::before,
    .journey-wrap::after,
    .hero-trip-card::before,
    .city-card::before,
    .city-card::after,
    .dashboard-hero::before,
    .dashboard-hero::after,
    .page-hero::before,
    .page-hero::after,
    .day-header::before,
    .day-header::after,
    .date-chip::after,
    .mobile-nav button.active::after {
      pointer-events: none;
    }
    .travel-app::before {
      width: 320px;
      height: 320px;
      right: -90px;
      top: 110px;
      background: radial-gradient(circle, rgba(255,209,102,.42), rgba(255,107,90,.1) 56%, transparent 70%);
    }
    .travel-app::after {
      width: 250px;
      height: 250px;
      left: -70px;
      bottom: 120px;
      background: radial-gradient(circle, rgba(0,191,166,.22), rgba(28,167,236,.12) 58%, transparent 72%);
      animation-delay: -3s;
    }
    .theme-trip { --accent: var(--ocean); --accent-2: var(--teal); --accent-3: var(--coral); --wash: rgba(28,167,236,.13); }
    .theme-kaohsiung { --accent: #1CA7EC; --accent-2: #FF8A3D; --accent-3: #FFD166; --wash: rgba(28,167,236,.16); }
    .theme-kenting { --accent: #00BFA6; --accent-2: #FFD166; --accent-3: #1CA7EC; --wash: rgba(0,191,166,.14); }
    .theme-taipei { --accent: #3577FF; --accent-2: #FF4D66; --accent-3: #FFD166; --wash: rgba(53,119,255,.13); }

    .serif,
    .journey-title,
    .hero-title,
    .page-title,
    .day-title-grid h1,
    .empty-state h2,
    .hero-trip-card h2,
    .city-card h3 {
      font-family: var(--font-serif);
      font-variation-settings: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    .chip,
    .tag,
    .timeline-time,
    .date-chip strong,
    .stat-tile span,
    .stat-tile strong,
    .route-metric strong,
    .route-metric span {
      font-family: var(--font-mono);
    }

    .card,
    .soft-card {
      background: rgba(255, 253, 246, .9);
      border: 1px solid rgba(255, 163, 90, .18);
      box-shadow: var(--shadow-soft);
      backdrop-filter: none;
    }
    .card {
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255,255,255,.46), transparent 36%),
        radial-gradient(circle at 0% 0%, var(--wash), transparent 38%);
      opacity: .76;
    }
    .card > * { position: relative; z-index: 1; }

    .btn {
      border: 0;
      background: #fff;
      color: var(--ink-navy);
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(23, 50, 77, .1), inset 0 -2px 0 rgba(23,50,77,.04);
      font-family: var(--font-mono);
      font-weight: 700;
      transition: transform .22s var(--bounce), box-shadow .22s var(--ease), background .22s var(--ease);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 36px rgba(23, 50, 77, .16);
    }
    .btn .icon-sm,
    .btn .icon {
      transition: transform .22s var(--bounce);
    }
    .btn:hover .icon-sm,
    .btn:hover .icon {
      transform: translateX(2px) rotate(-4deg);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2) 52%, var(--accent-3));
      color: #fff;
      box-shadow: 0 18px 38px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .btn-ghost {
      background: rgba(255, 253, 246, .76);
      border: 1px solid rgba(23,50,77,.08);
      backdrop-filter: none;
    }
    .btn-danger {
      background: #FFF0EA;
      color: #C23D36;
      border: 1px solid rgba(255,107,90,.24);
    }
    .chip {
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(23,50,77,.08);
      color: var(--ink-navy);
      box-shadow: 0 6px 14px rgba(23,50,77,.05);
    }
    .chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-color: transparent;
      animation: chipPop .26s var(--bounce);
    }
    .tag {
      background: rgba(255, 209, 102, .28);
      color: #876115;
      border: 1px solid rgba(255, 209, 102, .3);
    }
    .tag.sage {
      background: rgba(107, 203, 119, .18);
      color: #2D7B45;
      border-color: rgba(107, 203, 119, .28);
    }
    .tag.orange {
      background: rgba(255, 107, 90, .16);
      color: #B64332;
      border-color: rgba(255,107,90,.25);
    }
    .tag.dark {
      background: rgba(28, 167, 236, .12);
      color: #0A6EA1;
      border-color: rgba(28,167,236,.2);
    }

    .journey-page {
      color: var(--ink-navy);
      background:
        radial-gradient(circle at 8% 16%, rgba(255,209,102,.78), transparent 22%),
        radial-gradient(circle at 82% 18%, rgba(28,167,236,.44), transparent 30%),
        radial-gradient(circle at 68% 88%, rgba(0,191,166,.32), transparent 28%),
        linear-gradient(145deg, #FFF8EA 0%, #E8FAFF 48%, #FFF2D8 100%);
      overflow: hidden;
    }
    .journey-page::before {
      opacity: .5;
      background:
        linear-gradient(110deg, transparent 0 14%, rgba(28,167,236,.26) 14.2% 14.5%, transparent 14.8% 36%, rgba(255,107,90,.26) 36.2% 36.5%, transparent 36.8%),
        repeating-linear-gradient(135deg, rgba(23,50,77,.04) 0 1px, transparent 1px 22px);
      background-size: 120% 120%, 100% 100%;
      mask-image: none;
      animation: routeDraw 7s ease-in-out infinite alternate;
    }
    .journey-page::after {
      content: "";
      position: absolute;
      width: min(58vw, 720px);
      height: min(58vw, 720px);
      right: -16%;
      bottom: -26%;
      border-radius: 999px;
      background:
        radial-gradient(circle at 44% 42%, rgba(255,209,102,.72), rgba(255,209,102,.28) 36%, transparent 37%),
        conic-gradient(from 18deg, rgba(255,107,90,.22), rgba(0,191,166,.18), rgba(28,167,236,.14), rgba(255,107,90,.22));
      animation: lazyFloat 8s ease-in-out infinite;
    }
    .journey-wrap {
      animation: heroIn .74s var(--ease) both;
    }
    .journey-wrap::before,
    .journey-wrap::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: -1;
      border-radius: 28px;
      border: 2px solid rgba(255,107,90,.22);
      background: rgba(255,255,255,.42);
      box-shadow: 0 18px 40px rgba(23,50,77,.08);
      animation: lazyFloat 7s ease-in-out infinite;
    }
    .journey-wrap::before {
      width: 110px;
      height: 72px;
      right: 22%;
      top: 4%;
      transform: rotate(9deg);
    }
    .journey-wrap::after {
      width: 84px;
      height: 84px;
      left: 2%;
      bottom: 10%;
      border-radius: 999px;
      border-color: rgba(28,167,236,.2);
      animation-delay: -2.2s;
    }
    .journey-kicker {
      color: #0A6EA1;
      background: rgba(255,255,255,.7);
      border: 1px solid rgba(28,167,236,.2);
      box-shadow: 0 12px 28px rgba(28,167,236,.08);
      backdrop-filter: none;
    }
    .journey-title {
      color: var(--ink-navy);
      text-shadow: 0 12px 28px rgba(255,209,102,.3);
    }
    .journey-subtitle {
      color: #50718B;
      font-weight: 700;
    }
    .hero-trip-card {
      color: #fff;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(28,167,236,.96), rgba(0,191,166,.94) 45%, rgba(255,107,90,.9) 100%);
      border: 1px solid rgba(255,255,255,.6);
      box-shadow: 0 36px 90px rgba(28, 129, 180, .28);
      transform-style: preserve-3d;
      animation: postcardIn .8s var(--bounce) .1s both;
    }
    .hero-trip-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .5;
      background:
        radial-gradient(circle at 84% 16%, rgba(255,209,102,.72), transparent 16%),
        linear-gradient(115deg, transparent 18%, rgba(255,255,255,.25) 18.3%, transparent 18.6% 48%, rgba(255,255,255,.2) 48.3%, transparent 48.7%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.1) 0 1px, transparent 1px 24px);
      animation: routeDraw 6s ease-in-out infinite alternate;
    }
    .hero-trip-card h2,
    .trip-label,
    .trip-route-line,
    .hero-trip-card .chip {
      color: #fff;
    }
    .trip-label { opacity: .88; }
    .trip-route-card {
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.34);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .hero-trip-card .chip {
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.26);
      box-shadow: none;
    }
    .future-card {
      color: rgba(23, 50, 77, .46);
      background: rgba(255,255,255,.66);
      border-color: rgba(23,50,77,.08);
      backdrop-filter: none;
      box-shadow: 0 14px 28px rgba(23,50,77,.08);
    }
    .future-card:hover {
      transform: translateY(-2px) rotate(.3deg);
    }
    .future-card strong {
      color: rgba(23, 50, 77, .74);
      font-family: var(--font-serif);
    }

    .journey-home {
      align-items: center;
      color: var(--ink-navy);
    }
    .journey-home .journey-wrap {
      width: min(1240px, 100%);
    }
    .journey-hero-layout {
      display: grid;
      grid-template-columns: minmax(0, .92fr) minmax(380px, .78fr);
      gap: clamp(20px, 4vw, 48px);
      align-items: center;
    }
    .journey-copy {
      display: grid;
      align-content: center;
      gap: 18px;
      min-height: 560px;
    }
    .journey-home .journey-kicker {
      width: fit-content;
      color: #0A6EA1;
      letter-spacing: 0;
      text-transform: none;
      font-family: var(--font-mono);
      font-weight: 700;

      box-shadow: 0 8px 18px rgba(23,50,77,.05);
    }

    .timeline-list {
      position: relative;
    }
    .timeline-list::before {
      content: "";
      position: absolute;
      left: 52px;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent), var(--mango), var(--accent-3), var(--accent-2));
      background-size: 100% 200%;
      animation: routeFlow 5.5s linear infinite;
    }
    .timeline-item {
      position: relative;
      grid-template-columns: 84px minmax(0, 1fr);
      background:
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,248,234,.84));
      border: 1px solid rgba(23,50,77,.08);
      box-shadow: 0 14px 26px rgba(23,50,77,.08);
      animation: itemRise .42s var(--ease) both;
    }
    .timeline-item:nth-child(2) { animation-delay: .04s; }
    .timeline-item:nth-child(3) { animation-delay: .08s; }
    .timeline-item:nth-child(4) { animation-delay: .12s; }
    .timeline-item:nth-child(5) { animation-delay: .16s; }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: 47px;
      top: 21px;
      width: 16px;
      height: 16px;
      border-radius: 999px 999px 999px 4px;
      transform: rotate(-45deg);
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(255,255,255,.85), 0 8px 18px color-mix(in srgb, var(--accent) 32%, transparent);
      z-index: 2;
    }
    .timeline-item:hover {
      transform: translateY(-4px) rotate(-.2deg);
      box-shadow: 0 22px 44px rgba(23,50,77,.13);
    }
    .timeline-item.done {
      opacity: 1;
      background: linear-gradient(180deg, rgba(236,255,238,.96), rgba(255,253,246,.86));
      border-color: rgba(107,203,119,.28);
    }
    .timeline-item.done::after {
      content: "✓";
      position: absolute;
      right: 16px;
      top: 16px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--palm);
      color: #fff;
      font-weight: 900;
      animation: checkPop .32s var(--bounce);
    }
    .timeline-time {
      color: var(--accent-3);
      background: rgba(255,255,255,.76);
      border-radius: 999px;
      padding: 7px 10px;
      height: fit-content;
      text-align: center;
      box-shadow: 0 8px 16px rgba(23,50,77,.06);
    }
    .timeline-body h3 {
      align-items: flex-start;
      font-size: 17px;
      color: var(--ink-navy);
    }
    .timeline-actions {
      gap: 7px;
    }
    .action-btn {
      border: 1px solid rgba(23,50,77,.08);
      background: #fff;
      color: #61758A;
      border-radius: 999px;
      box-shadow: 0 6px 14px rgba(23,50,77,.05);
      transition: transform .2s var(--bounce), background .2s var(--ease), color .2s var(--ease);
    }
    .action-btn:hover {
      transform: translateY(-2px);
      color: var(--ink-navy);
    }
    .action-btn.done {
      color: #fff;
      background: linear-gradient(135deg, var(--palm), var(--teal));
      animation: checkPop .28s var(--bounce);
    }
    .action-btn.active {
      color: #fff;
      background: linear-gradient(135deg, var(--coral), #FF9D5C);
      animation: heartPop .32s var(--bounce);
    }
    .item-note {
      background: #FFF5D8;
      color: #735B24;
      border: 1px dashed rgba(255,209,102,.5);
    }

    .route-panel {
      position: relative;
    }
    .route-step:not(:last-child)::after {
      left: 16px;
      background: linear-gradient(180deg, var(--accent), var(--mango), var(--accent-3), var(--accent-2));
      background-size: 100% 260%;
      animation: routeFlow 4.8s linear infinite;
    }
    .route-dot {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 22px color-mix(in srgb, var(--accent) 28%, transparent);
      animation: routePulse 2.6s ease-in-out infinite;
      font-family: var(--font-mono);
    }
    .route-card,
    .route-plan,
    .mini-card {
      background: rgba(255,255,255,.78);
      border-color: rgba(23,50,77,.08);
      box-shadow: 0 12px 24px rgba(23,50,77,.07);
    }
    .route-plan {
      background:
        radial-gradient(circle at 90% 12%, color-mix(in srgb, var(--mango) 34%, transparent), transparent 22%),
        linear-gradient(135deg, rgba(232,250,255,.92), rgba(255,248,234,.9));
      border-color: color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .route-metric {
      background: rgba(255,255,255,.72);
    }
    .route-stop-pill {
      background: rgba(255,255,255,.74);
    }
    .route-stop-pill b {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .food-grid .mini-card {
      background:
        linear-gradient(180deg, #FFFDF6, #FFF4D8);
      border: 1px solid rgba(255,209,102,.36);
      border-radius: 18px 18px 28px 18px;
      transform: rotate(-.35deg);
    }
    .food-grid .mini-card:nth-child(even) {
      transform: rotate(.45deg);
      background: linear-gradient(180deg, #FFF7F4, #FFECE6);
      border-color: rgba(255,107,90,.26);
    }
    .food-grid .mini-card h3 {
      color: #B15D13;
      font-family: var(--font-serif);
    }
    .budget-grid .mini-card {
      background:
        linear-gradient(90deg, transparent 0 10px, rgba(255,209,102,.22) 10px 12px, transparent 12px),
        linear-gradient(180deg, #FFFFFF, #FFF7E3);
      border: 1px dashed rgba(23,50,77,.16);
      border-radius: 20px;
    }
    .budget-grid .mini-card h3 {
      color: color-mix(in srgb, var(--accent) 64%, var(--ink-navy));
    }
    .info-list .mini-card {
      background: linear-gradient(135deg, #FFFDF6, #FFF2D8);
      border-color: rgba(255,209,102,.32);
    }
    .tip-card {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform .2s var(--bounce), background .2s var(--ease), border-color .2s var(--ease);
    }
    .tip-card:hover {
      transform: translateY(-2px) rotate(-.2deg);
    }
    .tip-card input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }
    .tip-card.important {
      background: linear-gradient(135deg, #FFF2D8, #FFE8E1);
      border-color: rgba(255,107,90,.28);
    }
    .tip-card.regular {
      background: linear-gradient(135deg, #FFF9DF, #FFFDF6);
      border-color: rgba(255,209,102,.36);
    }
    .tip-card.done {
      background: linear-gradient(135deg, #ECFFEE, #F8FFF0);
      border-color: rgba(107,203,119,.34);
      color: #2E7A45;
      animation: checkPop .28s var(--bounce);
    }
    .check-item:has(input:checked),
    .info-list .mini-card:has(input:checked) {
      background: linear-gradient(135deg, #ECFFEE, #F9FFF0);
      border-color: rgba(107,203,119,.34);
      color: #2E7A45;
    }

    .empty-state {
      background:
        radial-gradient(circle at 80% 16%, rgba(255,209,102,.55), transparent 24%),
        linear-gradient(135deg, rgba(255,253,246,.96), color-mix(in srgb, var(--accent) 11%, #FFFDF6));
      border-color: color-mix(in srgb, var(--accent) 18%, transparent);
      box-shadow: 0 22px 44px rgba(23,50,77,.08);
    }
    .note-paper {
      border: 1px solid rgba(255,209,102,.42);
      background:
        linear-gradient(90deg, rgba(255,107,90,.22) 0 2px, transparent 2px 100%),
        linear-gradient(rgba(255,255,255,0) 31px, rgba(28,167,236,.12) 32px),
        #FFF9E8;
      background-size: 100% 100%, 100% 32px, 100% 100%;
      box-shadow: 0 16px 34px rgba(23,50,77,.09), inset 0 0 0 10px rgba(255,255,255,.28);
      font-family: var(--font-sans);
    }

    .overlay {
      background: rgba(23, 50, 77, .24);
      backdrop-filter: blur(6px);
      animation: overlayIn .22s var(--ease) both;
    }
    .drawer {
      background:
        radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 28%),
        var(--cream);
      box-shadow: -26px 0 70px rgba(23,50,77,.2);
      animation: drawerTripIn .32s var(--bounce);
    }
    .drawer-head h2,
    .modal h2 {
      color: var(--ink-navy);
    }
    .check-item {
      background: rgba(255,255,255,.72);
      border-color: rgba(23,50,77,.08);
      transition: transform .18s var(--bounce), background .18s var(--ease);
    }
    .check-item:hover {
      transform: translateX(3px);
    }
    .check-item input {
      accent-color: var(--accent);
    }
    .modal {
      background: #FFFDF6;
      border: 1px solid rgba(255,209,102,.2);
      box-shadow: 0 28px 80px rgba(23,50,77,.2);
    }
    .field input,
    .field textarea,
    .field select {
      border-color: rgba(28,167,236,.16);
      background: #fff;
    }
    .toast {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 18px 38px color-mix(in srgb, var(--accent) 26%, transparent);
    }

    .mobile-nav {
      background: rgba(255,253,246,.9);
      border-color: rgba(255,163,90,.18);
      box-shadow: 0 18px 48px rgba(23,50,77,.18);
    }
    .mobile-nav button {
      color: #64788D;
      transition: transform .22s var(--bounce), background .22s var(--ease), color .22s var(--ease);
      position: relative;
    }
    .mobile-nav button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 12px 24px color-mix(in srgb, var(--accent) 24%, transparent);
    }
    .mobile-nav button.active::after {
      content: "";
      position: absolute;
      bottom: 5px;
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #fff;
      animation: chipPop .28s var(--bounce);
    }
    .mobile-nav button.active .icon-sm {
      animation: navBounce .44s var(--bounce);
    }

    /* Interactive Leaflet travel maps */
    .map-card {
      border-radius: 30px;
      overflow: hidden;
      background:
        radial-gradient(circle at 84% 10%, color-mix(in srgb, var(--accent-2) 28%, transparent), transparent 22%),
        linear-gradient(135deg, rgba(255,253,246,.96), #FFF3D9);
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      box-shadow: 0 24px 58px rgba(23,50,77,.14);
    }
    .map-card-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      padding: 20px 20px 12px;
      flex-wrap: wrap;
    }
    .map-title-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: color-mix(in srgb, var(--accent) 70%, var(--ink-navy));
      font: 800 12px/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .map-card-head h2 {
      margin: 8px 0 4px;
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
    }
    .map-card-head p {
      margin: 0;
      max-width: 660px;
      color: var(--muted);
      line-height: 1.6;
    }
    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .map-shell {
      position: relative;
      padding: 0 16px 16px;
    }
    .leaflet-map {
      height: 520px;
      width: 100%;
      border-radius: 26px;
      overflow: hidden;
      background: #E8FAFF;
      border: 1px solid rgba(23,50,77,.1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.38), 0 20px 44px rgba(23,50,77,.1);
      z-index: 1;
    }
    .overview-map .leaflet-map,
    .city-mini-map .leaflet-map {
      height: 420px;
    }
    .map-card.fullscreen-map-card {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 0;
      height: min(86vh, 920px);
      width: min(1220px, calc(100vw - 36px));
      border-radius: 34px;
      padding: 0;
    }
    .fullscreen-map-card .map-card-head {
      grid-column: 1;
      grid-row: 1;
      display: block;
      padding: 24px;
      overflow: auto;
      border-right: 1px solid rgba(23,50,77,.08);
    }
    .fullscreen-map-card .map-shell {
      grid-column: 2;
      grid-row: 1 / 4;
      padding: 16px;
      min-width: 0;
    }
    .fullscreen-map-card .leaflet-map {
      height: calc(min(86vh, 920px) - 32px);
    }
    .fullscreen-map-card .map-route-summary {
      grid-column: 1;
      grid-row: 2;
      grid-template-columns: 1fr;
      padding: 0 24px 14px;
    }
    .map-route-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 0 16px 16px;
    }
    .map-stat {
      border-radius: 20px;
      padding: 14px;
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(23,50,77,.08);
      box-shadow: 0 10px 20px rgba(23,50,77,.06);
    }
    .map-stat strong {
      display: block;
      font: 800 20px/1.1 var(--font-mono);
      color: var(--ink-navy);
      margin-bottom: 4px;
    }
    .map-stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .map-node-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 16px 18px;
      scroll-snap-type: x mandatory;
    }
    .fullscreen-map-card .map-node-strip {
      grid-column: 1;
      grid-row: 3;
      display: grid;
      padding: 0 24px 24px;
      overflow: auto;
    }
    .map-node-card {
      flex: 0 0 230px;
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      text-align: left;
      border: 1px solid rgba(23,50,77,.08);
      background: rgba(255,255,255,.78);
      border-radius: 20px;
      padding: 12px;
      color: var(--ink-navy);
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(23,50,77,.06);
      transition: transform .2s var(--bounce), box-shadow .2s var(--ease), border-color .2s var(--ease);
    }
    .map-node-card:hover,
    .map-node-card.active {
      transform: translateY(-3px);
      box-shadow: 0 18px 32px rgba(23,50,77,.12);
      border-color: color-mix(in srgb, var(--accent) 34%, transparent);
    }
    .map-node-card.active {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, #fff), #FFFDF6);
    }
    .map-node-num {
      width: 34px;
      height: 34px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font: 900 14px/1 var(--font-mono);
      box-shadow: 0 10px 18px color-mix(in srgb, var(--accent) 24%, transparent);
    }
    .map-node-card h3 {
      margin: 0 0 4px;
      font-size: 14px;
      line-height: 1.3;
    }
    .map-node-card p,
    .map-node-card small {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      display: block;
    }
    .map-node-card.suggested {
      border-style: dashed;
      background: rgba(255,255,255,.58);
    }
    .leaflet-container {
      font-family: var(--font-sans);
    }
    .leaflet-control-attribution {
      font-size: 10px;
      background: rgba(255,253,246,.74) !important;
      border-radius: 999px 0 0 0;
    }
    .travel-marker-shell {
      background: transparent;
      border: 0;
    }
    .travel-marker {
      --marker-color: var(--accent);
      width: 34px;
      height: 34px;
      border-radius: 999px 999px 999px 10px;
      transform: rotate(-45deg);
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--marker-color), color-mix(in srgb, var(--marker-color) 70%, var(--mango)));
      border: 3px solid #fff;
      color: #fff;
      box-shadow: 0 10px 22px color-mix(in srgb, var(--marker-color) 36%, transparent);
      transition: transform .2s var(--bounce), filter .2s var(--ease), box-shadow .2s var(--ease);
      position: relative;
    }
    .travel-marker span {
      transform: rotate(45deg);
      font: 900 13px/1 var(--font-mono);
    }
    .travel-marker.selected,
    .travel-marker.hovered {
      transform: rotate(-45deg) scale(1.22);
      filter: saturate(1.15);
      box-shadow: 0 0 0 8px color-mix(in srgb, var(--marker-color) 18%, transparent), 0 16px 30px color-mix(in srgb, var(--marker-color) 46%, transparent);
      z-index: 999 !important;
    }
    .travel-marker.done span {
      font-size: 0;
    }
    .travel-marker.done span::after {
      content: "✓";
      font-size: 15px;
    }
    .travel-marker.fav::after {
      content: "★";
      position: absolute;
      right: -8px;
      top: -9px;
      transform: rotate(45deg);
      width: 18px;
      height: 18px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--mango);
      color: #8A5300;
      border: 2px solid #fff;
      font-size: 10px;
    }
    .travel-marker.suggested {
      background: #FFFDF6;
      color: var(--ink-navy);
      border: 3px dashed var(--marker-color);
      box-shadow: 0 8px 18px rgba(23,50,77,.14);
    }
    .travel-marker.suggested span {
      color: var(--marker-color);
    }
    .leaflet-marker-icon {
      animation: markerPop .32s var(--bounce) both;
    }
    .leaflet-marker-icon:nth-child(2) { animation-delay: .04s; }
    .leaflet-marker-icon:nth-child(3) { animation-delay: .08s; }
    .leaflet-marker-icon:nth-child(4) { animation-delay: .12s; }
    .travel-line {
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 4px 7px rgba(23,50,77,.18));
      animation: mapLineFlow 4.4s linear infinite;
    }
    .line-flight { stroke-dasharray: 12 12; }
    .line-walk { stroke-dasharray: 2 9; }
    .line-scooter { stroke-dasharray: 14 5 4 5; }
    .line-taxi { stroke-dasharray: 10 7; }
    .line-hsr { stroke-dasharray: 18 6; }
    .line-bus { stroke-dasharray: 12 6; }
    .leaflet-popup-content-wrapper {
      border-radius: 18px;
      background: #FFFDF6;
      box-shadow: 0 14px 34px rgba(23,50,77,.18);
    }
    .leaflet-popup-content {
      margin: 12px 14px;
      min-width: 170px;
    }
    .map-popup-title {
      font-weight: 900;
      color: var(--ink-navy);
      margin-bottom: 4px;
    }
    .map-popup-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .timeline-item.map-selected {
      border-color: color-mix(in srgb, var(--accent) 38%, transparent);
      box-shadow: 0 22px 44px color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .map-placeholder-note {
      margin: 0 16px 16px;
      padding: 14px 16px;
      border-radius: 20px;
      background: rgba(255,209,102,.2);
      border: 1px dashed rgba(255,209,102,.5);
      color: #76581D;
      line-height: 1.55;
      font-size: 13px;
    }

    /* Typography polish: modern Chinese web feel, no stroke-contrast display font */
    .serif,
    .journey-title,
    .hero-title,
    .page-title,
    .day-title-grid h1,
    .empty-state h2,
    .hero-trip-card h2,
    .city-card h3,
    .postcard-content h2,
    .home-city-card strong,
    .home-card-head strong,
    .section-head h2,
    .panel-head h2,
    .map-card-head h2,
    .brand-title strong,
    .future-card strong {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.012em;
      font-variation-settings: normal;
    }
    .journey-title {
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .btn,
    .nav-btn,
    .tab-btn,
    .action-btn,
    .chip,
    .tag,
    .density-pill,
    .route-node,
    .top-actions .btn,
    .journey-quick-row button {
      font-family: var(--font-sans);
      font-weight: 700;
      letter-spacing: 0;
    }
    .top-actions .btn {
      font-size: 15px;
    }
    .panel-head h2,
    .section-head h2,
    .map-card-head h2 {
      line-height: 1.16;
    }
    .timeline-time,
    .date-chip strong,
    .route-metric strong,
    .route-metric span,
    .map-stat strong,
    .map-node-num,
    .travel-marker span {
      font-family: var(--font-mono);
      font-weight: 700;
    }

    @keyframes heroIn {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: none; }
    }
    @keyframes postcardIn {
      from { opacity: 0; transform: translateY(26px) rotate(-1.8deg) scale(.96); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pageDrift {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes panelReveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }

        hongkong: { lat: 22.308, lng: 113.9185, cityId: "hongkong", query: "Hong Kong International Airport", approximate: true }
      };
      return centers[cityId] || centers.taipei;
    }

    function locationFor(place, cityId) {
      const text = String(place || "").trim();
      if (locationCatalog[text]) return locationCatalog[text];
      const key = Object.keys(locationCatalog).find(name => text.includes(name) || name.includes(text));
      if (key) return locationCatalog[key];
      return cityCenter(cityId);
    }

    function suggestionPoint(id, title, locationName, tag, notes) {
      const loc = locationFor(locationName, "taipei");
      return {
        id,
        dayId: "taipei-suggested",
        cityId: "taipei",
        time: "",
        title,
        description: notes,
        type: "suggestion",
        locationName,
        lat: loc.lat,
        lng: loc.lng,
        transportFromPrevious: tag,
        googleMapsQuery: loc.query || locationName,
        notes,
        tag,
        suggested: true,
        approximate: !!loc.approximate
      };
    }

    function hydrateTimelineMapData() {
      days.forEach(day => {
        (day.timeline || []).forEach(item => {
          const loc = locationFor(item.place || item.title, day.cityId);
          item.dayId = day.id;
          item.cityId = loc.cityId || day.cityId;
          item.description = item.detail;
          item.locationName = item.place || item.title;
          item.lat = loc.lat;
          item.lng = loc.lng;
          item.transportFromPrevious = item.transport;
          item.googleMapsQuery = loc.query || `${item.locationName} ${day.cityName}`;
          item.notes = item.detail;
          item.approximate = !!loc.approximate;
        });
      });
    }

    function routePointFromPlace(day, entry, index, usedIds) {
      const [locationName, time, transport] = entry;
      const candidates = (day.timeline || []).filter(item => {
        if (usedIds.has(item.id)) return false;
        return item.place === locationName || item.locationName === locationName || item.title.includes(locationName) || locationName.includes(item.place || "");
      });
      const exactMatch = candidates.find(item => item.time === time);
      const timelineMatch = time ? exactMatch : candidates[0];
      if (timelineMatch) usedIds.add(timelineMatch.id);
      const loc = locationFor(locationName, day.cityId);
      return {
        id: timelineMatch?.id || `${day.id}-route-${index}`,
        dayId: day.id,
        cityId: loc.cityId || day.cityId,
        time: timelineMatch?.time || time || "",
        title: timelineMatch?.title || locationName,
        description: timelineMatch?.detail || (day.id === "d3" ? "西线骑行节点，实际停留可按体力缩短。" : "路线节点。"),
        type: timelineMatch?.type || (transport?.includes("车") || transport?.includes("捷运") || transport?.includes("高铁") ? "transport" : "sight"),
        locationName,
        lat: loc.lat,
        lng: loc.lng,
        transportFromPrevious: transport || timelineMatch?.transport || "步行",
        googleMapsQuery: loc.query || `${locationName} ${day.cityName}`,
        notes: timelineMatch?.detail || "",
        approximate: !!loc.approximate,
        routeIndex: index + 1
      };
    }

    function mapPointsForDay(day) {
      if (!day) return [];
      if (!day.planned) {
        return taipeiSuggestionPoints.map((point, index) => ({ ...point, id: `${day.id}-${point.id}`, dayId: day.id, routeIndex: index + 1 }));
      }
      const routeEntries = dayRoutePlaces(day.id);
      if (routeEntries.length) {
        const usedIds = new Set();
        return routeEntries.map((entry, index) => routePointFromPlace(day, entry, index, usedIds));
      }
      return (day.timeline || [])
        .filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng))
        .map((item, index) => ({ ...item, routeIndex: index + 1 }));
    }

    function mapPointsForCity(cityId) {
      if (cityId === "taipei") return taipeiSuggestionPoints.map((point, index) => ({ ...point, routeIndex: index + 1 }));
      const seen = new Set();
      const points = [];
      daysForCity(cityId).forEach(day => {
        mapPointsForDay(day).forEach(point => {
          if (point.cityId !== cityId || seen.has(point.locationName)) return;
          seen.add(point.locationName);
          points.push({ ...point, id: `city-${cityId}-${points.length}`, routeIndex: points.length + 1 });
        });
      });
      return points;
    }

    function mainTransportLabels(points) {
      const labels = [...new Set(points.slice(1).map(point => point.transportFromPrevious).filter(Boolean).map(label => label.replace(/\s+/g, " ")))];
      return labels.slice(0, 3).join(" / ");
    }
