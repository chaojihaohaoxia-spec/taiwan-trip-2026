    }

    async function copyRoute(dayId) {
      const day = tripData.daysById[dayId];
      if (!day) return;
      const points = mapPointsForDay(day);
      const lines = [
        `${day.label} · ${day.cityName} · 今日路线`,
        points.map((point, index) => `${index + 1}. ${point.locationName || point.title}`).join(" → ")
      ];
      await copyText(lines.join("\n"));
    }

    function authOtpRemainingSeconds() {
      return Math.max(0, Math.ceil((Number(appState.authOtpExpiresAt || 0) - Date.now()) / 1000));
    }

    function clearAuthOtpTimer() {
      if (authOtpTimer) window.clearInterval(authOtpTimer);
      authOtpTimer = null;
    }

    function scheduleAuthOtpTimer() {
      clearAuthOtpTimer();
      if (appState.authMode !== "otp") return;
      authOtpTimer = window.setInterval(() => {
        render();
        if (authOtpRemainingSeconds() <= 0) clearAuthOtpTimer();
      }, 1000);
    }

    function focusOtpInput(index = 0) {
      window.setTimeout(() => {
        const input = document.getElementById(`auth-otp-${index}`);
        input?.focus();
        input?.select?.();
      }, 0);
    }

    function setAuthOtpFlow(email, type) {
      setState({
        authMode: "otp",
        authOtpEmail: email,
        authOtpType: type,
        authOtpCode: "",
        authOtpExpiresAt: Date.now() + 60000,
        authLoading: false,
        authError: "",
        authMessage: ""
      });
      scheduleAuthOtpTimer();
      focusOtpInput(0);
    }

    function otpInputs() {
      return Array.from({ length: 6 }, (_, index) => document.getElementById(`auth-otp-${index}`));
    }

    function readOtpCodeFromInputs() {
      return otpInputs().map(input => input?.value || "").join("").replace(/\D/g, "").slice(0, 6);
    }

    function fillOtpCode(value, startIndex = 0) {
      const digits = String(value || "").replace(/\D/g, "").slice(0, 6);
      const inputs = otpInputs();
      digits.split("").forEach((digit, offset) => {
        const input = inputs[startIndex + offset];
        if (input) input.value = digit;
      });
      appState.authOtpCode = readOtpCodeFromInputs();
      focusOtpInput(Math.min(startIndex + digits.length, 5));
    }

    function handleOtpInput(index, event) {
      const input = event.target;
      const digits = String(input.value || "").replace(/\D/g, "");
      if (digits.length > 1) {
        input.value = "";
        fillOtpCode(digits, index);
        return;
      }
      input.value = digits;
      appState.authOtpCode = readOtpCodeFromInputs();
      if (digits && index < 5) focusOtpInput(index + 1);
    }

    function handleOtpKeydown(index, event) {
      if (event.key !== "Backspace" || event.target.value || index <= 0) return;
      event.preventDefault();
      const previous = document.getElementById(`auth-otp-${index - 1}`);
      if (previous) {
        previous.value = "";
        appState.authOtpCode = readOtpCodeFromInputs();
        focusOtpInput(index - 1);
      }
    }

    function handleOtpPaste(event) {
      event.preventDefault();
      fillOtpCode(event.clipboardData?.getData("text") || "", 0);
    }

    function setAuthMode(mode) {
      clearAuthOtpTimer();
      setState({
        authMode: mode === "signup" ? "signup" : "signin",
        authError: "",
        authMessage: "",
        authOtpEmail: "",
        authOtpType: "",
        authOtpCode: "",
        authOtpExpiresAt: 0
      });
    }

    function authErrorMessage(error) {
      const message = String(error?.message || error || "");
      if (/email not confirmed/i.test(message)) return "邮箱还没有完成验证，请先输入邮箱验证码。";
      if (/invalid login credentials/i.test(message)) return "邮箱或密码不正确，请重新检查。";
      if (/already registered|already exists/i.test(message)) return "这个邮箱已经注册，可以直接切换到登录。";
      if (/password/i.test(message)) return "密码不符合要求，请至少输入 6 位。";
      return message || "操作失败，请稍后再试。";
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      if (!supabaseClient) {
        setState({ currentView: "journey-select", authError: "", authMessage: "", authLoading: false });
        return;
      }
      const form = event.currentTarget;
      const email = form.email.value.trim();
      const password = form.password.value;
      const nickname = form.nickname?.value.trim() || "";
      if (!email || !password) {
        setState({ authError: "请填写邮箱和密码。", authMessage: "" });
        return;
      }
      if (appState.authMode === "signup" && !nickname) {
        setState({ authError: "请填写昵称。", authMessage: "" });
        return;
      }
      if (nickname.length > 20) {
        setState({ authError: "昵称最多 20 字。", authMessage: "" });
        return;
      }

      setState({ authLoading: true, authError: "", authMessage: "" });
      try {
        if (appState.authMode === "signup") await signUp(email, password, nickname);
        else await signIn(email, password);
      } catch (error) {
        setState({ authLoading: false, authError: authErrorMessage(error), authMessage: "" });
      }
    }

    async function signIn(email, password) {
      if (!supabaseClient) throw new Error("Supabase 尚未配置。");
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      currentUser = data?.session?.user || data?.user || currentUser;
      await refreshCollaboration(data?.session || null);
    }

    async function signUp(email, password, nickname) {
      if (!supabaseClient) throw new Error("Supabase 尚未配置。");
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: authRedirectUrl(),
          data: { display_name: nickname }
        }
      });
      if (error) throw error;
      if (data?.session) {
        currentUser = data.session.user;
        await refreshCollaboration(data.session);
        return;
      }
      setAuthOtpFlow(email, "signup");
    }

    async function requestOtpLogin() {
      if (!supabaseClient) {
        setState({ currentView: "journey-select", authError: "", authMessage: "", authLoading: false });
        return;
      }
      const email = document.getElementById("auth-email")?.value.trim() || "";
      if (!email || !email.includes("@")) {
        setState({ authError: "请先填写邮箱。", authMessage: "" });
        return;
      }
      setState({ authLoading: true, authError: "", authMessage: "" });
      try {
        const { error } = await supabaseClient.auth.signInWithOtp({ email });
        if (error) throw error;
        setAuthOtpFlow(email, "magiclink");
      } catch (error) {
        setState({ authLoading: false, authError: authErrorMessage(error), authMessage: "" });
      }
    }

    async function resendAuthOtp() {
      const email = appState.authOtpEmail;
      const type = appState.authOtpType === "magiclink" ? "magiclink" : "signup";
      if (!supabaseClient || !email || authOtpRemainingSeconds() > 0) return;
      setState({ authLoading: true, authError: "", authMessage: "" });
      try {
        const { error } = type === "signup"
          ? await supabaseClient.auth.resend({ type: "signup", email })
          : await supabaseClient.auth.signInWithOtp({ email });
        if (error) throw error;
        setAuthOtpFlow(email, type);
      } catch (error) {
        setState({ authLoading: false, authError: authErrorMessage(error), authMessage: "" });
      }
    }

    async function verifyAuthOtp() {
      const email = appState.authOtpEmail;
      const type = appState.authOtpType === "magiclink" ? "magiclink" : "signup";
      const code = readOtpCodeFromInputs() || String(appState.authOtpCode || "").replace(/\D/g, "").slice(0, 6);
      if (!email || code.length !== 6) {
        setState({ authError: "请输入 6 位数字验证码。", authMessage: "" });
        focusOtpInput(Math.min(code.length, 5));
        return;
      }
      setState({ authLoading: true, authError: "", authMessage: "" });
      try {
        const { data, error } = await supabaseClient.auth.verifyOtp({ email, token: code, type });
        if (error) throw error;
        const session = data?.session || (await supabaseClient.auth.getSession()).data?.session || null;
        currentUser = session?.user || data?.user || currentUser;
        clearAuthOtpTimer();
        await refreshCollaboration(session);
        setState({
          authMode: "signin",
          authLoading: false,
          authError: "",
          authMessage: "",
          authOtpEmail: "",
          authOtpType: "",
          authOtpCode: "",
          authOtpExpiresAt: 0
        }, false);
      } catch (error) {
        setState({ authLoading: false, authError: authErrorMessage(error), authMessage: "" });
        focusOtpInput(0);
      }
    }

    async function signOut() {
      if (!supabaseClient) {
        setState({ currentView: "journey-select", authLoading: false, authError: "", authMessage: "" });
        return;
      }
      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;
        resetAuthState();
      } catch (error) {
        toast(authErrorMessage(error));
      }
    }

    function resetAuthState() {
      clearAuthOtpTimer();
      currentUser = null;
      currentMembership = null;
      tripMembers = [];
      checkins = [];
      generatedInviteLink = "";
      authNotice = "";
      unsubscribeTripStateRealtime();
      unsubscribeExpensesRealtime();
      pendingCloudSaveKeys.clear();
      window.clearTimeout(cloudSaveTimer);
      localStorage.removeItem(STORAGE_KEY);
      appState = normalizeState({ ...defaultState, currentView: "auth", authMode: "signin", authError: "", authMessage: "", authLoading: false, userTrips: [], selectedTrip: null });
      render();
    }

    function bindAuthStateListener() {
      if (!supabaseClient || authStateListener) return;
      const { data } = supabaseClient.auth.onAuthStateChange(async (event, session) => {
        currentUser = session?.user || null;
        if (event === "SIGNED_IN" && currentUser) {
          clearAuthOtpTimer();
          await refreshCollaboration(session);
        }
        if (event === "SIGNED_OUT") resetAuthState();
      });
      authStateListener = data?.subscription || true;
    }

    async function initializeAuthGate() {
      updateCloudSyncBanner();
      if (!supabaseClient) {
        setState({ currentView: "journey-select", authLoading: false, authError: "", authMessage: "" });
        return;
      }

      bindAuthStateListener();
      setState({ currentView: "auth", authLoading: true, authError: "", authMessage: "" });
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (!session) {
          currentUser = null;
          setState({
            currentView: "auth",
            authLoading: false,
            authError: "",
            authMessage: pendingInviteCode ? "检测到邀请链接，请先登录或注册，登录后会自动加入行程。" : ""
          });
          return;
        }
        currentUser = session.user;
        await refreshCollaboration(session);
      } catch (error) {
        console.warn("Supabase auth unavailable, falling back to local mode.", error);
        setState({ currentView: "journey-select", authLoading: false, authError: "", authMessage: "" });
      }
    }

    async function saveExpense() {
      if (!requireEditor("添加费用")) return;
      if (!expenseDraft || expenseSaving) return;
      const date = document.getElementById("expense-date")?.value || expenseDraft.date || currentTaiwanDate();
      const description = document.getElementById("expense-description")?.value.trim() || "";
      const amount = parseExpenseAmount(document.getElementById("expense-amount")?.value || expenseDraft.amount);
      const currency = normalizeExpenseCurrency(document.getElementById("expense-currency")?.value || expenseDraft.currency);
      const paidBy = document.getElementById("expense-paid-by")?.value.trim() || expenseDraft.paid_by || currentUserHandle();
      if (!description || !amount) {
        toast("请填写描述和金额");
        return;
      }
      const dayId = dayIdForDate(date) || expenseDraft.day_id || selectedDay()?.id || "";
      const splitWith = expenseDraft.split_with?.length ? expenseDraft.split_with : [paidBy];
      const baseExpense = normalizeExpenseRecord({
        id: createExpenseId(),
        trip_id: activeTripId(),
        date,
        day_id: dayId,
        category: expenseDraft.category,
        description,
        amount,
        currency,
        amount_hkd: expenseAmountToHkd(amount, currency),
        paid_by: paidBy,
        split_with: splitWith,
        receipt_url: expenseDraft.receipt_url,
        created_by: currentUser?.id || currentUserHandle(),
        created_at: new Date().toISOString()
      });
      expenseSaving = true;
      render();
      try {
        let savedExpense = baseExpense;
        if (expenseDraft.receiptFile && canUseCloudExpenses()) {
          savedExpense = { ...savedExpense, receipt_url: await uploadExpenseReceipt(expenseDraft.receiptFile) };
        } else if (expenseDraft.receiptFile && !canUseCloudExpenses()) {
          toast("本地模式不会持久化小票图片，已保存费用");
        }
        if (canUseCloudExpenses()) {
          const payload = {
            ...savedExpense,
            created_by: currentUser.id
          };
          const { data, error } = await supabaseClient
            .from("expenses")
            .insert(payload)
            .select(expenseSelectFields())
            .single();
          if (error) throw error;
          savedExpense = normalizeExpenseRecord(data || savedExpense);
        }
        setState({ expenses: mergeExpenseLists(appState.expenses, [savedExpense]), modal: null });
        resetExpenseDraft();
        toast("费用已保存");
      } catch (error) {
        const localExpense = { ...baseExpense, receipt_url: null };
        setState({ expenses: mergeExpenseLists(appState.expenses, [localExpense]), modal: null });
        resetExpenseDraft();
        toast(`云端保存失败，已本地保存：${error.message || "请检查配置"}`, 2600);
      } finally {
        expenseSaving = false;
      }
    }

    function clipboardWriteWithTimeout(text) {
      return new Promise((resolve, reject) => {
        if (!navigator.clipboard?.writeText) {
          reject(new Error("Clipboard API unavailable"));
          return;
        }
        let settled = false;
        const timer = window.setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error("Clipboard timeout"));
        }, 700);
        navigator.clipboard.writeText(text).then(() => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timer);
          resolve();
        }).catch(error => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timer);
          reject(error);
        });
      });
    }

    async function copyCoordinates(lat, lng) {
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        toast("没有可复制的坐标", 1500);
        return;
      }
      const text = `${lat},${lng}`;
      try {
        await clipboardWriteWithTimeout(text);
        toast("坐标已复制", 1500);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        document.body.removeChild(textarea);
        toast(copied ? "坐标已复制" : "复制失败，请手动复制", 1500);
      }
    }

    }

    function kmlCityLabel(cityId) {
      return { kaohsiung: "高雄", kenting: "墾丁", taipei: "台北" }[cityId] || tripData.cities[cityId]?.name || cityId;
    }

    function dayLabelForKML(day) {
      return `${day.shortLabel || day.label}（${day.dayNo || day.label}）`;
    }

    function scheduleLabelsForLocation(name, loc) {
      const labels = [];
      days.forEach(day => {
        const matchesDay = mapPointsForDay(day).some(point => {
          const pointName = point.locationName || point.place || point.title;
          const pointLoc = catalogLocationFor(pointName);
          return pointName === name || point.title === name || pointLoc === loc;
        });
        if (matchesDay) labels.push(dayLabelForKML(day));
      });
      return [...new Set(labels)];
    }

    function placemarkForKML(name, loc) {
      const scheduleLabels = scheduleLabelsForLocation(name, loc);
      const description = scheduleLabels.length
        ? `${kmlCityLabel(loc.cityId)} · ${scheduleLabels.join("、")}`
        : `${kmlCityLabel(loc.cityId)} · 行程地点`;
      return `      <Placemark>
        <name>${kmlEsc(name)}</name>
        <description>${kmlEsc(description)}</description>
        <styleUrl>#${kmlEsc(loc.cityId)}</styleUrl>
        <Point><coordinates>${loc.lng},${loc.lat},0</coordinates></Point>
      </Placemark>`;
    }

    function generateKML() {
      const cityOrder = ["kaohsiung", "kenting", "taipei"];
      const folders = cityOrder.map(cityId => {
        const placemarks = Object.entries(locationCatalog)
          .filter(([, loc]) => loc.cityId === cityId && Number.isFinite(loc.lat) && Number.isFinite(loc.lng))
          .map(([name, loc]) => placemarkForKML(name, loc))
          .join("\n");
        return `    <Folder>
      <name>${kmlEsc(kmlCityLabel(cityId))}</name>
${placemarks}
    </Folder>`;
      }).join("\n");

      const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>台湾旅行 2026</name>
    <description>高雄・墾丁・台北 9天8夜行程</description>
    <Style id="kaohsiung"><IconStyle><color>ffec1cff</color></IconStyle></Style>
    <Style id="kenting"><IconStyle><color>ff06bfa6</color></IconStyle></Style>
    <Style id="taipei"><IconStyle><color>ffff4d66</color></IconStyle></Style>
${folders}
  </Document>
</kml>`;

      const blob = new Blob([kmlContent], { type: "application/vnd.google-earth.kml+xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "taiwan-trip-2026.kml";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
      toast("KML 文件已生成", 1500);
    }

    function reportDateLabel(day) {
      const match = String(day.date || "").match(/^(.+?)\s+(周.)$/);
      return match ? `${day.dayNo} · ${match[1]}（${match[2]}）` : `${day.dayNo} · ${day.date}`;
    }

    function reportTypeIcon(type) {
      if (type === "transport") return "✈";
      if (type === "hotel") return "🏨";
      if (type === "food" || type === "night-market") return "🍜";
      if (type === "activity") return "⭐";
      if (type === "sunset") return "🌅";
      return "📍";
    }

    function reportRatingClass(rating) {
      return {
        "夯": "report-rating-hang",
        "顶级": "report-rating-top",
        "人上人": "report-rating-above",
        "NPC": "report-rating-npc",
        "拉完了": "report-rating-bad"
      }[rating] || "";
    }

    function reportRatingBadge(rating) {
      if (!rating) return "";
      return `<span class="report-rating-badge ${reportRatingClass(rating)}">${esc(rating)}</span>`;
    }

    function reportCoverRatings() {
      const stats = spotRatingStats();
      const keys = ["夯", "顶级", "人上人"];
      const hasRatings = keys.some(key => stats.counts[key] > 0);
      if (!hasRatings) return "";
      return `<div class="report-rating-row">${keys.map(key => `<span class="report-rating-badge ${reportRatingClass(key)}">${esc(key)} ×${stats.counts[key]}</span>`).join("")}</div>`;
    }

    function reportItemRating(item) {
      const spot = spotEntryForTimelineItem(item);
      return spot ? spotReview(spot.id).rating : null;
    }

    function renderReportDay(day) {
      const items = timelineItemsForDay(day);
      return `
        <section class="report-day">
          <h2>${esc(reportDateLabel(day))}</h2>
          <div class="report-day-subtitle">${esc(day.cityName)} | ${esc(day.title)}</div>
          ${items.length ? items.map(item => `
            <div class="report-item">
              <time>${esc(item.time || "")}</time>
              <div><strong>${reportTypeIcon(item.type)} ${esc(item.title)}</strong><small>${esc(item.detail || itemLocationName(item) || "")}</small></div>
              ${reportRatingBadge(reportItemRating(item))}
            </div>
          `).join("") : `<p>台北段保留弹性，现场补齐。</p>`}
        </section>
      `;
    }

    function renderReportSummary() {
      const stats = expenseStats();
      const topSpots = rankedSpotEntries().filter(spot => ["夯", "顶级"].includes(spot.review.rating)).slice(0, 8);
      return `
        <section class="report-summary">
          <h2>旅行总结</h2>
          <div class="report-summary-grid">
            <div class="report-box">
              <h3>费用总计</h3>
              <p>${stats.expenses.length ? formatHkd(stats.totalHkd) : "尚未记录费用"}</p>
            </div>
            <div class="report-box">
              <h3>评级 TOP 榜</h3>
              ${topSpots.length ? topSpots.map(spot => `<p>${reportRatingBadge(spot.review.rating)} ${esc(spot.name)} · ${esc(spot.cityName)}</p>`).join("") : "<p>还没有夯/顶级地点。</p>"}
            </div>
          </div>
          <div class="report-box report-thoughts">
            <h3>旅行感想</h3>
          </div>
        </section>
      `;
    }

    function buildTravelReportHtml() {
      return `
        <section class="report-cover">
          <h1>台湾旅行 2026</h1>
          <p>高雄 · 墾丁 · 台北</p>
          <p>2026年5月11日 – 5月19日</p>
          <p>9天8夜</p>
          <p class="report-route">香港 → 高雄 → 墾丁 → 台北 → 香港</p>
          ${reportCoverRatings()}
        </section>
        ${days.map(renderReportDay).join("")}
        ${renderReportSummary()}
      `;
    }

    function generateTravelReport() {
      document.getElementById("print-report")?.remove();
      const report = document.createElement("div");
      report.id = "print-report";
      report.innerHTML = buildTravelReportHtml();
      document.body.appendChild(report);
      const cleanup = () => report.remove();
      window.addEventListener("afterprint", cleanup, { once: true });
      window.setTimeout(() => {
        if (document.body.contains(report)) cleanup();
      }, 60000);
      window.requestAnimationFrame(() => window.print());
    }

    function openMaps(query) {
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, "_blank", "noopener");
    }
    function openMapsUrl(url) {
      window.open(url, "_blank", "noopener");
    }
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        toast("已复制");
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        document.body.removeChild(textarea);
        toast(copied ? "已复制" : "复制失败，请手动复制");
      }
    }
    async function copyDayPlan() {
      const day = selectedDay();
      if (!day) return;
      const lines = [
        `${day.label} · ${day.date} · ${day.cityName}`,
        `今日重点：${day.focus}`,
        ...timelineItemsForDay(day).map(item => `${item.time} ${item.title}`)
      ];
      await copyText(lines.join("\\n"));
    }
    async function copyTripSummary() {
      await copyText(`${tripData.title}\\n${tripData.range}\\n路线：${tripData.route.join(" → ")}`);
    }
    function toast(message, duration = 1800) {
      appState.toast = message;
      render();
      window.clearTimeout(window.__toastTimer);
      window.__toastTimer = window.setTimeout(() => {
        appState.toast = "";
        render();
      }, duration);
    }
    function resetLocalData() {
      if (!confirm("确定要重置本地保存的状态、备注、账本和清单吗？")) return;
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(EXPENSES_STORAGE_KEY);
      appState = { ...defaultState, currentView: "journey-select" };
      render();
    }
    function mobileGoCity() {
      if (appState.selectedCity) setState({ currentView: "city", selectedDay: null });
      else goDashboard();
    }
    function mobileGoDay() {
      if (appState.selectedDay) setState({ currentView: "day" });
      else if (appState.selectedCity) setState({ currentView: "city" });
      else goDashboard();
    }
    function nearestTripDayId() {
      const todayId = dayIdForDate(currentTaiwanDate());
      if (todayId && tripData.daysById[todayId]) return todayId;
      const now = new Date(`${currentTaiwanDate()}T00:00:00+08:00`).getTime();
      let best = days[0];
      let bestDelta = Infinity;
      days.forEach(day => {
        const time = new Date(`${dateForDayId(day.id)}T00:00:00+08:00`).getTime();
        const delta = Math.abs(time - now);
        if (delta < bestDelta) {
          best = day;
          bestDelta = delta;
        }
      });
      return best?.id || "";
    }
    function mobileGoItinerary() {
      if (appState.selectedDay) {
        setState({ currentView: "day", selectedTab: "timeline", searchQuery: "", typeFilter: "all", fabOpen: false });
        return;
      }
      const dayId = nearestTripDayId();
      if (dayId && dayIdForDate(dayId) === currentTaiwanDate()) {
        const day = tripData.daysById[dayId];
        selectDay(day.id, day.cityId);
        return;
      }
      goDashboard();
    }
    function mobileGoMap() {
      if (appState.selectedDay) {
        setState({ currentView: "day", selectedTab: "route", searchQuery: "", typeFilter: "all", fabOpen: false });
        return;
      }
      if (appState.selectedCity) {
        const firstDay = daysForCity(appState.selectedCity)[0];
        if (firstDay) selectDay(firstDay.id, appState.selectedCity);
        setState({ selectedTab: "route", fabOpen: false });
        return;
      }
      enterTripMap();
    }

    async function init() {
      await initializeAuthGate();
    }

    init();

    // 每分钟重新渲染一次，让「现在/下一项」状态保持实时
    setInterval(() => {
      if (getTripPhase().phase === "during") render();
    }, 60 * 1000);
